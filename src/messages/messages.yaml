  weightsIntro:
    en-GB: "Prices are broken down by the sizes people actually buy: medians for 1g, 3.5g, 7g, 14g and 28g — an eighth, a quarter, a half ounce and an ounce."
    de-DE: "Die Preise sind nach den Mengen aufgeschlüsselt, die tatsächlich gekauft werden: Mediane für 1g, 3.5g, 7g, 14g und 28g — ein Achtel, ein Viertel, eine halbe Unze und eine Unze."
    fr-FR: "Les prix sont détaillés par les quantités réellement achetées : médianes pour 1g, 3.5g, 7g, 14g et 28g — un huitième, un quart, une demi-once et une once."
    pt-PT: "Os preços são detalhados pelos tamanhos que as pessoas realmente compram: medianas para 1g, 3.5g, 7g, 14g e 28g — um oitavo, um quarto, meia onça e uma onça."
    it-IT: "I prezzi sono suddivisi per le quantità che si comprano davvero: mediane per 1g, 3.5g, 7g, 14g e 28g — un ottavo, un quarto, mezza oncia e un'oncia."
    es-ES: "Los precios se desglosan por las cantidades que realmente se compran: medianas de 1g, 3.5g, 7g, 14g y 28g — un octavo, un cuarto, media onza y una onza."
    el-GR: "Οι τιμές αναλύονται στις ποσότητες που αγοράζονται πραγματικά: διάμεσες τιμές για 1g, 3.5g, 7g, 14g και 28g — ένα όγδοο, ένα τέταρτο, μισή ουγγιά και μία ουγγιά."
    cs-CZ: "Ceny jsou rozdělené podle velikostí, které lidé skutečně kupují: mediány pro 1g, 3.5g, 7g, 14g a 28g — osminka, čtvrtka, půl unce a unce."
    pl-PL: "Ceny są rozbite według rozmiarów, które ludzie faktycznie kupują: mediany dla 1g, 3.5g, 7g, 14g i 28g — jedna ósma, jedna czwarta, pół uncji i uncja."
