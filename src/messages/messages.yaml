    intro:
      en-GB: "BiggyIndex is an independent, read-only index of publicly available Little Biggy listings. The site is deliberately simple, and that extends to privacy — there is very little data we could collect, and we choose not to collect more."
      de-DE: "BiggyIndex ist ein unabhängiger, rein lesender Index öffentlich verfügbarer Little Biggy Angebote. Die Seite ist bewusst einfach gehalten – das gilt auch für den Datenschutz: Es gibt nur sehr wenige Daten, die wir überhaupt erfassen könnten, und wir entscheiden uns, nicht mehr zu erfassen."
      fr-FR: "BiggyIndex est un index indépendant, en lecture seule, des annonces Little Biggy publiquement disponibles. Le site est volontairement simple, et cela vaut aussi pour la confidentialité — il y a très peu de données que nous pourrions collecter, et nous choisissons de ne pas en collecter davantage."
      pt-PT: "O BiggyIndex é um índice independente e só de leitura das listagens públicas do Little Biggy. O site é deliberadamente simples, e isso estende-se à privacidade — há muito poucos dados que poderíamos recolher, e escolhemos não recolher mais."
      it-IT: "BiggyIndex è un indice indipendente e di sola lettura degli annunci Little Biggy pubblicamente disponibili. Il sito è volutamente semplice, e questo vale anche per la privacy: ci sono pochissimi dati che potremmo raccogliere, e scegliamo di non raccoglierne di più."
      es-ES: "BiggyIndex es un índice independiente y de solo lectura de los anuncios públicos de Little Biggy. El sitio es deliberadamente sencillo, y eso se extiende a la privacidad: hay muy pocos datos que podríamos recopilar, y elegimos no recopilar más."
      el-GR: "Το BiggyIndex είναι ένα ανεξάρτητο ευρετήριο μόνο για ανάγνωση των δημόσια διαθέσιμων καταχωρίσεων του Little Biggy. Ο ιστότοπος είναι σκόπιμα απλός, και αυτό ισχύει και για το απόρρητο — υπάρχουν ελάχιστα δεδομένα που θα μπορούσαμε να συλλέξουμε, και επιλέγουμε να μη συλλέγουμε περισσότερα."
      cs-CZ: "BiggyIndex je nezávislý index veřejně dostupných nabídek Little Biggy, určený pouze ke čtení. Web je záměrně jednoduchý a to platí i pro soukromí — existuje jen velmi málo dat, která bychom mohli sbírat, a rozhodli jsme se nesbírat víc."
      pl-PL: "BiggyIndex to niezależny indeks publicznie dostępnych ofert Little Biggy, działający tylko do odczytu. Strona jest celowo prosta i dotyczy to również prywatności — jest bardzo niewiele danych, które moglibyśmy zbierać, i świadomie nie zbieramy więcej."
    sections:
      noAccounts:
        heading:
          en-GB: "No accounts, no purchases"
          de-DE: "Keine Konten, keine Käufe"
          fr-FR: "Pas de comptes, pas d’achats"
          pt-PT: "Sem contas, sem compras"
          it-IT: "Nessun account, nessun acquisto"
          es-ES: "Sin cuentas, sin compras"
          el-GR: "Χωρίς λογαριασμούς, χωρίς αγορές"
          cs-CZ: "Žádné účty, žádné nákupy"
          pl-PL: "Bez kont, bez zakupów"
        body:
          en-GB: "You cannot create an account, log in, or buy anything on BiggyIndex. We never ask for your name, email address, payment details, or delivery address. Any purchase happens on Little Biggy, under Little Biggy's own terms and privacy practices — nothing about it passes through us."
          de-DE: "Auf BiggyIndex kann man kein Konto erstellen, sich nicht anmelden und nichts kaufen. Wir fragen nie nach Namen, E-Mail-Adresse, Zahlungsdaten oder Lieferadresse. Jeder Kauf findet auf Little Biggy statt, unter dessen eigenen Bedingungen und Datenschutzpraktiken – nichts davon läuft über uns."
          fr-FR: "Vous ne pouvez pas créer de compte, vous connecter ou acheter quoi que ce soit sur BiggyIndex. Nous ne demandons jamais votre nom, votre adresse e-mail, vos coordonnées de paiement ou votre adresse de livraison. Tout achat se fait sur Little Biggy, selon ses propres conditions et pratiques de confidentialité — rien ne passe par nous."
          pt-PT: "Não é possível criar conta, iniciar sessão ou comprar nada no BiggyIndex. Nunca pedimos o seu nome, endereço de e-mail, dados de pagamento ou morada de entrega. Qualquer compra acontece no Little Biggy, sob os termos e práticas de privacidade do próprio Little Biggy — nada disso passa por nós."
          it-IT: "Su BiggyIndex non è possibile creare un account, accedere o acquistare nulla. Non chiediamo mai nome, indirizzo e-mail, dati di pagamento o indirizzo di consegna. Qualsiasi acquisto avviene su Little Biggy, secondo i termini e le pratiche di privacy di Little Biggy — nulla di tutto ciò passa da noi."
          es-ES: "No puedes crear una cuenta, iniciar sesión ni comprar nada en BiggyIndex. Nunca pedimos tu nombre, correo electrónico, datos de pago ni dirección de entrega. Cualquier compra ocurre en Little Biggy, bajo sus propios términos y prácticas de privacidad: nada de eso pasa por nosotros."
          el-GR: "Δεν μπορείτε να δημιουργήσετε λογαριασμό, να συνδεθείτε ή να αγοράσετε κάτι στο BiggyIndex. Δεν ζητάμε ποτέ το όνομά σας, το email σας, στοιχεία πληρωμής ή διεύθυνση παράδοσης. Κάθε αγορά γίνεται στο Little Biggy, με τους δικούς του όρους και πρακτικές απορρήτου — τίποτα από αυτά δεν περνά από εμάς."
          cs-CZ: "Na BiggyIndex si nemůžete vytvořit účet, přihlásit se ani nic koupit. Nikdy nechceme vaše jméno, e-mail, platební údaje ani doručovací adresu. Každý nákup probíhá na Little Biggy, podle jeho vlastních podmínek a zásad ochrany soukromí — nic z toho nejde přes nás."
          pl-PL: "Na BiggyIndex nie można założyć konta, zalogować się ani niczego kupić. Nigdy nie prosimy o imię i nazwisko, adres e-mail, dane płatnicze ani adres dostawy. Każdy zakup odbywa się na Little Biggy, na jego własnych warunkach i zasadach prywatności — nic z tego nie przechodzi przez nas."
      noTracking:
        heading:
          en-GB: "No analytics or tracking"
          de-DE: "Keine Analytics, kein Tracking"
          fr-FR: "Pas d’analytics ni de traçage"
          pt-PT: "Sem analytics nem rastreamento"
          it-IT: "Nessuna analisi né tracciamento"
          es-ES: "Sin analíticas ni rastreo"
          el-GR: "Χωρίς analytics ή παρακολούθηση"
          cs-CZ: "Žádná analytika ani sledování"
          pl-PL: "Bez statystyk i śledzenia"
        body:
          en-GB: "We do not run analytics or advertising scripts, and we do not use tracking pixels or fingerprinting. We do not build visitor profiles, and we have no personal data to sell or share with anyone."
          de-DE: "Wir setzen keine Analyse- oder Werbeskripte ein und verwenden weder Tracking-Pixel noch Fingerprinting. Wir erstellen keine Besucherprofile und haben keine personenbezogenen Daten, die wir verkaufen oder mit irgendjemandem teilen könnten."
          fr-FR: "Nous n’utilisons aucun script d’analyse ou de publicité, ni pixels de suivi ou empreinte numérique. Nous ne créons pas de profils de visiteurs et nous n’avons aucune donnée personnelle à vendre ou à partager avec qui que ce soit."
          pt-PT: "Não usamos scripts de analytics nem de publicidade, e não utilizamos pixels de rastreamento nem fingerprinting. Não criamos perfis de visitantes e não temos dados pessoais para vender ou partilhar com ninguém."
          it-IT: "Non utilizziamo script di analisi o pubblicitari, né pixel di tracciamento o fingerprinting. Non creiamo profili dei visitatori e non abbiamo dati personali da vendere o condividere con nessuno."
          es-ES: "No usamos scripts de analítica ni de publicidad, y no utilizamos píxeles de seguimiento ni fingerprinting. No creamos perfiles de visitantes y no tenemos datos personales que vender o compartir con nadie."
          el-GR: "Δεν χρησιμοποιούμε σενάρια analytics ή διαφημίσεων, ούτε pixels παρακολούθησης ή fingerprinting. Δεν δημιουργούμε προφίλ επισκεπτών και δεν έχουμε προσωπικά δεδομένα να πουλήσουμε ή να μοιραστούμε με κανέναν."
          cs-CZ: "Nepoužíváme analytické ani reklamní skripty, sledovací pixely ani fingerprinting. Nevytváříme profily návštěvníků a nemáme žádná osobní data, která bychom mohli prodat nebo s kýmkoli sdílet."
          pl-PL: "Nie używamy skryptów analitycznych ani reklamowych, pikseli śledzących ani fingerprintingu. Nie tworzymy profili odwiedzających i nie mamy żadnych danych osobowych do sprzedania czy udostępnienia komukolwiek."
      functionalStorage:
        heading:
          en-GB: "Functional cookies and local storage"
          de-DE: "Funktionale Cookies und lokaler Speicher"
          fr-FR: "Cookies fonctionnels et stockage local"
          pt-PT: "Cookies funcionais e armazenamento local"
          it-IT: "Cookie funzionali e archiviazione locale"
          es-ES: "Cookies funcionales y almacenamiento local"
          el-GR: "Λειτουργικά cookies και τοπική αποθήκευση"
          cs-CZ: "Funkční cookies a lokální úložiště"
          pl-PL: "Funkcjonalne pliki cookie i pamięć lokalna"
        body:
          en-GB: "The site uses a small amount of functional storage only — a locale cookie that remembers your language and market, and browser local storage for display preferences such as dark mode. None of it identifies you. See the Cookie Policy for the full list."
          de-DE: "Die Seite nutzt nur wenig funktionalen Speicher – ein Locale-Cookie, das sich Sprache und Markt merkt, und den lokalen Browser-Speicher für Anzeigeeinstellungen wie den Dunkelmodus. Nichts davon identifiziert Sie. Die vollständige Liste steht in der Cookie-Richtlinie."
          fr-FR: "Le site n’utilise qu’un minimum de stockage fonctionnel — un cookie qui mémorise votre langue et votre marché, et le stockage local du navigateur pour les préférences d’affichage comme le mode sombre. Rien de tout cela ne vous identifie. Consultez la politique de cookies pour la liste complète."
          pt-PT: "O site usa apenas uma pequena quantidade de armazenamento funcional — um cookie de idioma que memoriza a sua língua e o seu mercado, e o armazenamento local do navegador para preferências de exibição como o modo escuro. Nada disso o identifica. Consulte a Política de Cookies para a lista completa."
          it-IT: "Il sito utilizza solo una piccola quantità di archiviazione funzionale: un cookie che ricorda la tua lingua e il tuo mercato, e l'archiviazione locale del browser per le preferenze di visualizzazione come la modalità scura. Nulla di tutto questo ti identifica. Consulta la Cookie Policy per l'elenco completo."
          es-ES: "El sitio solo usa una pequeña cantidad de almacenamiento funcional: una cookie de idioma que recuerda tu idioma y tu mercado, y el almacenamiento local del navegador para preferencias de visualización como el modo oscuro. Nada de esto te identifica. Consulta la Política de cookies para ver la lista completa."
          el-GR: "Ο ιστότοπος χρησιμοποιεί μόνο ελάχιστη λειτουργική αποθήκευση — ένα cookie που θυμάται τη γλώσσα και την αγορά σας, και την τοπική αποθήκευση του προγράμματος περιήγησης για προτιμήσεις εμφάνισης όπως η σκοτεινή λειτουργία. Τίποτα από αυτά δεν σας ταυτοποιεί. Δείτε την Πολιτική Cookies για την πλήρη λίστα."
          cs-CZ: "Web používá jen malé množství funkčního úložiště — cookie, které si pamatuje váš jazyk a trh, a lokální úložiště prohlížeče pro předvolby zobrazení, jako je tmavý režim. Nic z toho vás neidentifikuje. Úplný seznam najdete v Zásadách používání cookies."
          pl-PL: "Strona korzysta tylko z niewielkiej ilości pamięci funkcjonalnej — pliku cookie zapamiętującego język i rynek oraz pamięci lokalnej przeglądarki dla preferencji wyświetlania, takich jak tryb ciemny. Nic z tego Cię nie identyfikuje. Pełna lista znajduje się w Polityce plików cookie."
      listingData:
        heading:
          en-GB: "Where our data comes from"
          de-DE: "Woher unsere Daten stammen"
          fr-FR: "D’où viennent nos données"
          pt-PT: "De onde vêm os nossos dados"
          it-IT: "Da dove provengono i nostri dati"
          es-ES: "De dónde provienen nuestros datos"
          el-GR: "Από πού προέρχονται τα δεδομένα μας"
          cs-CZ: "Odkud pocházejí naše data"
          pl-PL: "Skąd pochodzą nasze dane"
        body:
          en-GB: "Everything shown on BiggyIndex — items, sellers, prices, reviews — is sourced from publicly available Little Biggy listings. We hold no data about Little Biggy buyers."
          de-DE: "Alles, was auf BiggyIndex angezeigt wird – Artikel, Verkäufer, Preise, Bewertungen – stammt aus öffentlich verfügbaren Little Biggy Angeboten. Wir besitzen keine Daten über Little Biggy Käufer."
          fr-FR: "Tout ce qui est affiché sur BiggyIndex — articles, vendeurs, prix, avis — provient d’annonces Little Biggy publiquement disponibles. Nous ne détenons aucune donnée sur les acheteurs de Little Biggy."
          pt-PT: "Tudo o que é mostrado no BiggyIndex — itens, vendedores, preços, avaliações — provém de listagens públicas do Little Biggy. Não guardamos quaisquer dados sobre compradores do Little Biggy."
          it-IT: "Tutto ciò che appare su BiggyIndex — articoli, venditori, prezzi, recensioni — proviene da annunci Little Biggy pubblicamente disponibili. Non deteniamo alcun dato sugli acquirenti di Little Biggy."
          es-ES: "Todo lo que se muestra en BiggyIndex (artículos, vendedores, precios, reseñas) procede de anuncios públicos de Little Biggy. No guardamos ningún dato sobre los compradores de Little Biggy."
          el-GR: "Ό,τι εμφανίζεται στο BiggyIndex — προϊόντα, πωλητές, τιμές, κριτικές — προέρχεται από δημόσια διαθέσιμες καταχωρίσεις του Little Biggy. Δεν διατηρούμε κανένα δεδομένο για τους αγοραστές του Little Biggy."
          cs-CZ: "Vše, co se na BiggyIndex zobrazuje — položky, prodejci, ceny, recenze — pochází z veřejně dostupných nabídek Little Biggy. O kupujících na Little Biggy nemáme žádná data."
          pl-PL: "Wszystko, co widać na BiggyIndex — przedmioty, sprzedawcy, ceny, recenzje — pochodzi z publicznie dostępnych ofert Little Biggy. Nie przechowujemy żadnych danych o kupujących na Little Biggy."
      contact:
        heading:
          en-GB: "Contact"
          de-DE: "Kontakt"
          fr-FR: "Contact"
          pt-PT: "Contacto"
          it-IT: "Contatti"
          es-ES: "Contacto"
          el-GR: "Επικοινωνία"
          cs-CZ: "Kontakt"
          pl-PL: "Kontakt"
        body:
          en-GB: "If you have a question, or want something corrected or removed, contact us via the suggestion feature on any item page."
          de-DE: "Bei Fragen oder wenn etwas korrigiert oder entfernt werden soll, erreichen Sie uns über die Korrekturvorschlag-Funktion auf jeder Artikelseite."
          fr-FR: "Pour toute question, ou si vous souhaitez faire corriger ou retirer quelque chose, contactez-nous via la fonction de suggestion présente sur chaque page d’article."
          pt-PT: "Se tiver uma dúvida, ou quiser que algo seja corrigido ou removido, contacte-nos através da funcionalidade de sugestões em qualquer página de item."
          it-IT: "Se hai una domanda, o vuoi che qualcosa venga corretto o rimosso, contattaci tramite la funzione di suggerimento presente in ogni pagina di articolo."
          es-ES: "Si tienes una pregunta, o quieres que algo se corrija o se elimine, contáctanos mediante la función de sugerencias de cualquier página de artículo."
          el-GR: "Αν έχετε απορία ή θέλετε να διορθωθεί ή να αφαιρεθεί κάτι, επικοινωνήστε μαζί μας μέσω της λειτουργίας προτάσεων σε οποιαδήποτε σελίδα προϊόντος."
          cs-CZ: "Máte-li dotaz, nebo chcete něco opravit či odstranit, kontaktujte nás přes funkci návrhů na kterékoli stránce položky."
          pl-PL: "Jeśli masz pytanie albo chcesz, aby coś zostało poprawione lub usunięte, skontaktuj się z nami przez funkcję sugestii na dowolnej stronie przedmiotu."
