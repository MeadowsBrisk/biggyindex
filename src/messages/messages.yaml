  intro:
    en-GB: A live look at whether littlebiggy.org is reachable right now, refreshed every few minutes — plus the official address, login help and what to do during an outage.
    de-DE: Ein Live-Blick darauf, ob littlebiggy.org gerade erreichbar ist, alle paar Minuten aktualisiert — dazu die offizielle Adresse, Login-Hilfe und Tipps bei Ausfällen.
    fr-FR: Un aperçu en direct indiquant si littlebiggy.org est joignable, actualisé en continu — avec l'adresse officielle, une aide à la connexion et que faire en cas de panne.
    pt-PT: Uma visão ao vivo de se o littlebiggy.org está acessível agora, atualizada a cada minutos — mais o endereço oficial, ajuda de início de sessão e o que fazer numa falha.
    it-IT: Uno sguardo in tempo reale su se littlebiggy.org è raggiungibile ora, aggiornato di continuo — con l'indirizzo ufficiale, aiuto per l'accesso e cosa fare in caso di down.
    es-ES: Una vista en vivo de si littlebiggy.org está accesible ahora, actualizada cada pocos minutos — con la dirección oficial, ayuda para iniciar sesión y qué hacer en una caída.
    el-GR: Μια ζωντανή εικόνα για το αν το littlebiggy.org είναι προσβάσιμο τώρα, με τακτική ανανέωση — μαζί με την επίσημη διεύθυνση, βοήθεια σύνδεσης και τι να κάνετε σε διακοπή.
    cs-CZ: Živý pohled na to, zda je littlebiggy.org právě dostupný, pravidelně aktualizovaný — plus oficiální adresa, pomoc s přihlášením a co dělat při výpadku.
    pl-PL: Podgląd na żywo, czy littlebiggy.org jest teraz dostępny, odświeżany co kilka minut — plus oficjalny adres, pomoc przy logowaniu i co robić podczas awarii.
