    intro:
      en-GB: "Bulk distillate is volume-priced with steep size discounts — one blended figure would swing with whichever pack sizes happen to be listed, so it's quoted per ml inside a size band."
      de-DE: "Destillat in großen Mengen wird nach Volumen mit starken Mengenrabatten verkauft — eine einzige Mischzahl würde je nach den gerade gelisteten Gebindegrößen schwanken, deshalb wird pro ml innerhalb einer Größenklasse ausgewiesen."
      fr-FR: "Le distillat en gros est vendu au volume avec de fortes remises sur quantité — un chiffre unique varierait selon les formats listés à l'instant, il est donc donné au ml à l'intérieur d'une tranche de taille."
      pt-PT: "O destilado a granel é vendido por volume com descontos acentuados por tamanho — um valor único variaria conforme os formatos listados no momento, por isso é indicado por ml dentro de um escalão de tamanho."
      it-IT: "Il distillato all'ingrosso è prezzato a volume con forti sconti sulle quantità — una cifra unica oscillerebbe a seconda dei formati elencati al momento, perciò è indicata al ml all'interno di una fascia di formato."
      es-ES: "El destilado a granel se vende por volumen con fuertes descuentos por cantidad — una cifra única variaría según los formatos listados en cada momento, así que se indica por ml dentro de un tramo de tamaño."
      el-GR: "Το απόσταγμα σε μεγάλες ποσότητες τιμολογείται ανά όγκο με μεγάλες εκπτώσεις κλίμακας — ένας ενιαίος αριθμός θα άλλαζε ανάλογα με τα μεγέθη που τυχαίνει να είναι καταχωρισμένα, γι' αυτό δίνεται ανά ml μέσα σε μια ζώνη μεγέθους."
      cs-CZ: "Destilát ve větších objemech se cení podle objemu s výraznými množstevními slevami — jediné souhrnné číslo by kolísalo podle toho, jaká balení jsou zrovna nabízená, proto se uvádí za ml v rámci velikostního pásma."
      pl-PL: "Destylat w większych ilościach wyceniany jest według objętości z dużymi rabatami ilościowymi — jedna uśredniona liczba wahałaby się zależnie od tego, jakie opakowania akurat są w ofercie, dlatego podajemy cenę za ml w przedziale wielkości."
