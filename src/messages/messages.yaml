    ranking:
      title:
        en-GB: How sellers are ranked
        de-DE: So werden Verkäufer eingestuft
        fr-FR: Comment les vendeurs sont classés
        pt-PT: Como os vendedores são classificados
        it-IT: Come vengono classificati i venditori
        es-ES: Cómo se clasifica a los vendedores
        el-GR: Πώς κατατάσσονται οι πωλητές
        cs-CZ: Jak řadíme prodejce
        pl-PL: Jak ustalamy ranking sprzedawców
      scoring:
        en-GB: "Top Rated ranks sellers by their share of positive reviews (9 or 10 out of 10) among the reviews BiggyIndex has recorded for them, not the lifetime total Little Biggy shows. Every seller starts with 40 imaginary reviews, 35 of them positive, and we use the cautious end of a 95% confidence range (the Wilson lower bound), so a few perfect reviews can’t outrank hundreds of good ones. Ratings of 6–8 count towards the total but not as positive, and 5 or below count as negative."
        de-DE: "„Topbewertet“ sortiert Verkäufer nach ihrem Anteil positiver Bewertungen (9 oder 10 von 10) unter den Bewertungen, die BiggyIndex für sie erfasst hat – nicht nach der Gesamtzahl, die Little Biggy anzeigt. Jeder Verkäufer startet mit 40 fiktiven Bewertungen, davon 35 positiv, und wir nehmen das vorsichtige Ende eines 95-%-Konfidenzbereichs (die Wilson-Untergrenze), damit ein paar perfekte Bewertungen nicht Hunderte guter überholen. Bewertungen von 6–8 zählen zur Gesamtzahl, aber nicht als positiv; 5 oder weniger gelten als negativ."
        fr-FR: "« Mieux noté » classe les vendeurs selon leur part d’avis positifs (9 ou 10 sur 10) parmi les avis que BiggyIndex a enregistrés pour eux, et non selon le total affiché par Little Biggy. Chaque vendeur part avec 40 avis fictifs, dont 35 positifs, et nous retenons la borne prudente d’un intervalle de confiance à 95 % (la borne inférieure de Wilson), afin que quelques avis parfaits ne dépassent pas des centaines de bons avis. Les notes de 6 à 8 comptent dans le total mais pas comme positives ; 5 ou moins comptent comme négatives."
        pt-PT: "«Mais Bem Classificados» ordena os vendedores pela proporção de avaliações positivas (9 ou 10 em 10) entre as avaliações que o BiggyIndex registou para eles, e não pelo total que o Little Biggy mostra. Cada vendedor começa com 40 avaliações fictícias, 35 delas positivas, e usamos o extremo prudente de um intervalo de confiança de 95% (o limite inferior de Wilson), para que algumas avaliações perfeitas não ultrapassem centenas de boas. Notas de 6 a 8 contam para o total mas não como positivas; 5 ou menos contam como negativas."
        it-IT: "«Più valutati» ordina i venditori in base alla quota di recensioni positive (9 o 10 su 10) tra quelle registrate da BiggyIndex, non al totale mostrato da Little Biggy. Ogni venditore parte con 40 recensioni fittizie, di cui 35 positive, e usiamo l’estremo prudente di un intervallo di confidenza al 95% (il limite inferiore di Wilson), così poche recensioni perfette non superano centinaia di recensioni buone. I voti da 6 a 8 contano nel totale ma non come positivi; 5 o meno contano come negativi."
        es-ES: "«Mejor valorado» ordena a los vendedores por su proporción de reseñas positivas (9 o 10 sobre 10) entre las reseñas que BiggyIndex ha registrado de ellos, no por el total que muestra Little Biggy. Cada vendedor empieza con 40 reseñas ficticias, 35 de ellas positivas, y usamos el extremo prudente de un intervalo de confianza del 95 % (el límite inferior de Wilson), para que unas pocas reseñas perfectas no superen a cientos de buenas. Las notas de 6 a 8 cuentan en el total pero no como positivas; 5 o menos cuentan como negativas."
        el-GR: "Η «Κορυφαία βαθμολογία» κατατάσσει τους πωλητές με βάση το ποσοστό θετικών κριτικών (9 ή 10 στα 10) στις κριτικές που έχει καταγράψει το BiggyIndex για αυτούς, όχι με βάση το σύνολο που δείχνει το Little Biggy. Κάθε πωλητής ξεκινά με 40 εικονικές κριτικές, από τις οποίες 35 θετικές, και χρησιμοποιούμε το συντηρητικό άκρο ενός διαστήματος εμπιστοσύνης 95% (το κατώτερο όριο Wilson), ώστε λίγες τέλειες κριτικές να μην ξεπερνούν εκατοντάδες καλές. Οι βαθμολογίες 6–8 μετρούν στο σύνολο αλλά όχι ως θετικές· 5 ή λιγότερο μετρούν ως αρνητικές."
        cs-CZ: "„Nejlépe hodnocené“ řadí prodejce podle podílu kladných recenzí (9 nebo 10 z 10) mezi recenzemi, které u nich BiggyIndex zaznamenal, nikoli podle celkového počtu, který ukazuje Little Biggy. Každý prodejce začíná se 40 fiktivními recenzemi, z toho 35 kladnými, a používáme opatrnou mez 95% intervalu spolehlivosti (Wilsonovu dolní mez), aby pár dokonalých recenzí nepředběhlo stovky dobrých. Hodnocení 6–8 se započítávají do celku, ale ne jako kladná; 5 a méně se počítají jako záporná."
        pl-PL: "„Najwyższa ocena” szereguje sprzedawców według odsetka pozytywnych recenzji (9 lub 10 na 10) wśród recenzji, które BiggyIndex dla nich zapisał, a nie według łącznej liczby pokazywanej przez Little Biggy. Każdy sprzedawca startuje z 40 fikcyjnymi recenzjami, w tym 35 pozytywnymi, a my bierzemy ostrożny kraniec 95-procentowego przedziału ufności (dolną granicę Wilsona), aby kilka idealnych recenzji nie wyprzedziło setek dobrych. Oceny 6–8 wliczają się do sumy, ale nie jako pozytywne; 5 lub mniej liczą się jako negatywne."
      caution:
        en-GB: "Needs Review lists sellers with at least 30 reviews and 2 negatives whose negative share is 4% or more, or whose positive share is 85% or less, worst first; they are kept out of Top Rated. The “Last 14 days” tab applies the same rules to reviews from the last 14 days (at most each seller’s latest 150), with thresholds of 10 reviews and 5%. Only sellers with live listings in this market are ranked, and ties go to the most recent review."
        de-DE: "„Zu prüfen“ zeigt Verkäufer mit mindestens 30 Bewertungen und 2 negativen, deren Negativanteil bei 4 % oder mehr oder deren Positivanteil bei 85 % oder weniger liegt, die schlechtesten zuerst; sie erscheinen nicht unter „Topbewertet“. Der Tab „Letzte 14 Tage“ wendet dieselben Regeln auf Bewertungen der letzten 14 Tage an (höchstens die neuesten 150 pro Verkäufer), mit Schwellen von 10 Bewertungen und 5 %. Eingestuft werden nur Verkäufer mit aktiven Angeboten in diesem Markt; bei Gleichstand entscheidet die neueste Bewertung."
        fr-FR: "« À vérifier » liste les vendeurs ayant au moins 30 avis et 2 avis négatifs dont la part négative atteint 4 % ou plus, ou dont la part positive est de 85 % ou moins, les pires en premier ; ils sont exclus de « Mieux noté ». L’onglet « 14 derniers jours » applique les mêmes règles aux avis des 14 derniers jours (au plus les 150 plus récents par vendeur), avec des seuils de 10 avis et 5 %. Seuls les vendeurs ayant des annonces actives sur ce marché sont classés, et en cas d’égalité l’avis le plus récent départage."
        pt-PT: "«A rever» lista vendedores com pelo menos 30 avaliações e 2 negativas cuja proporção negativa é de 4% ou mais, ou cuja proporção positiva é de 85% ou menos, os piores primeiro; ficam fora de «Mais Bem Classificados». O separador «Últimos 14 dias» aplica as mesmas regras às avaliações dos últimos 14 dias (no máximo as 150 mais recentes de cada vendedor), com limiares de 10 avaliações e 5%. Só são classificados vendedores com anúncios ativos neste mercado, e os empates são decididos pela avaliação mais recente."
        it-IT: "«Da verificare» elenca i venditori con almeno 30 recensioni e 2 negative la cui quota negativa è pari o superiore al 4%, o la cui quota positiva è pari o inferiore all’85%, dal peggiore; sono esclusi da «Più valutati». La scheda «Ultimi 14 giorni» applica le stesse regole alle recensioni degli ultimi 14 giorni (al massimo le 150 più recenti per venditore), con soglie di 10 recensioni e 5%. Vengono classificati solo i venditori con annunci attivi in questo mercato e, a parità, conta la recensione più recente."
        es-ES: "«Para revisar» muestra a los vendedores con al menos 30 reseñas y 2 negativas cuya proporción negativa es del 4 % o más, o cuya proporción positiva es del 85 % o menos, los peores primero; quedan fuera de «Mejor valorado». La pestaña «Últimos 14 días» aplica las mismas reglas a las reseñas de los últimos 14 días (como máximo las 150 más recientes de cada vendedor), con umbrales de 10 reseñas y 5 %. Solo se clasifica a vendedores con anuncios activos en este mercado, y los empates se resuelven por la reseña más reciente."
        el-GR: "Το «Χρειάζεται έλεγχο» δείχνει πωλητές με τουλάχιστον 30 κριτικές και 2 αρνητικές, των οποίων το αρνητικό ποσοστό είναι 4% ή περισσότερο ή το θετικό ποσοστό 85% ή λιγότερο, με τους χειρότερους πρώτους· αυτοί δεν εμφανίζονται στην «Κορυφαία βαθμολογία». Η καρτέλα «Τελευταίες 14 ημέρες» εφαρμόζει τους ίδιους κανόνες στις κριτικές των τελευταίων 14 ημερών (το πολύ τις 150 πιο πρόσφατες ανά πωλητή), με όρια 10 κριτικών και 5%. Κατατάσσονται μόνο πωλητές με ενεργές αγγελίες σε αυτή την αγορά, και σε ισοβαθμία προηγείται η πιο πρόσφατη κριτική."
        cs-CZ: "„Ke kontrole“ uvádí prodejce s alespoň 30 recenzemi a 2 zápornými, jejichž podíl záporných je 4 % nebo více, nebo podíl kladných 85 % nebo méně, od nejhorších; mezi „Nejlépe hodnocené“ se nedostanou. Karta „Posledních 14 dní“ používá stejná pravidla na recenze z posledních 14 dnů (nejvýše 150 nejnovějších na prodejce) s prahy 10 recenzí a 5 %. Řadíme jen prodejce s aktivními nabídkami na tomto trhu a při shodě rozhoduje nejnovější recenze."
        pl-PL: "„Do sprawdzenia” pokazuje sprzedawców z co najmniej 30 recenzjami i 2 negatywnymi, u których odsetek negatywnych wynosi 4% lub więcej albo odsetek pozytywnych 85% lub mniej, od najgorszych; nie trafiają oni do „Najwyższej oceny”. Karta „Ostatnie 14 dni” stosuje te same zasady do recenzji z ostatnich 14 dni (maksymalnie 150 najnowszych na sprzedawcę), z progami 10 recenzji i 5%. Klasyfikujemy tylko sprzedawców z aktywnymi ofertami na tym rynku, a przy remisie decyduje najnowsza recenzja."
      limits:
        en-GB: "Delivery time, review recency, account age and community endorsements or reports don’t affect the ranking yet. The formula is open source on <link>GitHub</link>, so anyone can check it or suggest a better one."
        de-DE: "Lieferzeit, Aktualität der Bewertungen, Kontoalter sowie Community-Empfehlungen und -Meldungen fließen noch nicht in die Einstufung ein. Die Formel ist Open Source auf <link>GitHub</link> – jeder kann sie prüfen oder eine bessere vorschlagen."
        fr-FR: "Le délai de livraison, la fraîcheur des avis, l’ancienneté du compte et les recommandations ou signalements de la communauté n’influencent pas encore le classement. La formule est open source sur <link>GitHub</link> : chacun peut la vérifier ou en proposer une meilleure."
        pt-PT: "O prazo de entrega, a atualidade das avaliações, a antiguidade da conta e as recomendações ou denúncias da comunidade ainda não afetam a classificação. A fórmula é open source no <link>GitHub</link>, por isso qualquer pessoa a pode verificar ou propor uma melhor."
        it-IT: "Tempi di consegna, attualità delle recensioni, anzianità dell’account e approvazioni o segnalazioni della community non influiscono ancora sulla classifica. La formula è open source su <link>GitHub</link>, quindi chiunque può verificarla o proporne una migliore."
        es-ES: "El plazo de entrega, la actualidad de las reseñas, la antigüedad de la cuenta y las recomendaciones o denuncias de la comunidad aún no influyen en la clasificación. La fórmula es de código abierto en <link>GitHub</link>, así que cualquiera puede comprobarla o proponer una mejor."
        el-GR: "Ο χρόνος παράδοσης, η επικαιρότητα των κριτικών, η παλαιότητα του λογαριασμού και οι συστάσεις ή αναφορές της κοινότητας δεν επηρεάζουν ακόμη την κατάταξη. Ο τύπος είναι ανοιχτού κώδικα στο <link>GitHub</link>, ώστε ο καθένας να μπορεί να τον ελέγξει ή να προτείνει καλύτερο."
        cs-CZ: "Doba doručení, čerstvost recenzí, stáří účtu ani doporučení či nahlášení komunity zatím pořadí neovlivňují. Vzorec je open source na <link>GitHubu</link>, takže ho kdokoli může ověřit nebo navrhnout lepší."
        pl-PL: "Czas dostawy, świeżość recenzji, wiek konta ani rekomendacje czy zgłoszenia społeczności nie wpływają jeszcze na ranking. Formuła jest open source na <link>GitHubie</link>, więc każdy może ją sprawdzić lub zaproponować lepszą."
