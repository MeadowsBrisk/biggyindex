# BiggyIndex — unified translation source.
#
# This file is the single source of truth for all UI strings. The build
# script (`yarn i18n:build`) reads this YAML and emits one
# `src/messages/<locale>/index.json` per locale listed in `$locales`.
#
# ─── How to edit ──────────────────────────────────────────────────────
# • A bare string is shorthand for "en-GB only; everyone else falls back":
#     browse: Browse
# • A locale map lets you translate per-locale:
#     browse:
#       en-GB: Browse
#       de-DE: Durchsuchen
#       fr-FR: Parcourir
# • Any locale not listed under a leaf falls back to `en-GB`.
#
# ─── ICU message format ──────────────────────────────────────────────
# next-intl uses ICU; plural/select forms live in the value. Example:
#   itemCount: "{count, plural, =0 {No products} one {1 product} other {# products}}"
# Quote any value that contains `{`, `}`, or starts with a symbol, to avoid
# YAML parsing surprises.
#
# ─── Adding a new locale ─────────────────────────────────────────────
# 1. Add the locale to `$locales` below.
# 2. Also wire it in `src/i18n/routing.ts` (domain + LOCALE_TO_MARKET).
# 3. Run `yarn i18n:build`.
# It will start out as an English clone (via fallback) — fine for bring-up.
# Fill in translations incrementally by adding locale keys under leaves.

$locales:
  - en-GB
  - en-IE
  - de-DE
  - fr-FR
  - pt-PT
  - it-IT
  - es-ES
  - el-GR
  - cs-CZ
  - pl-PL

