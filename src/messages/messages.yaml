      de-DE: Verwenden Sie Produktbilder in voller Auflösung. Verwendet mehr Daten, sieht aber schärfer aus.
      fr-FR: Utilisez des images produit en pleine résolution. Utilise plus de données mais paraît plus net.
      pt-PT: Usa imagens de produtos em resolução total. Usa mais dados mas fica mais nítido.
      it-IT: Usa immagini di prodotto a piena risoluzione. Usa più dati ma appare più nitido.
      es-ES: Usa imágenes de producto a resolución completa. Usa más datos pero se ve más nítido.
      el-GR: Χρησιμοποιήστε εικόνες προϊόντων πλήρους ανάλυσης. Χρησιμοποιεί περισσότερα δεδομένα, αλλά φαίνεται πιο ευκρινής.
      cs-CZ: Používejte produkty v plném rozlišení. Spotřebovává více dat, ale vypadá ostřejší.
      pl-PL: Używaj obrazów produktów w pełnej rozdzielczości. Zużywa więcej danych, ale wygląda ostrzej.
