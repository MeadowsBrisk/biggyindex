      de-DE: "Die Bedingungen, die beim Besuch von BiggyIndex gelten — einem unabhängigen, informativen Index von Little Biggy Angeboten."
      fr-FR: "Les conditions qui s’appliquent lorsque vous naviguez sur BiggyIndex, un index informatif indépendant des annonces Little Biggy."
      pt-PT: "Os termos que se aplicam quando navega no BiggyIndex, um índice informativo independente das listagens do Little Biggy."
      it-IT: "I termini che si applicano quando navighi su BiggyIndex, un indice informativo indipendente degli annunci Little Biggy."
