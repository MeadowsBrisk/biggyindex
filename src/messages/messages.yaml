littleBiggyStatus:
  telegram:
    copy:
      en-GB: "Want to know the moment Little Biggy goes down or comes back? Our Telegram channel posts outage alerts and a daily digest of new items and price drops."
      de-DE: "Sofort wissen, wenn Little Biggy down ist oder wieder läuft? Unser Telegram-Kanal meldet Ausfälle und liefert täglich neue Artikel und Preissenkungen."
      fr-FR: "Envie de savoir immédiatement quand Little Biggy tombe en panne ou revient ? Notre canal Telegram publie les alertes de panne et un résumé quotidien des nouveautés et baisses de prix."
      pt-PT: "Quer saber no momento em que o Little Biggy cai ou volta? O nosso canal do Telegram publica alertas de falhas e um resumo diário de novos artigos e descidas de preço."
      it-IT: "Vuoi sapere subito quando Little Biggy va offline o torna attivo? Il nostro canale Telegram pubblica avvisi di interruzione e un riepilogo giornaliero di novità e ribassi."
      es-ES: "¿Quieres saber al momento cuándo Little Biggy se cae o vuelve? Nuestro canal de Telegram publica alertas de caídas y un resumen diario de novedades y bajadas de precio."
      el-GR: "Θέλετε να μαθαίνετε αμέσως πότε το Little Biggy πέφτει ή επανέρχεται; Το κανάλι μας στο Telegram στέλνει ειδοποιήσεις διακοπών και καθημερινή σύνοψη νέων προϊόντων και μειώσεων τιμών."
      cs-CZ: "Chcete hned vědět, když Little Biggy spadne nebo znovu naběhne? Náš kanál na Telegramu posílá upozornění na výpadky a denní přehled novinek a slev."
      pl-PL: "Chcesz od razu wiedzieć, kiedy Little Biggy padnie albo wróci? Nasz kanał na Telegramie publikuje alerty o awariach i codzienne podsumowanie nowości i obniżek cen."
    button:
      en-GB: "Join the Telegram channel"
      de-DE: "Telegram-Kanal beitreten"
      fr-FR: "Rejoindre le canal Telegram"
