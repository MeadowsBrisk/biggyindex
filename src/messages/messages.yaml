    # Unique per-category intro copy (80–150 words), translated per locale.
    # Strain-family names (Gelato, Cookies, Runtz, ...) stay in English —
    # they are proper names, not words to translate.
    intro:
      flower:
        en-GB: >-
          Flower is the biggest category on Little Biggy, running from budget
          smalls to imported Cali exotics. Listings are grouped by strain
          family — Gelato, Cookies, Runtz, OG/Kush, Haze, Zkittlez, Diesel,
          Cheese, Cake and more — so you can follow a genetic line you already
          know instead of guessing from product names. Most sellers offer
          several weight tiers, and the price per gram usually drops sharply
          at the 7g and 14g marks. Descriptions tend to note indica, sativa
          or hybrid leanings along with grow style. Every listing links back
          to the seller on Little Biggy, with reviews, delivery times and
          shipping costs indexed here so you can compare growers side by side
          before ordering.
        de-DE: >-
          Blüten sind die größte Kategorie auf Little Biggy – von günstigen
          Smalls bis zu importierten Cali-Exoten. Die Angebote sind nach
          Strain-Familien gruppiert – Gelato, Cookies, Runtz, OG/Kush, Haze,
          Zkittlez, Diesel, Cheese, Cake und mehr –, sodass Sie einer
          Genetik folgen können, die Sie bereits kennen, statt aus
          Produktnamen zu raten. Die meisten Verkäufer bieten mehrere
          Gewichtsstufen an, und der Grammpreis fällt meist deutlich ab 7 g
          und 14 g. Beschreibungen nennen in der Regel Indica-, Sativa- oder
          Hybrid-Tendenzen sowie den Anbaustil. Jedes Angebot verlinkt zum
          Verkäufer auf Little Biggy, mit hier indexierten Bewertungen,
          Lieferzeiten und Versandkosten – so lassen sich Grower vor der
          Bestellung direkt vergleichen.
        fr-FR: >-
          La fleur est la plus grande catégorie de Little Biggy, des petites
          têtes économiques aux exotiques Cali importées. Les annonces sont
          regroupées par famille de variétés — Gelato, Cookies, Runtz,
          OG/Kush, Haze, Zkittlez, Diesel, Cheese, Cake et plus — pour suivre
          une lignée génétique que vous connaissez déjà au lieu de deviner à
          partir des noms de produits. La plupart des vendeurs proposent
          plusieurs paliers de poids, et le prix au gramme chute nettement à
          partir de 7 g et 14 g. Les descriptions précisent en général la
          tendance indica, sativa ou hybride et le mode de culture. Chaque
          annonce renvoie au vendeur sur Little Biggy, avec avis, délais de
          livraison et frais d’envoi indexés ici pour comparer les
          producteurs avant de commander.
        pt-PT: >-
          A flor é a maior categoria do Little Biggy, desde smalls económicas
          até exóticas Cali importadas. As listagens estão agrupadas por
          família de strain — Gelato, Cookies, Runtz, OG/Kush, Haze,
          Zkittlez, Diesel, Cheese, Cake e mais — para poder seguir uma
          linha genética que já conhece em vez de adivinhar pelos nomes dos
          produtos. A maioria dos vendedores oferece vários escalões de
          peso, e o preço por grama costuma cair bastante nos 7 g e 14 g. As
          descrições costumam indicar tendências indica, sativa ou híbrida e
          o estilo de cultivo. Cada anúncio liga ao vendedor no Little
          Biggy, com avaliações, prazos de entrega e custos de envio
          indexados aqui para comparar produtores antes de encomendar.
        it-IT: >-
          I fiori sono la categoria più grande di Little Biggy: dalle smalls
          economiche alle esotiche Cali importate. Gli annunci sono
          raggruppati per famiglia di strain — Gelato, Cookies, Runtz,
          OG/Kush, Haze, Zkittlez, Diesel, Cheese, Cake e altre — così puoi
          seguire una linea genetica che già conosci invece di indovinare
          dai nomi dei prodotti. La maggior parte dei venditori offre più
          tagli di peso, e il prezzo al grammo cala nettamente sui 7 g e 14
          g. Le descrizioni indicano di solito la tendenza indica, sativa o
          ibrida e lo stile di coltivazione. Ogni annuncio rimanda al
          venditore su Little Biggy, con recensioni, tempi di consegna e
          costi di spedizione indicizzati qui per confrontare i coltivatori
          prima di ordinare.
        es-ES: >-
          La flor es la categoría más grande de Little Biggy, desde smalls
          económicas hasta exóticos Cali importados. Los anuncios se agrupan
          por familia de cepas — Gelato, Cookies, Runtz, OG/Kush, Haze,
          Zkittlez, Diesel, Cheese, Cake y más — para que sigas una línea
          genética que ya conoces en lugar de adivinar por los nombres de
          los productos. La mayoría de los vendedores ofrece varios tramos
          de peso, y el precio por gramo suele bajar mucho en los 7 g y 14
          g. Las descripciones suelen indicar tendencia índica, sativa o
          híbrida y el estilo de cultivo. Cada anuncio enlaza con el
          vendedor en Little Biggy, con reseñas, plazos de entrega y gastos
          de envío indexados aquí para comparar cultivadores antes de pedir.
        el-GR: >-
          Τα άνθη είναι η μεγαλύτερη κατηγορία στο Little Biggy, από
          οικονομικά smalls έως εισαγόμενα Cali exotics. Οι καταχωρίσεις
          ομαδοποιούνται ανά οικογένεια ποικιλίας — Gelato, Cookies, Runtz,
          OG/Kush, Haze, Zkittlez, Diesel, Cheese, Cake και άλλες — ώστε να
          ακολουθείτε μια γενετική γραμμή που ήδη γνωρίζετε αντί να
          μαντεύετε από τα ονόματα των προϊόντων. Οι περισσότεροι πωλητές
          προσφέρουν διάφορες κλίμακες βάρους, και η τιμή ανά γραμμάριο
          συνήθως πέφτει αισθητά στα 7 γρ. και 14 γρ. Οι περιγραφές συνήθως
          αναφέρουν τάση indica, sativa ή υβριδική και τον τρόπο
          καλλιέργειας. Κάθε καταχώριση οδηγεί στον πωλητή στο Little Biggy,
          με κριτικές, χρόνους παράδοσης και μεταφορικά ευρετηριασμένα εδώ,
          για να συγκρίνετε καλλιεργητές πριν παραγγείλετε.
        cs-CZ: >-
          Květy jsou největší kategorií na Little Biggy — od levných smalls
          po dovážené Cali exoty. Nabídky jsou seskupené podle rodin odrůd —
          Gelato, Cookies, Runtz, OG/Kush, Haze, Zkittlez, Diesel, Cheese,
          Cake a další — takže můžete sledovat genetickou linii, kterou už
          znáte, místo hádání podle názvů produktů. Většina prodejců nabízí
          několik hmotnostních úrovní a cena za gram obvykle výrazně klesá u
          7 g a 14 g. Popisy většinou uvádějí, zda jde o indicu, sativu či
          hybrid, a styl pěstování. Každá nabídka odkazuje na prodejce na
          Little Biggy, s recenzemi, dobou doručení a cenou dopravy
          indexovanými zde, takže můžete pěstitele porovnat ještě před
          objednávkou.
        pl-PL: >-
          Susz to największa kategoria na Little Biggy — od budżetowych
          smalls po importowane egzotyki z Kalifornii. Oferty są pogrupowane
          według rodzin odmian — Gelato, Cookies, Runtz, OG/Kush, Haze,
          Zkittlez, Diesel, Cheese, Cake i inne — dzięki czemu możesz
          podążać za znaną Ci genetyką, zamiast zgadywać po nazwach
          produktów. Większość sprzedawców oferuje kilka progów wagowych, a
          cena za gram zwykle wyraźnie spada przy 7 g i 14 g. Opisy zwykle
          podają, czy to indica, sativa czy hybryda, oraz styl uprawy. Każda
          oferta prowadzi do sprzedawcy na Little Biggy, a recenzje, czasy
          dostawy i koszty wysyłki są tu zaindeksowane, więc możesz porównać
          hodowców przed zamówieniem.
      shake:
        en-GB: >-
          Shake is the value end of the flower market: loose shake, trim and
          small popcorn buds, usually sold by the same growers who list full
          flower but at a much lower price per gram. It's a popular choice
          for rolling, cooking and making edibles or extracts at home, where
          bag appeal matters far less than cost. Quality varies more here
          than in any other category — some listings are mostly dust and
          sugar leaf, others are near-whole smalls — so seller reviews are
          worth reading closely. We split Shake out of Flower in this index
          precisely so bargain hunters can compare like for like instead of
          wading through premium listings.
        de-DE: >-
          Shake ist das Preis-Leistungs-Ende des Blütenmarkts: loser Shake,
          Trim und kleine Popcorn-Buds, meist von denselben Growern, die
          auch ganze Blüten listen – aber zu einem deutlich niedrigeren
          Grammpreis. Beliebt zum Drehen, Kochen und für selbstgemachte
          Edibles oder Extrakte, wo die Optik viel weniger zählt als der
          Preis. Die Qualität schwankt hier stärker als in jeder anderen
          Kategorie – manche Angebote bestehen überwiegend aus Staub und
          Zuckerblättern, andere aus fast ganzen Smalls –, daher lohnt sich
          ein genauer Blick auf die Verkäuferbewertungen. Wir haben Shake in
          diesem Index bewusst von den Blüten getrennt, damit
          Schnäppchenjäger Gleiches mit Gleichem vergleichen können, statt
          sich durch Premium-Angebote zu wühlen.
        fr-FR: >-
          Le shake est l’entrée de gamme du marché de la fleur : shake en
          vrac, trim et petites têtes popcorn, généralement vendus par les
          mêmes producteurs que la fleur entière mais à un prix au gramme
          bien plus bas. C’est un choix populaire pour rouler, cuisiner et
          préparer des comestibles ou extraits maison, où l’apparence compte
          bien moins que le coût. La qualité varie ici plus que dans toute
          autre catégorie — certaines annonces sont surtout de la poussière
          et des feuilles sucrées, d’autres des smalls presque entières — ;
          lisez donc attentivement les avis des vendeurs. Nous avons séparé
          le shake de la fleur dans cet index précisément pour que les
          chasseurs de bonnes affaires comparent à armes égales.
        pt-PT: >-
          O shake é a ponta económica do mercado da flor: shake solto, trim
          e pequenos buds popcorn, normalmente vendidos pelos mesmos
          produtores que listam flor inteira, mas a um preço por grama muito
          mais baixo. É uma escolha popular para enrolar, cozinhar e fazer
          comestíveis ou extratos em casa, onde o aspeto conta muito menos
          do que o custo. A qualidade varia aqui mais do que em qualquer
          outra categoria — algumas listagens são sobretudo pó e folhas,
          outras são smalls quase inteiras — por isso vale a pena ler bem as
          avaliações dos vendedores. Separámos o Shake da Flor neste índice
          precisamente para que os caçadores de pechinchas comparem o que é
          comparável.
        it-IT: >-
          Lo shake è la fascia economica del mercato dei fiori: shake
          sfuso, trim e piccole cime popcorn, di solito venduti dagli stessi
          coltivatori che propongono i fiori interi ma a un prezzo al grammo
          molto più basso. È una scelta popolare per rollare, cucinare e
          preparare edibili o estratti in casa, dove l'aspetto conta molto
          meno del costo. La qualità qui varia più che in qualsiasi altra
          categoria — alcuni annunci sono per lo più polvere e foglie,
          altri smalls quasi intere — quindi vale la pena leggere con
          attenzione le recensioni dei venditori. Abbiamo separato lo Shake
          dai Fiori in questo indice proprio perché i cacciatori di offerte
          possano confrontare prodotti simili tra loro.
        es-ES: >-
          El shake es la gama económica del mercado de flor: shake suelto,
          trim y pequeños cogollos popcorn, normalmente vendidos por los
          mismos cultivadores que publican flor entera pero a un precio por
          gramo mucho menor. Es una opción popular para liar, cocinar y
          hacer comestibles o extractos en casa, donde la apariencia importa
          mucho menos que el coste. La calidad varía aquí más que en
          cualquier otra categoría — algunos anuncios son sobre todo polvo y
          hoja, otros son smalls casi enteras — así que conviene leer bien
          las reseñas del vendedor. Separamos el Shake de la Flor en este
          índice precisamente para que los cazadores de gangas comparen
          entre iguales.
        el-GR: >-
          Το shake είναι η οικονομική πλευρά της αγοράς ανθών: χύμα shake,
          trim και μικρά popcorn μπουμπούκια, συνήθως από τους ίδιους
          καλλιεργητές που πουλούν και ολόκληρα άνθη, αλλά σε πολύ
          χαμηλότερη τιμή ανά γραμμάριο. Είναι δημοφιλής επιλογή για
          στριφτό, μαγείρεμα και σπιτικά εδώδιμα ή εκχυλίσματα, όπου η
          εμφάνιση μετράει πολύ λιγότερο από το κόστος. Η ποιότητα εδώ
          ποικίλλει περισσότερο από κάθε άλλη κατηγορία — κάποιες
          καταχωρίσεις είναι κυρίως σκόνη και φύλλα, άλλες σχεδόν ολόκληρα
          smalls — γι' αυτό αξίζει να διαβάζετε προσεκτικά τις κριτικές των
          πωλητών. Χωρίσαμε το Shake από τα Άνθη σε αυτό το ευρετήριο
          ακριβώς για να συγκρίνουν οι κυνηγοί προσφορών όμοια με όμοια.
        cs-CZ: >-
          Shake je cenově výhodný konec trhu s květy: sypaný shake, trim a
          malé popcorn palice, obvykle od stejných pěstitelů, kteří nabízejí
          i celé květy, ale za výrazně nižší cenu za gram. Je oblíbenou
          volbou na balení, vaření a domácí výrobu jedlých produktů či
          extraktů, kde vzhled hraje mnohem menší roli než cena. Kvalita se
          tu liší víc než v kterékoli jiné kategorii — některé nabídky jsou
          hlavně prach a listy, jiné téměř celé smalls — takže se vyplatí
          pozorně číst recenze prodejců. Shake jsme v tomto indexu oddělili
          od Květů právě proto, aby lovci výhodných nabídek srovnávali
          srovnatelné.
        pl-PL: >-
          Shake to budżetowa strona rynku suszu: luźny shake, trim i małe
          szyszki popcorn, zwykle od tych samych hodowców, którzy wystawiają
          pełny susz, ale za znacznie niższą cenę za gram. To popularny
          wybór do skrętów, gotowania i domowej produkcji edibles czy
          ekstraktów, gdzie wygląd liczy się dużo mniej niż koszt. Jakość
          waha się tu bardziej niż w jakiejkolwiek innej kategorii —
          niektóre oferty to głównie pył i listki, inne niemal całe smalls —
          dlatego warto uważnie czytać recenzje sprzedawców. Wydzieliliśmy
          Shake z Suszu w tym indeksie właśnie po to, aby łowcy okazji mogli
          porównywać podobne z podobnym.
      hash:
        en-GB: >-
          Hash on Little Biggy spans traditional imports and modern
          solventless work. Listings are organised by processing method:
          Moroccan-style pressed hash, dry sift and static sift, bubble hash
          from ice-water extraction, soft mousse, unpressed kief, and premium
          forms like piatella and temple balls. Micron grades and filtration
          levels show up in listing details where sellers state them.
          UK-based makers tend toward fresher artisan batches, while imports
          cover the classic Moroccan and Afghan styles. Prices per gram range
          wider than flower, tracking quality closely — comparing review
          scores and delivery records across sellers is the quickest way to
          find hash that matches its description.
        de-DE: >-
          Hash auf Little Biggy reicht von traditionellen Importen bis zu
          moderner lösungsmittelfreier Arbeit. Die Angebote sind nach
          Verarbeitungsmethode geordnet: marokkanisch gepresstes Hash, Dry
          Sift und Static Sift, Bubble Hash aus Eiswasser-Extraktion,
          weiche Mousse, ungepresstes Kief sowie Premium-Formen wie
          Piatella und Temple Balls. Micron-Grade und Filtrationsstufen
          stehen in den Angebotsdetails, sofern die Verkäufer sie angeben.
          Hersteller aus dem Vereinigten Königreich liefern eher frische
          Artisan-Chargen, während Importe die klassischen marokkanischen
          und afghanischen Stile abdecken. Die Grammpreise streuen stärker
          als bei Blüten und folgen eng der Qualität – Bewertungen und
          Lieferhistorien der Verkäufer zu vergleichen ist der schnellste
          Weg zu Hash, das seiner Beschreibung entspricht.
        fr-FR: >-
          Le hash sur Little Biggy va des imports traditionnels au travail
          moderne sans solvant. Les annonces sont classées par méthode de
          fabrication : hash pressé de style marocain, dry sift et static
          sift, bubble hash issu de l’extraction à l’eau glacée, mousse
          souple, kief non pressé, et formes premium comme la piatella et
          les temple balls. Les grades en microns et les niveaux de
          filtration figurent dans les détails quand les vendeurs les
          indiquent. Les artisans britanniques proposent plutôt des lots
          frais, tandis que les imports couvrent les styles marocains et
          afghans classiques. Les prix au gramme varient plus que pour la
          fleur et suivent de près la qualité — comparer les notes et
          l’historique de livraison des vendeurs est le moyen le plus
          rapide de trouver un hash fidèle à sa description.
        pt-PT: >-
          O haxixe no Little Biggy vai dos imports tradicionais ao trabalho
          moderno sem solventes. As listagens estão organizadas por método
          de processamento: haxixe prensado ao estilo marroquino, dry sift
          e static sift, bubble hash de extração com água gelada, mousse
          suave, kief não prensado e formas premium como piatella e temple
          balls. Os graus de mícron e níveis de filtração aparecem nos
          detalhes quando os vendedores os indicam. Os produtores do Reino
          Unido tendem para lotes artesanais mais frescos, enquanto os
          imports cobrem os estilos clássicos marroquino e afegão. Os
          preços por grama variam mais do que na flor e acompanham de perto
          a qualidade — comparar avaliações e historial de entregas entre
          vendedores é a forma mais rápida de encontrar haxixe fiel à
          descrição.
        it-IT: >-
          L'hash su Little Biggy spazia dagli import tradizionali al
          moderno lavoro senza solventi. Gli annunci sono organizzati per
          metodo di lavorazione: hash pressato in stile marocchino, dry
          sift e static sift, bubble hash da estrazione con acqua ghiacciata,
          mousse morbida, kief non pressato e forme premium come piatella e
          temple balls. I gradi in micron e i livelli di filtrazione
          compaiono nei dettagli quando i venditori li dichiarano. I
          produttori britannici tendono a lotti artigianali più freschi,
          mentre gli import coprono i classici stili marocchino e afgano. I
          prezzi al grammo variano più dei fiori e seguono da vicino la
          qualità — confrontare punteggi delle recensioni e storici di
          consegna tra venditori è il modo più rapido per trovare hash
          fedele alla descrizione.
        es-ES: >-
          El hash en Little Biggy abarca desde imports tradicionales hasta
          el trabajo moderno sin disolventes. Los anuncios se organizan por
          método de procesado: hash prensado al estilo marroquí, dry sift y
          static sift, bubble hash de extracción con agua helada, mousse
          blanda, kief sin prensar y formas premium como piatella y temple
          balls. Los grados de micras y niveles de filtración aparecen en
          los detalles cuando los vendedores los indican. Los productores
          del Reino Unido tienden a lotes artesanales más frescos, mientras
          que los imports cubren los estilos clásicos marroquí y afgano.
          Los precios por gramo varían más que en la flor y siguen de cerca
          la calidad: comparar reseñas e historiales de entrega entre
          vendedores es la forma más rápida de encontrar hash fiel a su
          descripción.
        el-GR: >-
          Το χασίς στο Little Biggy καλύπτει από παραδοσιακές εισαγωγές
          μέχρι σύγχρονη δουλειά χωρίς διαλύτες. Οι καταχωρίσεις
          οργανώνονται ανά μέθοδο επεξεργασίας: πρεσαριστό μαροκινού τύπου,
          dry sift και static sift, bubble hash από εκχύλιση με παγωμένο
          νερό, μαλακό mousse, απρεσάριστο kief και premium μορφές όπως
          piatella και temple balls. Οι βαθμοί micron και τα επίπεδα
          διήθησης εμφανίζονται στις λεπτομέρειες όταν τα δηλώνουν οι
          πωλητές. Οι παραγωγοί από το Ηνωμένο Βασίλειο τείνουν σε
          φρεσκότερες χειροποίητες παρτίδες, ενώ οι εισαγωγές καλύπτουν τα
          κλασικά μαροκινά και αφγανικά στυλ. Οι τιμές ανά γραμμάριο
          κυμαίνονται περισσότερο από τα άνθη και ακολουθούν στενά την
          ποιότητα — η σύγκριση κριτικών και ιστορικού παραδόσεων είναι ο
          γρηγορότερος τρόπος να βρείτε χασίς που ανταποκρίνεται στην
          περιγραφή του.
        cs-CZ: >-
          Hash na Little Biggy sahá od tradičních dovozů po moderní
          bezrozpouštědlovou práci. Nabídky jsou uspořádány podle metody
          zpracování: lisovaný hash marockého stylu, dry sift a static
          sift, bubble hash z extrakce ledovou vodou, měkký mousse,
          nelisovaný kief a prémiové formy jako piatella a temple balls.
          Micronové stupně a úroveň filtrace najdete v detailech nabídky,
          pokud je prodejci uvádějí. Výrobci z Velké Británie nabízejí
          spíše čerstvé řemeslné šarže, zatímco dovozy pokrývají klasické
          marocké a afghánské styly. Ceny za gram se pohybují v širším
          rozpětí než u květů a těsně sledují kvalitu — porovnání recenzí a
          historie doručení mezi prodejci je nejrychlejší cesta k hashi,
          který odpovídá svému popisu.
        pl-PL: >-
          Hasz na Little Biggy obejmuje zarówno tradycyjne importy, jak i
          nowoczesną produkcję bez rozpuszczalników. Oferty są uporządkowane
          według metody obróbki: prasowany hasz w stylu marokańskim, dry
          sift i static sift, bubble hash z ekstrakcji lodowatą wodą,
          miękki mousse, nieprasowany kief oraz formy premium, takie jak
          piatella i temple balls. Gradacje mikronowe i poziomy filtracji
          pojawiają się w szczegółach ofert, gdy sprzedawcy je podają.
          Wytwórcy z Wielkiej Brytanii stawiają raczej na świeże,
          rzemieślnicze partie, a importy pokrywają klasyczne style
          marokańskie i afgańskie. Ceny za gram wahają się szerzej niż przy
          suszu i ściśle podążają za jakością — porównanie ocen i historii
          dostaw sprzedawców to najszybszy sposób na hasz zgodny z opisem.
      concentrates:
        en-GB: >-
          Concentrates cover the potent end of the menu: shatter, wax,
          crumble, rosin, live resin, diamonds and THC oils. Solventless
          products like rosin sit alongside butane- and CO2-extracted
          options, and listings usually state the extraction method and the
          strain it started from. Doses are small and potency is high — most
          concentrates are several times stronger than flower — so per-gram
          prices look steep but stretch much further. Typical use is a dab
          rig or a concentrate-capable vaporiser, and some buyers simply top
          flower with a little extract. Review histories are indexed for
          every listing, which matters in a category where texture and purity
          are hard to judge from photos.
        de-DE: >-
          Konzentrate decken das potente Ende des Sortiments ab: Shatter,
          Wax, Crumble, Rosin, Live Resin, Diamonds und THC-Öle.
          Lösungsmittelfreie Produkte wie Rosin stehen neben Butan- und
          CO2-Extraktionen, und die Angebote nennen meist die
          Extraktionsmethode und die Ausgangs-Sorte. Die Dosen sind klein
          und die Potenz hoch – die meisten Konzentrate sind um ein
          Mehrfaches stärker als Blüten –, daher wirken die Grammpreise
          hoch, reichen aber deutlich länger. Typisch ist ein Dab-Rig oder
          ein konzentratfähiger Vaporizer; manche Käufer geben einfach etwas
          Extrakt auf ihre Blüten. Bewertungshistorien sind für jedes
          Angebot indexiert – wichtig in einer Kategorie, in der sich Textur
          und Reinheit auf Fotos schwer beurteilen lassen.
        fr-FR: >-
          Les concentrés couvrent le haut de gamme en puissance : shatter,
          wax, crumble, rosin, live resin, diamonds et huiles THC. Les
          produits sans solvant comme le rosin côtoient les extractions au
          butane et au CO2, et les annonces précisent généralement la
          méthode d’extraction et la variété d’origine. Les doses sont
          petites et la puissance élevée — la plupart des concentrés sont
          plusieurs fois plus forts que la fleur — donc les prix au gramme
          semblent élevés mais durent bien plus longtemps. L’usage typique
          passe par un dab rig ou un vaporisateur compatible, et certains
          acheteurs ajoutent simplement un peu d’extrait sur la fleur. Les
          historiques d’avis sont indexés pour chaque annonce — essentiel
          dans une catégorie où texture et pureté se jugent mal en photo.
        pt-PT: >-
          Os concentrados cobrem a ponta mais potente do menu: shatter,
          wax, crumble, rosin, live resin, diamonds e óleos de THC. Os
          produtos sem solventes, como o rosin, convivem com extrações a
          butano e CO2, e as listagens normalmente indicam o método de
          extração e a strain de origem. As doses são pequenas e a potência
          é alta — a maioria dos concentrados é várias vezes mais forte do
          que a flor — pelo que os preços por grama parecem elevados mas
          rendem muito mais. O uso típico é um dab rig ou um vaporizador
          compatível, e alguns compradores simplesmente juntam um pouco de
          extrato à flor. O histórico de avaliações está indexado para cada
          anúncio, o que importa numa categoria onde textura e pureza são
          difíceis de avaliar por fotos.
        it-IT: >-
          I concentrati coprono la fascia più potente del menu: shatter,
          wax, crumble, rosin, live resin, diamonds e oli THC. I prodotti
          senza solventi come il rosin affiancano le estrazioni a butano e
          CO2, e gli annunci di solito indicano il metodo di estrazione e
          la strain di partenza. Le dosi sono piccole e la potenza è alta —
          la maggior parte dei concentrati è varie volte più forte dei
          fiori — quindi i prezzi al grammo sembrano alti ma durano molto
          di più. L'uso tipico è un dab rig o un vaporizzatore compatibile,
          e alcuni acquirenti aggiungono semplicemente un po' di estratto
          ai fiori. Lo storico delle recensioni è indicizzato per ogni
          annuncio, il che conta in una categoria dove consistenza e
          purezza si giudicano male dalle foto.
        es-ES: >-
          Los concentrados cubren la parte más potente del menú: shatter,
          wax, crumble, rosin, live resin, diamonds y aceites de THC. Los
          productos sin disolventes como el rosin conviven con extracciones
          con butano y CO2, y los anuncios suelen indicar el método de
          extracción y la cepa de origen. Las dosis son pequeñas y la
          potencia alta — la mayoría de los concentrados son varias veces
          más fuertes que la flor — así que los precios por gramo parecen
          caros pero cunden mucho más. El uso típico es un dab rig o un
          vaporizador compatible, y algunos compradores simplemente añaden
          un poco de extracto a la flor. El historial de reseñas está
          indexado en cada anuncio, algo clave en una categoría donde la
          textura y la pureza son difíciles de juzgar por fotos.
        el-GR: >-
          Τα συμπυκνώματα καλύπτουν το πιο ισχυρό κομμάτι του μενού:
          shatter, wax, crumble, rosin, live resin, diamonds και έλαια THC.
          Προϊόντα χωρίς διαλύτες όπως το rosin συνυπάρχουν με εκχυλίσεις
          βουτανίου και CO2, και οι καταχωρίσεις συνήθως αναφέρουν τη
          μέθοδο εκχύλισης και την ποικιλία προέλευσης. Οι δόσεις είναι
          μικρές και η ισχύς υψηλή — τα περισσότερα συμπυκνώματα είναι
          αρκετές φορές ισχυρότερα από τα άνθη — οπότε οι τιμές ανά
          γραμμάριο φαίνονται τσουχτερές αλλά διαρκούν πολύ περισσότερο. Η
          τυπική χρήση είναι dab rig ή κατάλληλος ατμοποιητής, ενώ κάποιοι
          αγοραστές απλώς προσθέτουν λίγο εκχύλισμα στα άνθη. Το ιστορικό
          κριτικών είναι ευρετηριασμένο για κάθε καταχώριση — σημαντικό σε
          μια κατηγορία όπου υφή και καθαρότητα δύσκολα κρίνονται από
          φωτογραφίες.
        cs-CZ: >-
          Koncentráty pokrývají nejsilnější část nabídky: shatter, wax,
          crumble, rosin, live resin, diamonds a THC oleje. Bezrozpouštědlové
          produkty jako rosin stojí vedle extrakcí butanem a CO2 a nabídky
          obvykle uvádějí metodu extrakce i výchozí odrůdu. Dávky jsou malé
          a potence vysoká — většina koncentrátů je několikanásobně
          silnější než květy — takže ceny za gram vypadají vysoko, ale
          vydrží mnohem déle. Typicky se používá dab rig nebo vhodný
          vaporizér a někteří kupující prostě přidají trochu extraktu ke
          květům. Historie recenzí je indexována u každé nabídky, což je
          důležité v kategorii, kde se textura a čistota z fotek posuzují
          těžko.
        pl-PL: >-
          Koncentraty to najmocniejsza część oferty: shatter, wax, crumble,
          rosin, live resin, diamonds i oleje THC. Produkty bez
          rozpuszczalników, jak rosin, sąsiadują z ekstrakcjami butanem i
          CO2, a oferty zwykle podają metodę ekstrakcji i odmianę wyjściową.
          Dawki są małe, a moc wysoka — większość koncentratów jest
          kilkukrotnie mocniejsza od suszu — więc ceny za gram wyglądają na
          wysokie, ale starczają na znacznie dłużej. Typowe użycie to dab
          rig lub odpowiedni waporyzator, a niektórzy kupujący po prostu
          dodają odrobinę ekstraktu do suszu. Historia recenzji jest
          zaindeksowana przy każdej ofercie, co ma znaczenie w kategorii,
          w której teksturę i czystość trudno ocenić po zdjęciach.
      distillate:
        en-GB: >-
          Distillate is THC refined to its purest practical form — a thick,
          golden oil that typically tests far stronger than flower or
          traditional extracts. Because the process strips out plant material
          and most terpenes, it has little flavour of its own, which makes it
          a flexible base: buyers use it to refill vape carts, dose edibles
          precisely, or dab it directly. Listings on Little Biggy usually
          come as syringes or jars with the volume stated up front, and
          review histories are indexed with each listing — useful in a
          category where potency claims matter more than photos.
        de-DE: >-
          Distillat ist THC in seiner praktisch reinsten Form — ein
          dickflüssiges, goldenes Öl, das deutlich stärker ausfällt als
          Blüten oder klassische Extrakte. Da der Prozess Pflanzenmaterial
          und die meisten Terpene entfernt, hat es kaum Eigengeschmack und
          eignet sich als flexible Basis: zum Nachfüllen von Vape-Carts, zum
          präzisen Dosieren von Edibles oder direkt zum Dabben. Angebote auf
          Little Biggy kommen meist als Spritzen oder Gläser mit klar
          angegebener Menge, und die Bewertungshistorie ist bei jedem
          Angebot indexiert — hilfreich in einer Kategorie, in der
          Potenzangaben mehr zählen als Fotos.
        fr-FR: >-
          Le distillat est du THC raffiné à sa forme la plus pure — une huile
          épaisse et dorée, généralement bien plus puissante que la fleur ou
          les extraits classiques. Le procédé éliminant la matière végétale
          et la plupart des terpènes, il a peu de goût propre, ce qui en fait
          une base polyvalente : recharger des cartouches de vape, doser des
          edibles avec précision ou dabber directement. Sur Little Biggy, les
          annonces se présentent le plus souvent en seringues ou en pots avec
          le volume indiqué, et l’historique des avis est indexé pour chaque
          annonce — utile dans une catégorie où la puissance compte plus que
          les photos.
        pt-PT: >-
          O destilado é THC refinado até à sua forma mais pura — um óleo
          espesso e dourado, normalmente muito mais forte do que a flor ou os
          extratos tradicionais. Como o processo remove o material vegetal e
          a maioria dos terpenos, tem pouco sabor próprio, o que o torna uma
          base versátil: recarregar cartuchos de vape, dosear edibles com
          precisão ou fazer dab diretamente. No Little Biggy, as listagens
          surgem geralmente em seringas ou frascos com o volume indicado, e o
          histórico de avaliações está indexado em cada listagem — útil numa
          categoria em que a potência conta mais do que as fotos.
        it-IT: >-
          Il distillato è THC raffinato nella sua forma più pura — un olio
          denso e dorato, in genere molto più potente dei fiori o degli
          estratti tradizionali. Poiché il processo elimina il materiale
          vegetale e la maggior parte dei terpeni, ha poco sapore proprio ed
          è una base versatile: ricaricare cartucce da svapo, dosare edibles
          con precisione o fare dab direttamente. Su Little Biggy gli annunci
          arrivano di solito in siringhe o barattoli con il volume indicato,
          e lo storico delle recensioni è indicizzato per ogni annuncio —
          utile in una categoria dove la potenza conta più delle foto.
        es-ES: >-
          El destilado es THC refinado hasta su forma más pura: un aceite
          espeso y dorado, normalmente mucho más potente que la flor o los
          extractos tradicionales. Como el proceso elimina el material
          vegetal y la mayoría de los terpenos, apenas tiene sabor propio, lo
          que lo convierte en una base versátil: recargar cartuchos de vapeo,
          dosificar edibles con precisión o hacer dabs directamente. En
          Little Biggy los anuncios suelen venir en jeringas o tarros con el
          volumen indicado, y el historial de reseñas está indexado en cada
          anuncio — útil en una categoría donde la potencia importa más que
          las fotos.
        el-GR: >-
          Το distillate είναι THC σε σχεδόν καθαρή μορφή — ένα πυκνό, χρυσαφί
          έλαιο, συνήθως πολύ ισχυρότερο από το άνθος ή τα κλασικά
          εκχυλίσματα. Επειδή η διαδικασία αφαιρεί το φυτικό υλικό και τα
          περισσότερα τερπένια, έχει ελάχιστη δική του γεύση και λειτουργεί
          ως ευέλικτη βάση: για ξαναγέμισμα φυσιγγίων άτμισης, ακριβή
          δοσολογία σε edibles ή απευθείας dab. Στο Little Biggy οι
          καταχωρίσεις έρχονται συνήθως σε σύριγγες ή βαζάκια με σαφή
          αναγραφή όγκου, και το ιστορικό κριτικών είναι ευρετηριασμένο σε
          κάθε καταχώριση — χρήσιμο σε μια κατηγορία όπου η ισχύς μετράει
          περισσότερο από τις φωτογραφίες.
        cs-CZ: >-
          Destilát je THC v prakticky nejčistší podobě — hustý zlatavý olej,
          obvykle výrazně silnější než květy nebo běžné extrakty. Proces
          odstraní rostlinný materiál i většinu terpenů, takže má jen málo
          vlastní chuti a funguje jako univerzální základ: doplnění vape
          cartridgí, přesné dávkování do edibles nebo přímý dab. Nabídky na
          Little Biggy bývají ve stříkačkách nebo sklenicích s jasně uvedeným
          objemem a historie recenzí je indexována u každé nabídky — což se
          hodí v kategorii, kde síla znamená víc než fotky.
        pl-PL: >-
          Destylat to THC w praktycznie najczystszej postaci — gęsty, złocisty
          olej, zwykle znacznie mocniejszy niż susz czy klasyczne ekstrakty.
          Proces usuwa materiał roślinny i większość terpenów, więc destylat
          ma niewiele własnego smaku i sprawdza się jako uniwersalna baza: do
          napełniania kartridżów do wapowania, precyzyjnego dawkowania w
          edibles albo bezpośredniego daba. Oferty na Little Biggy mają
          zwykle formę strzykawek lub słoiczków z podaną objętością, a
          historia recenzji jest zaindeksowana przy każdej ofercie — co jest
          przydatne w kategorii, w której moc liczy się bardziej niż zdjęcia.
      vapes:
        en-GB: >-
          Vape listings on Little Biggy include pre-filled 510-thread
          cartridges, disposable pens and pods. The oil inside matters most:
          distillate carts are the cheapest and most consistent, while live
          resin and full-spectrum extracts cost more and keep more of the
          original strain's flavour and effect. Listings normally state the
          size (0.5ml or 1ml), extract type and strain. Disposables work out
          of the box; cartridges need a 510 battery bought separately.
          Counterfeits of brand-name carts are common everywhere, so a
          seller's review history and time on the platform are better guides
          than packaging — both are indexed on every listing here.
        de-DE: >-
          Vape-Angebote auf Little Biggy umfassen vorbefüllte
          510-Gewinde-Kartuschen, Einweg-Pens und Pods. Das Öl im Inneren
          zählt am meisten: Destillat-Carts sind am günstigsten und
          konstantesten, während Live Resin und Vollspektrum-Extrakte mehr
          kosten und mehr vom Geschmack und Effekt der ursprünglichen Sorte
          bewahren. Die Angebote nennen normalerweise die Größe (0,5 ml
          oder 1 ml), den Extrakttyp und die Sorte. Einweg-Vapes
          funktionieren sofort; Kartuschen brauchen eine separat gekaufte
          510-Batterie. Fälschungen von Marken-Carts sind überall
          verbreitet – die Bewertungshistorie eines Verkäufers und seine
          Zeit auf der Plattform sind daher bessere Anhaltspunkte als die
          Verpackung, und beides ist hier bei jedem Angebot indexiert.
        fr-FR: >-
          Les annonces de vapes sur Little Biggy comprennent des cartouches
          pré-remplies à filetage 510, des stylos jetables et des pods.
          C’est l’huile qui compte le plus : les carts au distillat sont
          les moins chères et les plus régulières, tandis que la live resin
          et les extraits full-spectrum coûtent plus cher et gardent
          davantage la saveur et l’effet de la variété d’origine. Les
          annonces indiquent normalement la taille (0,5 ml ou 1 ml), le
          type d’extrait et la variété. Les jetables marchent
          immédiatement ; les cartouches nécessitent une batterie 510
          achetée à part. Les contrefaçons de carts de marque sont partout
          — l’historique d’avis d’un vendeur et son ancienneté sur la
          plateforme sont de meilleurs repères que l’emballage, et les deux
          sont indexés ici sur chaque annonce.
        pt-PT: >-
          As listagens de vapes no Little Biggy incluem cartuchos
          pré-cheios de rosca 510, canetas descartáveis e pods. O óleo lá
          dentro é o que mais importa: os carts de destilado são os mais
          baratos e consistentes, enquanto a live resin e os extratos de
          espetro completo custam mais e mantêm mais do sabor e efeito da
          strain original. As listagens normalmente indicam o tamanho (0,5
          ml ou 1 ml), o tipo de extrato e a strain. Os descartáveis
          funcionam logo; os cartuchos precisam de uma bateria 510
          comprada à parte. As contrafações de carts de marca são comuns em
          todo o lado, por isso o histórico de avaliações do vendedor e o
          tempo na plataforma são melhores guias do que a embalagem —
          ambos indexados aqui em cada anúncio.
        it-IT: >-
          Gli annunci di vape su Little Biggy includono cartucce
          precaricate con filettatura 510, penne usa e getta e pod. L'olio
          all'interno è ciò che conta di più: le cart al distillato sono le
          più economiche e costanti, mentre live resin ed estratti a
          spettro completo costano di più e conservano più sapore ed
          effetto della strain originale. Gli annunci indicano di norma la
          capienza (0,5 ml o 1 ml), il tipo di estratto e la strain. Le usa
          e getta funzionano subito; le cartucce richiedono una batteria
          510 acquistata a parte. Le contraffazioni di cart di marca sono
          comuni ovunque, quindi lo storico recensioni del venditore e la
          sua anzianità sulla piattaforma sono guide migliori della
          confezione — entrambi indicizzati qui su ogni annuncio.
        es-ES: >-
          Los anuncios de vapeo en Little Biggy incluyen cartuchos
          precargados de rosca 510, plumas desechables y pods. Lo que más
          importa es el aceite: los carts de destilado son los más baratos
          y consistentes, mientras que la live resin y los extractos de
          espectro completo cuestan más y conservan más sabor y efecto de
          la cepa original. Los anuncios suelen indicar el tamaño (0,5 ml o
          1 ml), el tipo de extracto y la cepa. Los desechables funcionan
          desde el primer momento; los cartuchos necesitan una batería 510
          comprada aparte. Las falsificaciones de carts de marca abundan en
          todas partes, así que el historial de reseñas del vendedor y su
          tiempo en la plataforma orientan mejor que el envase — ambos
          están indexados aquí en cada anuncio.
        el-GR: >-
          Οι καταχωρίσεις vape στο Little Biggy περιλαμβάνουν
          προγεμισμένες κάρτριτζ με σπείρωμα 510, στυλό μίας χρήσης και
          pods. Το λάδι στο εσωτερικό μετράει περισσότερο: οι κάρτριτζ
          distillate είναι οι φθηνότερες και πιο σταθερές, ενώ η live resin
          και τα εκχυλίσματα πλήρους φάσματος κοστίζουν περισσότερο και
          διατηρούν περισσότερη από τη γεύση και την επίδραση της αρχικής
          ποικιλίας. Οι καταχωρίσεις συνήθως αναφέρουν μέγεθος (0,5 ml ή 1
          ml), τύπο εκχυλίσματος και ποικιλία. Τα μίας χρήσης δουλεύουν
          αμέσως· οι κάρτριτζ χρειάζονται μπαταρία 510 που αγοράζεται
          ξεχωριστά. Οι απομιμήσεις επώνυμων καρτριτζ είναι παντού
          συχνές, οπότε το ιστορικό κριτικών του πωλητή και ο χρόνος του
          στην πλατφόρμα είναι καλύτερος οδηγός από τη συσκευασία — και τα
          δύο είναι ευρετηριασμένα εδώ σε κάθε καταχώριση.
        cs-CZ: >-
          Nabídky vape na Little Biggy zahrnují předplněné cartridge se
          závitem 510, jednorázová pera a pody. Nejvíc záleží na oleji
          uvnitř: distillate cartridge jsou nejlevnější a nejkonzistentnější,
          zatímco live resin a plnospektrální extrakty stojí víc a
          zachovávají více chuti a účinku původní odrůdy. Nabídky obvykle
          uvádějí velikost (0,5 ml nebo 1 ml), typ extraktu a odrůdu.
          Jednorázovky fungují hned; cartridge potřebují baterii 510
          koupenou zvlášť. Padělky značkových cartridgí jsou běžné všude,
          takže historie recenzí prodejce a doba na platformě jsou lepším
          vodítkem než obal — obojí je zde indexováno u každé nabídky.
        pl-PL: >-
          Oferty vape na Little Biggy obejmują fabrycznie napełnione
          kartridże z gwintem 510, jednorazowe peny i pody. Najważniejszy
          jest olej w środku: kartridże z destylatem są najtańsze i
          najbardziej powtarzalne, a live resin i ekstrakty pełnospektralne
          kosztują więcej, ale zachowują więcej smaku i działania
          oryginalnej odmiany. Oferty zwykle podają pojemność (0,5 ml lub 1
          ml), typ ekstraktu i odmianę. Jednorazówki działają od razu;
          kartridże wymagają osobno kupionej baterii 510. Podróbki
          markowych kartridży są wszędzie powszechne, więc historia
          recenzji sprzedawcy i jego staż na platformie są lepszą wskazówką
          niż opakowanie — oba są tu zaindeksowane przy każdej ofercie.
      prerolls:
        en-GB: >-
          Pre-rolls take the rolling out of the equation. Little Biggy
          sellers list singles, multipacks and infused options — from
          straightforward single-strain joints rolled with flower from their
          own menu to blunts and pre-rolls boosted with hash or concentrates
          for extra strength. Multipacks bring the per-joint price down and
          are the usual pick for regulars; infused rolls carry a clear
          premium. Descriptions typically state the strain, the weight per
          roll and the pack count. Freshness and how well they're rolled are
          the usual quality complaints, so recent reviews — indexed on every
          listing — are the best signal before you order.
        de-DE: >-
          Pre-Rolls nehmen einem das Drehen ab. Little Biggy Verkäufer
          listen Einzelstücke, Multipacks und Infused-Varianten – von
          einfachen Single-Strain-Joints mit Blüten aus dem eigenen
          Sortiment bis zu Blunts und Pre-Rolls, die mit Hash oder
          Konzentraten für extra Stärke angereichert sind. Multipacks
          drücken den Preis pro Joint und sind die übliche Wahl für
          Stammkunden; Infused Rolls kosten spürbar mehr. Beschreibungen
          nennen typischerweise Sorte, Gewicht pro Roll und Packungsgröße.
          Frische und die Qualität des Drehens sind die häufigsten
          Kritikpunkte – aktuelle Bewertungen, bei jedem Angebot indexiert,
          sind daher das beste Signal vor der Bestellung.
        fr-FR: >-
          Les pré-roulés vous épargnent le roulage. Les vendeurs de Little
          Biggy proposent des unités, des multipacks et des options
          infusées — du simple joint mono-variété roulé avec la fleur de
          leur propre menu aux blunts et pré-roulés renforcés au hash ou
          aux concentrés pour plus de puissance. Les multipacks font
          baisser le prix par joint et sont le choix habituel des
          habitués ; les roulés infusés se paient nettement plus cher. Les
          descriptions précisent en général la variété, le poids par joint
          et le nombre par paquet. La fraîcheur et la qualité du roulage
          sont les reproches les plus courants — les avis récents, indexés
          sur chaque annonce, sont le meilleur signal avant de commander.
        pt-PT: >-
          Os pre-rolls tiram o enrolar da equação. Os vendedores do Little
          Biggy listam unidades, multipacks e opções infundidas — desde
          joints simples de uma só strain, enrolados com flor do próprio
          menu, até blunts e pre-rolls reforçados com haxixe ou
          concentrados para mais força. Os multipacks baixam o preço por
          joint e são a escolha habitual dos clientes regulares; os rolls
          infundidos têm um prémio claro. As descrições costumam indicar a
          strain, o peso por roll e o número por pacote. A frescura e a
          qualidade do enrolamento são as queixas habituais, por isso as
          avaliações recentes — indexadas em cada anúncio — são o melhor
          sinal antes de encomendar.
        it-IT: >-
          I pre-roll tolgono di mezzo il rollare. I venditori di Little
          Biggy propongono pezzi singoli, multipack e opzioni infuse —
          dai semplici joint mono-strain rollati con i fiori del proprio
          menu ai blunt e pre-roll potenziati con hash o concentrati per
          più forza. I multipack abbassano il prezzo per joint e sono la
          scelta abituale dei clienti fissi; i roll infusi hanno un netto
          sovrapprezzo. Le descrizioni indicano di solito la strain, il
          peso per roll e il numero per confezione. Freschezza e qualità
          della rollata sono le lamentele più comuni, quindi le recensioni
          recenti — indicizzate su ogni annuncio — sono il segnale
          migliore prima di ordinare.
        es-ES: >-
          Los pre-rolls te ahorran el liado. Los vendedores de Little Biggy
          publican unidades, multipacks y opciones infusionadas — desde
          porros sencillos de una sola cepa liados con flor de su propio
          menú hasta blunts y pre-rolls reforzados con hachís o
          concentrados para más potencia. Los multipacks bajan el precio
          por porro y son la elección habitual de los clientes fijos; los
          liados infusionados llevan un sobreprecio claro. Las
          descripciones suelen indicar la cepa, el peso por unidad y el
          número por paquete. La frescura y lo bien liados que están son
          las quejas de calidad habituales, así que las reseñas recientes —
          indexadas en cada anuncio — son la mejor señal antes de pedir.
        el-GR: >-
          Τα pre-rolls βγάζουν το στρίψιμο από την εξίσωση. Οι πωλητές του
          Little Biggy προσφέρουν μονά, πολυσυσκευασίες και infused
          επιλογές — από απλά τζόιντ μίας ποικιλίας, στριμμένα με άνθη από
          το δικό τους μενού, μέχρι blunts και pre-rolls ενισχυμένα με
          χασίς ή συμπυκνώματα για έξτρα δύναμη. Οι πολυσυσκευασίες ρίχνουν
          την τιμή ανά τζόιντ και είναι η συνηθισμένη επιλογή των τακτικών·
          τα infused έχουν σαφώς υψηλότερη τιμή. Οι περιγραφές συνήθως
          αναφέρουν την ποικιλία, το βάρος ανά τεμάχιο και τον αριθμό της
          συσκευασίας. Η φρεσκάδα και το πόσο καλά είναι στριμμένα είναι τα
          συνήθη παράπονα ποιότητας, οπότε οι πρόσφατες κριτικές —
          ευρετηριασμένες σε κάθε καταχώριση — είναι το καλύτερο σήμα πριν
          παραγγείλετε.
        cs-CZ: >-
          Pre-rolls vám ušetří balení. Prodejci na Little Biggy nabízejí
          jednotlivé kusy, multipacky i infused varianty — od jednoduchých
          jointů z jedné odrůdy, ubalených z květů z vlastní nabídky, po
          blunty a pre-rolls posílené hashem nebo koncentráty pro extra
          sílu. Multipacky snižují cenu za joint a bývají volbou stálých
          zákazníků; infused rolls mají znatelnou přirážku. Popisy obvykle
          uvádějí odrůdu, hmotnost na kus a počet v balení. Čerstvost a
          kvalita ubalení jsou nejčastější výtky, takže nejnovější recenze
          — indexované u každé nabídky — jsou před objednávkou tím
          nejlepším vodítkem.
        pl-PL: >-
          Pre-rolls zdejmują z Ciebie kręcenie. Sprzedawcy na Little Biggy
          wystawiają sztuki pojedyncze, multipaki i opcje infused — od
          prostych jointów z jednej odmiany, skręconych z suszu z własnego
          menu, po blunty i pre-rolls wzmocnione haszem lub koncentratami
          dla większej mocy. Multipaki obniżają cenę za jointa i są zwykłym
          wyborem stałych klientów; skręty infused mają wyraźną dopłatę.
          Opisy zwykle podają odmianę, wagę na sztukę i liczbę w paczce.
          Świeżość i jakość skręcenia to najczęstsze zastrzeżenia, więc
          najnowsze recenzje — zaindeksowane przy każdej ofercie — to
          najlepszy sygnał przed zamówieniem.
      edibles:
        en-GB: >-
          Edibles on Little Biggy run from gummies and chocolate to baked
          goods, capsules and drink mixes. Strength is the first thing to
          check: listings state milligrams of THC per piece and per pack, and
          doses vary hugely — a sensible starting dose is 5–10mg, while some
          single sweets carry 100mg or more. Onset is slow, often 30–90
          minutes, so the golden rule is start low and wait before taking
          more. Vegan and gluten-free options appear regularly. We index
          per-piece strength where sellers declare it, so you can compare
          products on dose and value rather than pack price alone.
        de-DE: >-
          Edibles auf Little Biggy reichen von Gummis und Schokolade über
          Gebäck bis zu Kapseln und Getränkepulvern. Die Stärke ist das
          Erste, worauf man achten sollte: Angebote nennen Milligramm THC
          pro Stück und pro Packung, und die Dosen variieren enorm – eine
          vernünftige Anfangsdosis liegt bei 5–10 mg, während einzelne
          Süßigkeiten 100 mg oder mehr enthalten können. Die Wirkung setzt
          langsam ein, oft erst nach 30–90 Minuten. Die goldene Regel:
          niedrig anfangen und abwarten, bevor man nachlegt. Vegane und
          glutenfreie Optionen tauchen regelmäßig auf. Wir indexieren die
          Stärke pro Stück, wo Verkäufer sie angeben – so lassen sich
          Produkte nach Dosis und Preis-Leistung vergleichen statt nur nach
          Packungspreis.
        fr-FR: >-
          Les comestibles sur Little Biggy vont des gummies et du chocolat
          aux pâtisseries, gélules et mélanges à boire. La puissance est la
          première chose à vérifier : les annonces indiquent les
          milligrammes de THC par pièce et par paquet, et les doses varient
          énormément — une dose de départ raisonnable est de 5–10 mg,
          tandis que certains bonbons en contiennent 100 mg ou plus. Les
          effets arrivent lentement, souvent en 30–90 minutes ; la règle
          d’or est de commencer bas et d’attendre avant d’en reprendre. Des
          options véganes et sans gluten apparaissent régulièrement. Nous
          indexons la puissance par pièce quand les vendeurs la déclarent,
          pour comparer les produits selon la dose et le rapport
          qualité-prix plutôt que le seul prix du paquet.
        pt-PT: >-
          Os comestíveis no Little Biggy vão das gomas e chocolate aos
          produtos de pastelaria, cápsulas e misturas para bebidas. A força
          é a primeira coisa a verificar: as listagens indicam os
          miligramas de THC por unidade e por embalagem, e as doses variam
          imenso — uma dose inicial sensata é de 5–10 mg, enquanto alguns
          doces individuais levam 100 mg ou mais. O efeito demora, muitas
          vezes 30–90 minutos, por isso a regra de ouro é começar baixo e
          esperar antes de tomar mais. Opções veganas e sem glúten aparecem
          regularmente. Indexamos a força por unidade quando os vendedores
          a declaram, para poder comparar produtos por dose e valor, e não
          apenas pelo preço da embalagem.
        it-IT: >-
          Gli edibili su Little Biggy vanno dalle caramelle gommose e il
          cioccolato ai prodotti da forno, capsule e preparati per bevande.
          La potenza è la prima cosa da controllare: gli annunci indicano i
          milligrammi di THC per pezzo e per confezione, e le dosi variano
          enormemente — una dose iniziale sensata è 5–10 mg, mentre alcuni
          singoli dolcetti ne contengono 100 mg o più. L'effetto arriva
          lentamente, spesso in 30–90 minuti, quindi la regola d'oro è
          iniziare basso e aspettare prima di prenderne altri. Opzioni
          vegane e senza glutine compaiono regolarmente. Indicizziamo la
          potenza per pezzo quando i venditori la dichiarano, così puoi
          confrontare i prodotti per dose e convenienza anziché solo per
          prezzo della confezione.
        es-ES: >-
          Los comestibles en Little Biggy van desde gominolas y chocolate
          hasta repostería, cápsulas y mezclas para bebidas. La potencia es
          lo primero que hay que comprobar: los anuncios indican los
          miligramos de THC por pieza y por paquete, y las dosis varían
          muchísimo — una dosis inicial sensata es de 5–10 mg, mientras que
          algunos dulces sueltos llevan 100 mg o más. El efecto tarda,
          a menudo entre 30 y 90 minutos, así que la regla de oro es
          empezar bajo y esperar antes de tomar más. Aparecen regularmente
          opciones veganas y sin gluten. Indexamos la potencia por pieza
          cuando los vendedores la declaran, para comparar productos por
          dosis y valor y no solo por el precio del paquete.
        el-GR: >-
          Τα εδώδιμα στο Little Biggy πάνε από ζελεδάκια και σοκολάτα μέχρι
          αρτοσκευάσματα, κάψουλες και μείγματα ροφημάτων. Η δύναμη είναι
          το πρώτο που ελέγχετε: οι καταχωρίσεις αναφέρουν χιλιοστόγραμμα
          THC ανά τεμάχιο και ανά συσκευασία, και οι δόσεις διαφέρουν
          τεράστια — μια λογική αρχική δόση είναι 5–10 mg, ενώ κάποια
          μεμονωμένα γλυκά έχουν 100 mg ή περισσότερο. Η δράση αργεί, συχνά
          30–90 λεπτά, οπότε ο χρυσός κανόνας είναι να ξεκινάτε χαμηλά και
          να περιμένετε πριν πάρετε κι άλλο. Vegan και χωρίς γλουτένη
          επιλογές εμφανίζονται τακτικά. Ευρετηριάζουμε τη δύναμη ανά
          τεμάχιο όπου τη δηλώνουν οι πωλητές, ώστε να συγκρίνετε προϊόντα
          με βάση τη δόση και την αξία, όχι μόνο την τιμή της συσκευασίας.
        cs-CZ: >-
          Jedlé produkty na Little Biggy sahají od gumídků a čokolády po
          pečivo, kapsle a nápojové směsi. Síla je to první, co je třeba
          zkontrolovat: nabídky uvádějí miligramy THC na kus a na balení a
          dávky se ohromně liší — rozumná počáteční dávka je 5–10 mg,
          zatímco některé jednotlivé sladkosti obsahují 100 mg i víc.
          Nástup je pomalý, často 30–90 minut, takže zlaté pravidlo zní:
          začít nízko a počkat, než si vezmete další. Veganské a
          bezlepkové varianty se objevují pravidelně. Sílu na kus
          indexujeme tam, kde ji prodejci uvádějí, takže můžete produkty
          srovnávat podle dávky a hodnoty, ne jen podle ceny balení.
        pl-PL: >-
          Edibles na Little Biggy to wszystko od żelek i czekolady po
          wypieki, kapsułki i mieszanki do napojów. Moc to pierwsza rzecz
          do sprawdzenia: oferty podają miligramy THC na sztukę i na
          opakowanie, a dawki różnią się ogromnie — rozsądna dawka
          początkowa to 5–10 mg, podczas gdy niektóre pojedyncze słodycze
          mają 100 mg lub więcej. Działanie przychodzi powoli, często po
          30–90 minutach, więc złota zasada brzmi: zacznij nisko i poczekaj,
          zanim weźmiesz więcej. Regularnie pojawiają się opcje wegańskie i
          bezglutenowe. Indeksujemy moc na sztukę tam, gdzie sprzedawcy ją
          deklarują, więc możesz porównywać produkty według dawki i
          opłacalności, a nie tylko ceny opakowania.
      tincture:
        en-GB: >-
          Tinctures are liquid cannabis extracts taken as drops under the
          tongue — a smoke-free option with faster onset than edibles and
          finer dose control than either. Listings on Little Biggy include
          THC oils, CBD blends and balanced ratios, usually stating strength
          in milligrams per bottle or per millilitre. Sublingual effects
          typically arrive within 15–45 minutes, quicker than eating and
          easier to titrate. Full-extract RSO-style oils appear here too,
          favoured by high-dose users. Bottle size, carrier oil and total
          strength drive the price, so the per-milligram cost is the fairest
          way to compare sellers — check it before judging a bottle
          expensive.
        de-DE: >-
          Tinkturen sind flüssige Cannabis-Extrakte, die als Tropfen unter
          die Zunge genommen werden – eine rauchfreie Option mit schnellerem
          Wirkeintritt als Edibles und feinerer Dosiskontrolle als beide.
          Die Angebote auf Little Biggy umfassen THC-Öle, CBD-Mischungen
          und ausgewogene Verhältnisse, meist mit Stärkeangabe in Milligramm
          pro Flasche oder pro Milliliter. Sublinguale Effekte setzen
          typischerweise nach 15–45 Minuten ein – schneller als beim Essen
          und leichter zu dosieren. Auch Vollextrakt-Öle im RSO-Stil tauchen
          hier auf, beliebt bei Hochdosis-Nutzern. Flaschengröße, Trägeröl
          und Gesamtstärke bestimmen den Preis – der Preis pro Milligramm
          ist daher der fairste Vergleich, bevor man eine Flasche als teuer
          abstempelt.
        fr-FR: >-
          Les teintures sont des extraits liquides de cannabis pris en
          gouttes sous la langue — une option sans fumée, aux effets plus
          rapides que les comestibles et au dosage plus fin que les deux.
          Les annonces sur Little Biggy comprennent des huiles THC, des
          mélanges CBD et des ratios équilibrés, avec la puissance indiquée
          en milligrammes par flacon ou par millilitre. Les effets
          sublinguaux arrivent en général en 15–45 minutes, plus vite qu’en
          mangeant et plus faciles à doser. On trouve aussi des huiles
          full-extract de style RSO, appréciées des gros consommateurs. La
          taille du flacon, l’huile de support et la puissance totale font
          le prix — le coût par milligramme est donc la comparaison la plus
          juste avant de juger un flacon trop cher.
        pt-PT: >-
          As tinturas são extratos líquidos de canábis tomados em gotas
          debaixo da língua — uma opção sem fumo, com efeito mais rápido do
          que os comestíveis e um controlo de dose mais fino do que ambos.
          As listagens no Little Biggy incluem óleos de THC, misturas de
          CBD e rácios equilibrados, normalmente com a força em miligramas
          por frasco ou por mililitro. Os efeitos sublinguais chegam
          tipicamente em 15–45 minutos, mais depressa do que comer e mais
          fáceis de titular. Também aparecem óleos full-extract ao estilo
          RSO, preferidos por utilizadores de doses altas. O tamanho do
          frasco, o óleo de base e a força total ditam o preço — o custo
          por miligrama é a forma mais justa de comparar vendedores antes
          de achar um frasco caro.
        it-IT: >-
          Le tinture sono estratti liquidi di cannabis assunti a gocce
          sotto la lingua — un'opzione senza fumo, con effetti più rapidi
          degli edibili e un controllo della dose più fine di entrambi. Gli
          annunci su Little Biggy includono oli THC, miscele CBD e rapporti
          bilanciati, di solito con la potenza in milligrammi per flacone o
          per millilitro. Gli effetti sublinguali arrivano in genere in
          15–45 minuti, più in fretta che mangiando e più facili da
          titolare. Compaiono anche oli full-extract in stile RSO,
          preferiti da chi usa dosi alte. Dimensione del flacone, olio
          vettore e potenza totale determinano il prezzo — il costo per
          milligrammo è il confronto più equo prima di giudicare caro un
          flacone.
        es-ES: >-
          Las tinturas son extractos líquidos de cannabis que se toman en
          gotas bajo la lengua: una opción sin humo, con efecto más rápido
          que los comestibles y un control de dosis más fino que ambos. Los
          anuncios en Little Biggy incluyen aceites de THC, mezclas de CBD
          y proporciones equilibradas, normalmente con la potencia en
          miligramos por frasco o por mililitro. Los efectos sublinguales
          suelen llegar en 15–45 minutos, más rápido que comiendo y más
          fáciles de ajustar. También aparecen aceites full-extract estilo
          RSO, preferidos por usuarios de dosis altas. El tamaño del
          frasco, el aceite portador y la potencia total marcan el precio,
          así que el coste por miligramo es la forma más justa de comparar
          vendedores antes de considerar caro un frasco.
        el-GR: >-
          Τα βάμματα είναι υγρά εκχυλίσματα κάνναβης που λαμβάνονται σε
          σταγόνες κάτω από τη γλώσσα — μια επιλογή χωρίς κάπνισμα, με
          γρηγορότερη δράση από τα εδώδιμα και πιο λεπτό έλεγχο δόσης από
          αμφότερα. Οι καταχωρίσεις στο Little Biggy περιλαμβάνουν έλαια
          THC, μείγματα CBD και ισορροπημένες αναλογίες, συνήθως με τη
          δύναμη σε χιλιοστόγραμμα ανά φιάλη ή ανά χιλιοστόλιτρο. Η
          υπογλώσσια δράση έρχεται τυπικά σε 15–45 λεπτά, πιο γρήγορα από
          την κατάποση και ευκολότερη στη ρύθμιση. Εμφανίζονται επίσης
          έλαια πλήρους εκχύλισης τύπου RSO, αγαπητά σε χρήστες υψηλών
          δόσεων. Το μέγεθος φιάλης, το έλαιο-φορέας και η συνολική δύναμη
          καθορίζουν την τιμή — το κόστος ανά χιλιοστόγραμμο είναι η πιο
          δίκαιη σύγκριση πριν κρίνετε μια φιάλη ακριβή.
        cs-CZ: >-
          Tinktury jsou tekuté konopné extrakty užívané po kapkách pod
          jazyk — bezkouřová volba s rychlejším nástupem než jedlé produkty
          a jemnějším dávkováním než obojí. Nabídky na Little Biggy
          zahrnují THC oleje, CBD směsi a vyvážené poměry, obvykle se
          sílou v miligramech na lahvičku nebo mililitr. Sublinguální
          účinky přicházejí typicky za 15–45 minut, rychleji než při jídle
          a snáz se dávkují. Objevují se tu i plnoextraktové oleje ve stylu
          RSO, oblíbené u uživatelů vysokých dávek. Cenu určuje velikost
          lahvičky, nosný olej a celková síla — cena za miligram je proto
          nejférovější srovnání, než lahvičku odsoudíte jako drahou.
        pl-PL: >-
          Nalewki to płynne ekstrakty konopne przyjmowane w kroplach pod
          język — opcja bez dymu, o szybszym działaniu niż edibles i
          dokładniejszym dawkowaniu niż jedno i drugie. Oferty na Little
          Biggy obejmują oleje THC, mieszanki CBD i zbalansowane proporcje,
          zwykle z mocą w miligramach na butelkę lub mililitr. Efekty
          podjęzykowe pojawiają się zwykle w 15–45 minut, szybciej niż po
          zjedzeniu i łatwiej je miareczkować. Pojawiają się tu też oleje
          full-extract w stylu RSO, cenione przez osoby biorące wysokie
          dawki. Cenę napędzają rozmiar butelki, olej nośny i całkowita
          moc — koszt za miligram to najuczciwszy sposób porównania
          sprzedawców, zanim uznasz butelkę za drogą.
      psychedelics:
        en-GB: >-
          Psychedelics gathers Little Biggy's non-cannabis listings: dried
          mushrooms, truffles, microdose capsules, and mushroom chocolates
          and gummies. Dried fruit is the staple, with strength varying
          noticeably by variety — descriptions usually name the strain and a
          suggested dose range. Microdose capsules offer measured
          sub-perceptual amounts for people following a schedule, while
          chocolates and gummies split a full dose into smaller, easier
          pieces. Set, setting and starting low matter more in this category
          than anywhere else on the site. Seller reviews and delivery times
          are indexed on every listing, exactly as with the cannabis
          categories.
        de-DE: >-
          Psychedelika versammelt die Nicht-Cannabis-Angebote von Little
          Biggy: getrocknete Pilze, Trüffel, Mikrodosis-Kapseln sowie
          Pilz-Schokoladen und -Gummis. Getrocknete Pilze sind der
          Standard, wobei die Stärke je nach Sorte deutlich schwankt –
          Beschreibungen nennen meist die Sorte und einen empfohlenen
          Dosisbereich. Mikrodosis-Kapseln bieten abgemessene,
          unterschwellige Mengen für Leute mit festem Schema, während
          Schokoladen und Gummis eine volle Dosis in kleinere, leichter
          handhabbare Stücke aufteilen. Set, Setting und niedrig anfangen
          zählen in dieser Kategorie mehr als überall sonst auf der Seite.
          Verkäuferbewertungen und Lieferzeiten sind bei jedem Angebot
          indexiert, genau wie in den Cannabis-Kategorien.
        fr-FR: >-
          Psychédéliques rassemble les annonces non-cannabis de Little
          Biggy : champignons séchés, truffes, gélules de microdose, et
          chocolats et gummies aux champignons. Les champignons séchés sont
          la base, avec une puissance qui varie nettement selon la variété
          — les descriptions donnent en général la variété et une plage de
          dose conseillée. Les gélules de microdose offrent des quantités
          mesurées sub-perceptuelles pour ceux qui suivent un protocole,
          tandis que chocolats et gummies divisent une dose complète en
          morceaux plus petits et plus simples. Le set, le setting et
          commencer bas comptent plus ici que partout ailleurs sur le site.
          Les avis vendeurs et délais de livraison sont indexés sur chaque
          annonce, exactement comme pour les catégories cannabis.
        pt-PT: >-
          Psicadélicos reúne as listagens não-canábis do Little Biggy:
          cogumelos secos, trufas, cápsulas de microdose e chocolates e
          gomas de cogumelos. Os cogumelos secos são a base, com a força a
          variar bastante consoante a variedade — as descrições costumam
          indicar a variedade e um intervalo de dose sugerido. As cápsulas
          de microdose oferecem quantidades medidas e sub-percetuais para
          quem segue um plano, enquanto chocolates e gomas dividem uma dose
          completa em pedaços mais pequenos e fáceis. Set, setting e
          começar baixo importam mais nesta categoria do que em qualquer
          outra do site. As avaliações dos vendedores e prazos de entrega
          estão indexados em cada anúncio, tal como nas categorias de
          canábis.
        it-IT: >-
          Psichedelici raccoglie gli annunci non-cannabis di Little Biggy:
          funghi essiccati, tartufi, capsule per microdosi, e cioccolatini
          e caramelle ai funghi. I funghi essiccati sono la base, con una
          potenza che varia sensibilmente in base alla varietà — le
          descrizioni di solito indicano la varietà e un intervallo di dose
          consigliato. Le capsule per microdosi offrono quantità misurate
          sub-percettive per chi segue un programma, mentre cioccolatini e
          caramelle dividono una dose piena in pezzi più piccoli e
          gestibili. Set, setting e partire bassi contano qui più che in
          qualsiasi altra parte del sito. Recensioni dei venditori e tempi
          di consegna sono indicizzati su ogni annuncio, esattamente come
          per le categorie cannabis.
        es-ES: >-
          Psicodélicos reúne los anuncios no-cannabis de Little Biggy:
          setas secas, trufas, cápsulas de microdosis, y chocolates y
          gominolas de setas. Las setas secas son lo básico, con una
          potencia que varía notablemente según la variedad — las
          descripciones suelen indicar la variedad y un rango de dosis
          sugerido. Las cápsulas de microdosis ofrecen cantidades medidas
          sub-perceptuales para quien sigue una pauta, mientras que
          chocolates y gominolas dividen una dosis completa en piezas más
          pequeñas y manejables. El set, el setting y empezar bajo importan
          aquí más que en ningún otro lugar del sitio. Las reseñas de
          vendedores y los plazos de entrega están indexados en cada
          anuncio, igual que en las categorías de cannabis.
        el-GR: >-
          Τα ψυχεδελικά συγκεντρώνουν τις μη-κανναβικές καταχωρίσεις του
          Little Biggy: αποξηραμένα μανιτάρια, τρούφες, κάψουλες
          μικροδόσης, και σοκολάτες και ζελεδάκια μανιταριών. Τα
          αποξηραμένα μανιτάρια είναι η βάση, με τη δύναμη να διαφέρει
          αισθητά ανά ποικιλία — οι περιγραφές συνήθως αναφέρουν την
          ποικιλία και ένα προτεινόμενο εύρος δόσης. Οι κάψουλες
          μικροδόσης προσφέρουν μετρημένες, υπο-αντιληπτικές ποσότητες για
          όσους ακολουθούν πρόγραμμα, ενώ σοκολάτες και ζελεδάκια χωρίζουν
          μια πλήρη δόση σε μικρότερα, πιο εύκολα κομμάτια. Το set, το
          setting και το χαμηλό ξεκίνημα μετράνε εδώ περισσότερο από
          οπουδήποτε αλλού στον ιστότοπο. Κριτικές πωλητών και χρόνοι
          παράδοσης είναι ευρετηριασμένα σε κάθε καταχώριση, όπως ακριβώς
          στις κατηγορίες κάνναβης.
        cs-CZ: >-
          Psychedelika sdružují nekonopné nabídky Little Biggy: sušené
          houby, lanýže, mikrodávkové kapsle a houbové čokolády a gumídky.
          Základem jsou sušené houby, jejichž síla se podle odrůdy znatelně
          liší — popisy obvykle uvádějí odrůdu a doporučené rozmezí dávky.
          Mikrodávkové kapsle nabízejí odměřená, podprahová množství pro
          ty, kdo dodržují rozvrh, zatímco čokolády a gumídky dělí plnou
          dávku na menší, snazší kousky. Set, setting a nízký začátek tady
          hrají větší roli než kdekoli jinde na webu. Recenze prodejců a
          doby doručení jsou indexovány u každé nabídky, přesně jako u
          konopných kategorií.
        pl-PL: >-
          Psychodeliki zbierają niekonopne oferty Little Biggy: suszone
          grzyby, trufle, kapsułki do mikrodawkowania oraz grzybowe
          czekolady i żelki. Podstawą są suszone grzyby, których moc
          wyraźnie zależy od odmiany — opisy zwykle podają odmianę i
          sugerowany zakres dawki. Kapsułki do mikrodawkowania oferują
          odmierzone, podprogowe ilości dla osób trzymających się planu, a
          czekolady i żelki dzielą pełną dawkę na mniejsze, łatwiejsze
          kawałki. Set, setting i niski start liczą się w tej kategorii
          bardziej niż gdziekolwiek indziej na stronie. Recenzje
          sprzedawców i czasy dostawy są zaindeksowane przy każdej ofercie,
          dokładnie tak jak w kategoriach konopnych.
      other:
        en-GB: >-
          Other is the catch-all for listings that don't fit the main
          categories: CBD products, seeds, accessories like grinders and
          rolling supplies, and the one-off items sellers list alongside
          their main menu. It's worth a scan now and then because new product
          types tend to land here first, before there are enough listings to
          justify a category of their own. Expect the contents to shift week
          to week as sellers rotate stock. Every listing still carries the
          same indexed data as the rest of the site — price, seller history,
          review scores and shipping options — so an unusual item can be
          vetted exactly like a mainstream one.
        de-DE: >-
          Sonstiges ist die Sammelkategorie für Angebote, die nicht in die
          Hauptkategorien passen: CBD-Produkte, Samen, Zubehör wie Grinder
          und Drehbedarf sowie die Einzelstücke, die Verkäufer neben ihrem
          Hauptsortiment listen. Ein gelegentlicher Blick lohnt sich, denn
          neue Produkttypen landen meist zuerst hier, bevor es genug
          Angebote für eine eigene Kategorie gibt. Der Inhalt wechselt von
          Woche zu Woche, wenn Verkäufer ihren Bestand rotieren. Jedes
          Angebot trägt dieselben indexierten Daten wie der Rest der Seite
          – Preis, Verkäuferhistorie, Bewertungen und Versandoptionen –,
          sodass sich ein ungewöhnlicher Artikel genauso prüfen lässt wie
          ein gängiger.
        fr-FR: >-
          Autres est la catégorie fourre-tout pour les annonces qui ne
          rentrent pas dans les catégories principales : produits CBD,
          graines, accessoires comme les grinders et le matériel de
          roulage, et les articles ponctuels que les vendeurs listent à
          côté de leur menu principal. Un coup d’œil de temps en temps vaut
          la peine, car les nouveaux types de produits atterrissent
          généralement ici en premier, avant qu’il y ait assez d’annonces
          pour justifier leur propre catégorie. Attendez-vous à un contenu
          qui change de semaine en semaine au gré des stocks. Chaque
          annonce porte les mêmes données indexées que le reste du site —
          prix, historique du vendeur, notes d’avis et options de livraison
          — si bien qu’un article insolite se vérifie exactement comme un
          article classique.
        pt-PT: >-
          Outros é a categoria abrangente para listagens que não encaixam
          nas categorias principais: produtos CBD, sementes, acessórios
          como grinders e material para enrolar, e os artigos pontuais que
          os vendedores listam ao lado do menu principal. Vale a pena
          espreitar de vez em quando, porque os novos tipos de produto
          costumam aparecer aqui primeiro, antes de haver listagens
          suficientes para justificar uma categoria própria. Espere que o
          conteúdo mude de semana para semana à medida que os vendedores
          rodam o stock. Cada anúncio continua a ter os mesmos dados
          indexados que o resto do site — preço, histórico do vendedor,
          avaliações e opções de envio — pelo que um artigo invulgar pode
          ser verificado exatamente como um convencional.
        it-IT: >-
          Altro è la categoria contenitore per gli annunci che non
          rientrano nelle categorie principali: prodotti CBD, semi,
          accessori come grinder e articoli per rollare, e i pezzi unici
          che i venditori mettono accanto al loro menu principale. Vale la
          pena darci un'occhiata ogni tanto, perché i nuovi tipi di
          prodotto tendono ad arrivare prima qui, prima che ci siano
          abbastanza annunci da giustificare una categoria dedicata.
          Aspettati contenuti che cambiano di settimana in settimana con la
          rotazione delle scorte. Ogni annuncio porta gli stessi dati
          indicizzati del resto del sito — prezzo, storico del venditore,
          punteggi delle recensioni e opzioni di spedizione — così un
          articolo insolito si può verificare esattamente come uno
          comune.
        es-ES: >-
          Otros es el cajón de sastre para anuncios que no encajan en las
          categorías principales: productos CBD, semillas, accesorios como
          grinders y material de liar, y los artículos puntuales que los
          vendedores publican junto a su menú principal. Merece un vistazo
          de vez en cuando, porque los nuevos tipos de producto suelen
          aterrizar aquí primero, antes de que haya suficientes anuncios
          para justificar una categoría propia. Espera que el contenido
          cambie de semana en semana según los vendedores rotan el stock.
          Cada anuncio conserva los mismos datos indexados que el resto del
          sitio — precio, historial del vendedor, puntuaciones de reseñas y
          opciones de envío — así que un artículo poco común se puede
          examinar exactamente igual que uno convencional.
        el-GR: >-
          Τα Άλλα είναι η κατηγορία-συλλέκτης για καταχωρίσεις που δεν
          ταιριάζουν στις κύριες κατηγορίες: προϊόντα CBD, σπόροι,
          αξεσουάρ όπως grinders και είδη στριφτού, και τα μεμονωμένα
          αντικείμενα που οι πωλητές βάζουν δίπλα στο κύριο μενού τους.
          Αξίζει μια ματιά πού και πού, γιατί οι νέοι τύποι προϊόντων
          συνήθως προσγειώνονται πρώτα εδώ, πριν υπάρξουν αρκετές
          καταχωρίσεις για δική τους κατηγορία. Περιμένετε το περιεχόμενο
          να αλλάζει από εβδομάδα σε εβδομάδα καθώς οι πωλητές ανανεώνουν
          το απόθεμα. Κάθε καταχώριση έχει τα ίδια ευρετηριασμένα δεδομένα
          με τον υπόλοιπο ιστότοπο — τιμή, ιστορικό πωλητή, βαθμολογίες
          κριτικών και επιλογές αποστολής — ώστε ένα ασυνήθιστο αντικείμενο
          να ελέγχεται ακριβώς όπως ένα συνηθισμένο.
        cs-CZ: >-
          Ostatní je sběrná kategorie pro nabídky, které nezapadají do
          hlavních kategorií: CBD produkty, semena, příslušenství jako
          drtičky a balicí potřeby a jednorázové kousky, které prodejci
          nabízejí vedle hlavního sortimentu. Občas se vyplatí sem
          nahlédnout, protože nové typy produktů se obvykle objeví nejdřív
          tady, než je nabídek dost na vlastní kategorii. Počítejte s tím,
          že se obsah týden od týdne mění, jak prodejci obměňují zásoby.
          Každá nabídka nese stejná indexovaná data jako zbytek webu —
          cenu, historii prodejce, hodnocení recenzí a možnosti dopravy —
          takže neobvyklou položku prověříte úplně stejně jako běžnou.
        pl-PL: >-
          Inne to kategoria zbiorcza dla ofert, które nie pasują do
          głównych kategorii: produkty CBD, nasiona, akcesoria takie jak
          grindery i artykuły do skrętów oraz pojedyncze przedmioty, które
