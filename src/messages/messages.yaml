      en-GB: "littlebiggy.org — Is It Down? Real Address & Live Status"
      de-DE: "littlebiggy.org — Ist es down? Echte Adresse & Live-Status"
      fr-FR: "littlebiggy.org — En panne ? Vraie adresse & statut en direct"
      pt-PT: "littlebiggy.org — Está em baixo? Endereço real e estado ao vivo"
      it-IT: "littlebiggy.org — È offline? Indirizzo reale e stato live"
      es-ES: "littlebiggy.org — ¿Está caído? Dirección real y estado en vivo"
      el-GR: "littlebiggy.org — Λειτουργεί; Πραγματική διεύθυνση & κατάσταση"
      cs-CZ: "littlebiggy.org — Je mimo provoz? Skutečná adresa a živý stav"
      pl-PL: "littlebiggy.org — Czy działa? Prawdziwy adres i status na żywo"
    description:
      en-GB: "Is littlebiggy.org up or down right now? A live status check with uptime history, the official address, login help and what to do during an outage — refreshed every few minutes."
      de-DE: "Ist littlebiggy.org gerade online oder offline? Ein Live-Status mit Verlauf, der offiziellen Adresse, Login-Hilfe und Tipps bei Ausfällen — alle paar Minuten aktualisiert."
      fr-FR: "littlebiggy.org est-il en ligne ou en panne ? Un statut en direct avec historique, l'adresse officielle, une aide à la connexion et que faire en cas de panne — actualisé en continu."
      pt-PT: "O littlebiggy.org está online ou em baixo? Estado ao vivo com histórico, o endereço oficial, ajuda de início de sessão e o que fazer numa falha — atualizado a cada minutos."
      it-IT: "littlebiggy.org è online o offline? Stato in tempo reale con cronologia, indirizzo ufficiale, aiuto per l'accesso e cosa fare durante un'interruzione — aggiornato di continuo."
      es-ES: "¿littlebiggy.org está en línea o caído? Estado en vivo con historial, la dirección oficial, ayuda para iniciar sesión y qué hacer en una caída — actualizado cada pocos minutos."
      el-GR: "Λειτουργεί το littlebiggy.org τώρα; Ζωντανή κατάσταση με ιστορικό, η επίσημη διεύθυνση, βοήθεια σύνδεσης και τι να κάνετε σε διακοπή — ανανεώνεται συχνά."
      cs-CZ: "Funguje littlebiggy.org právě teď? Živý stav s historií, oficiální adresa, pomoc s přihlášením a co dělat při výpadku — pravidelně aktualizováno."
      pl-PL: "Czy littlebiggy.org działa teraz? Status na żywo z historią, oficjalny adres, pomoc przy logowaniu i co robić podczas awarii — odświeżane co kilka minut."
