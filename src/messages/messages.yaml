    intro:
      en-GB: "These are the {count} most recent buyer reviews indexed from Little Biggy, refreshed throughout the day. Across them, buyers rate their orders {rating}/10 on average, with delivery typically taking about {days, plural, one {a day} other {# days}}. Photos, ratings and delivery times come straight from the reviews themselves — nothing is edited or curated."
      de-DE: "Dies sind die {count} neuesten Käuferbewertungen, die wir von Little Biggy indexieren – mehrmals täglich aktualisiert. Im Durchschnitt bewerten Käufer ihre Bestellungen mit {rating}/10, die Lieferung dauert typischerweise etwa {days, plural, one {einen Tag} other {# Tage}}. Fotos, Bewertungen und Lieferzeiten stammen direkt aus den Bewertungen – nichts wird bearbeitet oder kuratiert."
      fr-FR: "Voici les {count} avis d'acheteurs les plus récents indexés depuis Little Biggy, actualisés tout au long de la journée. En moyenne, les acheteurs notent leurs commandes {rating}/10, avec une livraison en environ {days, plural, one {un jour} other {# jours}}. Photos, notes et délais de livraison proviennent directement des avis — rien n'est modifié ni trié."
      pt-PT: "Estas são as {count} avaliações de compradores mais recentes indexadas do Little Biggy, atualizadas ao longo do dia. Em média, os compradores classificam as suas encomendas com {rating}/10, com entrega tipicamente em cerca de {days, plural, one {um dia} other {# dias}}. Fotos, classificações e prazos de entrega vêm diretamente das avaliações — nada é editado ou selecionado."
      it-IT: "Queste sono le {count} recensioni di acquirenti più recenti indicizzate da Little Biggy, aggiornate durante la giornata. In media gli acquirenti valutano i loro ordini {rating}/10, con consegna tipicamente in circa {days, plural, one {un giorno} other {# giorni}}. Foto, valutazioni e tempi di consegna vengono direttamente dalle recensioni — nulla è modificato o selezionato."
      es-ES: "Estas son las {count} reseñas de compradores más recientes indexadas de Little Biggy, actualizadas a lo largo del día. De media, los compradores puntúan sus pedidos con {rating}/10, con una entrega que suele tardar {days, plural, one {un día} other {# días}}. Las fotos, valoraciones y plazos de entrega salen directamente de las reseñas: nada se edita ni se selecciona."
      el-GR: "Αυτές είναι οι {count} πιο πρόσφατες κριτικές αγοραστών που ευρετηριάζουμε από το Little Biggy, ανανεωμένες κατά τη διάρκεια της ημέρας. Κατά μέσο όρο, οι αγοραστές βαθμολογούν τις παραγγελίες τους με {rating}/10, με παράδοση συνήθως σε περίπου {days, plural, one {μία ημέρα} other {# ημέρες}}. Φωτογραφίες, βαθμολογίες και χρόνοι παράδοσης προέρχονται απευθείας από τις κριτικές — τίποτα δεν επεξεργάζεται ή επιλέγεται."
      cs-CZ: "Toto je {count} nejnovějších recenzí kupujících indexovaných z Little Biggy, aktualizovaných v průběhu dne. Kupující v průměru hodnotí své objednávky {rating}/10 a doručení obvykle trvá přibližně {days, plural, one {den} few {# dny} other {# dní}}. Fotky, hodnocení a časy doručení pocházejí přímo z recenzí — nic neupravujeme ani nevybíráme."
      pl-PL: "Oto {count} najnowszych recenzji kupujących zindeksowanych z Little Biggy, odświeżanych w ciągu dnia. Kupujący oceniają swoje zamówienia średnio na {rating}/10, a dostawa trwa zwykle około {days, plural, one {jednego dnia} other {# dni}}. Zdjęcia, oceny i czasy dostawy pochodzą wprost z recenzji — niczego nie redagujemy ani nie wybieramy."
