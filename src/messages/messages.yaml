  # Anti-phishing card on the status page. The LINK labels/descriptions are
  # reused from `header.verify` — one list, one copy set, three surfaces.
  verify:
    heading:
      en-GB: Make sure you're on the real Little Biggy
      de-DE: Stelle sicher, dass du beim echten Little Biggy bist
      fr-FR: Assure-toi d'être sur le vrai Little Biggy
      pt-PT: Certifica-te de que estás no verdadeiro Little Biggy
      it-IT: Assicurati di essere sul vero Little Biggy
      es-ES: Asegúrate de estar en el Little Biggy real
      el-GR: Βεβαιωθείτε ότι βρίσκεστε στο πραγματικό Little Biggy
      cs-CZ: Ujistěte se, že jste na pravém Little Biggy
      pl-PL: Upewnij się, że jesteś na prawdziwym Little Biggy
    headingDown:
      en-GB: Can't reach it? Try these
      de-DE: Kein Zugriff? Probiere diese
      fr-FR: Impossible d'y accéder ? Essaie ceci
      pt-PT: Não consegues aceder? Experimenta estes
      it-IT: Non riesci a raggiungerlo? Prova questi
      es-ES: ¿No puedes acceder? Prueba estos
      el-GR: Δεν μπορείτε να συνδεθείτε; Δοκιμάστε αυτά
      cs-CZ: Nedostanete se tam? Zkuste tyto
      pl-PL: Nie możesz się połączyć? Wypróbuj te
    body:
      en-GB: Phishing clones of Little Biggy exist. These are the pages that prove you're in the real ecosystem — and where the community posts during an outage.
      de-DE: Es gibt Phishing-Klone von Little Biggy. Diese Seiten belegen, dass du im echten Ökosystem bist — und dort postet die Community bei Ausfällen.
      fr-FR: Des clones de phishing de Little Biggy existent. Ce sont les pages qui prouvent que tu es dans le vrai écosystème — et où la communauté publie pendant une panne.
      pt-PT: Existem clones de phishing do Little Biggy. Estas são as páginas que provam que estás no ecossistema real — e onde a comunidade publica durante uma falha.
      it-IT: Esistono cloni di phishing di Little Biggy. Queste sono le pagine che dimostrano che sei nell'ecosistema reale — e dove la community scrive durante un'interruzione.
      es-ES: Existen clones de phishing de Little Biggy. Estas son las páginas que demuestran que estás en el ecosistema real — y donde la comunidad publica durante una caída.
      el-GR: Υπάρχουν κλώνοι phishing του Little Biggy. Αυτές είναι οι σελίδες που αποδεικνύουν ότι βρίσκεστε στο πραγματικό οικοσύστημα — και εκεί δημοσιεύει η κοινότητα σε διακοπή.
      cs-CZ: Existují phishingové klony Little Biggy. Toto jsou stránky, které dokazují, že jste ve skutečném ekosystému — a kde komunita píše během výpadku.
      pl-PL: Istnieją phishingowe klony Little Biggy. To są strony, które potwierdzają, że jesteś w prawdziwym ekosystemie — i gdzie społeczność pisze podczas awarii.
  # Answers the domain-guessing searches (.net, .com and other misspellings)
  # that land on this page. Domain names stay literal in every locale.
  addresses:
    heading:
      en-GB: Which address is the real Little Biggy?
      de-DE: Welche Adresse ist das echte Little Biggy?
      fr-FR: Quelle adresse est le vrai Little Biggy ?
      pt-PT: Qual é o endereço verdadeiro do Little Biggy?
      it-IT: Qual è il vero indirizzo di Little Biggy?
      es-ES: ¿Cuál es la dirección real de Little Biggy?
      el-GR: Ποια διεύθυνση είναι το πραγματικό Little Biggy;
      cs-CZ: Která adresa je skutečný Little Biggy?
      pl-PL: Który adres to prawdziwy Little Biggy?
    body:
      en-GB: The marketplace lives at littlebiggy.org — that is the only official address. Verified mirror domains are listed at littlebiggy.zone. Sites at littlebiggy.net, littlebiggy.com or similar spellings are not the marketplace and may be phishing clones.
      de-DE: Der Marktplatz liegt unter littlebiggy.org — das ist die einzige offizielle Adresse. Geprüfte Spiegel-Domains stehen auf littlebiggy.zone. Seiten unter littlebiggy.net, littlebiggy.com oder ähnlichen Schreibweisen sind nicht der Marktplatz und können Phishing-Klone sein.
      fr-FR: La marketplace se trouve sur littlebiggy.org — c'est la seule adresse officielle. Les domaines miroirs vérifiés sont listés sur littlebiggy.zone. Les sites en littlebiggy.net, littlebiggy.com ou aux orthographes voisines ne sont pas la marketplace et peuvent être des clones de phishing.
      pt-PT: O marketplace fica em littlebiggy.org — é o único endereço oficial. Os domínios espelho verificados estão listados em littlebiggy.zone. Sites em littlebiggy.net, littlebiggy.com ou com grafias semelhantes não são o marketplace e podem ser clones de phishing.
      it-IT: Il marketplace si trova su littlebiggy.org — è l'unico indirizzo ufficiale. I domini mirror verificati sono elencati su littlebiggy.zone. I siti su littlebiggy.net, littlebiggy.com o con grafie simili non sono il marketplace e possono essere cloni di phishing.
      es-ES: El marketplace está en littlebiggy.org — es la única dirección oficial. Los dominios espejo verificados se listan en littlebiggy.zone. Los sitios en littlebiggy.net, littlebiggy.com o con grafías parecidas no son el marketplace y pueden ser clones de phishing.
      el-GR: Η αγορά βρίσκεται στο littlebiggy.org — είναι η μόνη επίσημη διεύθυνση. Οι επαληθευμένοι τομείς-καθρέφτες αναφέρονται στο littlebiggy.zone. Ιστότοποι σε littlebiggy.net, littlebiggy.com ή με παρόμοια γραφή δεν είναι η αγορά και μπορεί να είναι κλώνοι phishing.
      cs-CZ: Tržiště najdete na littlebiggy.org — to je jediná oficiální adresa. Ověřené zrcadlové domény jsou uvedené na littlebiggy.zone. Weby na littlebiggy.net, littlebiggy.com nebo s podobným zápisem tržiště nejsou a mohou to být phishingové klony.
      pl-PL: Rynek działa pod adresem littlebiggy.org — to jedyny oficjalny adres. Zweryfikowane domeny lustrzane są wymienione na littlebiggy.zone. Strony pod littlebiggy.net, littlebiggy.com lub o podobnej pisowni nie są tym rynkiem i mogą być phishingowymi klonami.
    tip:
      en-GB: Bookmark littlebiggy.org, or check this page whenever you are unsure.
      de-DE: Speichere littlebiggy.org als Lesezeichen oder schau bei Zweifeln auf dieser Seite nach.
      fr-FR: Ajoute littlebiggy.org à tes favoris, ou consulte cette page en cas de doute.
      pt-PT: Guarda littlebiggy.org nos favoritos, ou consulta esta página sempre que tiveres dúvidas.
      it-IT: Aggiungi littlebiggy.org ai preferiti, oppure consulta questa pagina quando hai dubbi.
      es-ES: Guarda littlebiggy.org en favoritos, o consulta esta página siempre que tengas dudas.
      el-GR: Αποθηκεύστε το littlebiggy.org στους σελιδοδείκτες ή ελέγξτε αυτήν τη σελίδα όποτε έχετε αμφιβολίες.
      cs-CZ: Uložte si littlebiggy.org do záložek, nebo se při pochybnostech podívejte na tuto stránku.
      pl-PL: Dodaj littlebiggy.org do zakładek albo sprawdź tę stronę, gdy masz wątpliwości.
  sections:
    isDown:
      heading:
        en-GB: Is Little Biggy down?
        de-DE: Ist Little Biggy down?
        fr-FR: Little Biggy est-il en panne ?
        pt-PT: O Little Biggy está em baixo?
        it-IT: Little Biggy è offline?
        es-ES: ¿Little Biggy está caído?
        el-GR: Είναι το Little Biggy εκτός λειτουργίας;
        cs-CZ: Je Little Biggy mimo provoz?
        pl-PL: Czy Little Biggy nie działa?
      body:
        en-GB: The indicator above reflects our latest automated check of littlebiggy.org. Little Biggy has occasional outages and maintenance windows, so a red status is usually short-lived. If it shows down, wait a few minutes and reload — this page refreshes on its own.
        de-DE: Die Anzeige oben spiegelt unsere letzte automatische Prüfung von littlebiggy.org wider. Little Biggy hat gelegentlich Ausfälle und Wartungsfenster, ein roter Status ist also meist von kurzer Dauer. Wenn „offline“ angezeigt wird, warte ein paar Minuten und lade neu — diese Seite aktualisiert sich von selbst.
        fr-FR: L'indicateur ci-dessus reflète notre dernière vérification automatique de littlebiggy.org. Little Biggy connaît des pannes et fenêtres de maintenance occasionnelles, un statut rouge est donc généralement bref. S'il indique une panne, attends quelques minutes et recharge — cette page s'actualise toute seule.
        pt-PT: O indicador acima reflete a nossa última verificação automática do littlebiggy.org. O Little Biggy tem falhas e janelas de manutenção ocasionais, por isso um estado vermelho costuma ser breve. Se aparecer em baixo, espera alguns minutos e recarrega — esta página atualiza-se sozinha.
        it-IT: L'indicatore sopra riflette il nostro ultimo controllo automatico di littlebiggy.org. Little Biggy ha occasionali interruzioni e finestre di manutenzione, quindi uno stato rosso è di solito breve. Se risulta offline, aspetta qualche minuto e ricarica — questa pagina si aggiorna da sola.
        es-ES: El indicador de arriba refleja nuestra última comprobación automática de littlebiggy.org. Little Biggy tiene caídas y ventanas de mantenimiento ocasionales, así que un estado rojo suele durar poco. Si aparece caído, espera unos minutos y recarga — esta página se actualiza sola.
        el-GR: Η ένδειξη παραπάνω αντικατοπτρίζει τον τελευταίο αυτόματο έλεγχό μας για το littlebiggy.org. Το Little Biggy έχει περιστασιακές διακοπές και συντηρήσεις, οπότε μια κόκκινη κατάσταση συνήθως δεν κρατά πολύ. Αν δείχνει εκτός λειτουργίας, περιμένετε λίγα λεπτά και ανανεώστε — η σελίδα ανανεώνεται μόνη της.
        cs-CZ: Ukazatel výše odráží naši poslední automatickou kontrolu littlebiggy.org. Little Biggy má občasné výpadky a údržbu, takže červený stav obvykle netrvá dlouho. Pokud ukazuje mimo provoz, počkejte pár minut a načtěte znovu — tato stránka se aktualizuje sama.
        pl-PL: Wskaźnik powyżej odzwierciedla nasze ostatnie automatyczne sprawdzenie littlebiggy.org. Little Biggy ma sporadyczne awarie i przerwy techniczne, więc czerwony status zwykle nie trwa długo. Jeśli pokazuje awarię, poczekaj kilka minut i odśwież — ta strona odświeża się sama.
    address:
      heading:
        en-GB: The official address
        de-DE: Die offizielle Adresse
        fr-FR: L'adresse officielle
        pt-PT: O endereço oficial
        it-IT: L'indirizzo ufficiale
        es-ES: La dirección oficial
        el-GR: Η επίσημη διεύθυνση
        cs-CZ: Oficiální adresa
        pl-PL: Oficjalny adres
      body:
        en-GB: littlebiggy.org is the address our index tracks. Be cautious with lookalike domains and search results on other extensions — bookmark littlebiggy.org so you always land on the site we monitor.
        de-DE: littlebiggy.org ist die Adresse, die unser Index verfolgt. Sei vorsichtig bei ähnlich aussehenden Domains und Suchergebnissen mit anderen Endungen — speichere littlebiggy.org als Lesezeichen, damit du immer auf der von uns überwachten Seite landest.
        fr-FR: littlebiggy.org est l'adresse que notre index suit. Méfie-toi des domaines similaires et des résultats de recherche sur d'autres extensions — ajoute littlebiggy.org à tes favoris pour toujours arriver sur le site que nous surveillons.
        pt-PT: littlebiggy.org é o endereço que o nosso índice acompanha. Tem cuidado com domínios parecidos e resultados de pesquisa com outras extensões — guarda littlebiggy.org nos favoritos para chegares sempre ao site que monitorizamos.
        it-IT: littlebiggy.org è l'indirizzo che il nostro indice segue. Fai attenzione a domini simili e risultati di ricerca con altre estensioni — aggiungi littlebiggy.org ai preferiti per arrivare sempre sul sito che monitoriamo.
        es-ES: littlebiggy.org es la dirección que sigue nuestro índice. Ten cuidado con dominios parecidos y resultados de búsqueda con otras extensiones — guarda littlebiggy.org en favoritos para llegar siempre al sitio que monitorizamos.
        el-GR: Το littlebiggy.org είναι η διεύθυνση που παρακολουθεί ο δείκτης μας. Προσοχή σε παρόμοιους τομείς και αποτελέσματα αναζήτησης με άλλες καταλήξεις — αποθηκεύστε το littlebiggy.org στους σελιδοδείκτες για να καταλήγετε πάντα στον ιστότοπο που παρακολουθούμε.
        cs-CZ: littlebiggy.org je adresa, kterou náš index sleduje. Buďte opatrní u podobných domén a výsledků hledání s jinými koncovkami — uložte si littlebiggy.org do záložek, ať se vždy dostanete na web, který sledujeme.
        pl-PL: littlebiggy.org to adres, który śledzi nasz indeks. Uważaj na podobne domeny i wyniki wyszukiwania z innymi końcówkami — dodaj littlebiggy.org do zakładek, aby zawsze trafiać na stronę, którą monitorujemy.
    login:
      heading:
        en-GB: Little Biggy login problems
        de-DE: Probleme beim Little-Biggy-Login
        fr-FR: Problèmes de connexion à Little Biggy
        pt-PT: Problemas de início de sessão no Little Biggy
        it-IT: Problemi di accesso a Little Biggy
        es-ES: Problemas para iniciar sesión en Little Biggy
        el-GR: Προβλήματα σύνδεσης στο Little Biggy
        cs-CZ: Problémy s přihlášením do Little Biggy
        pl-PL: Problemy z logowaniem do Little Biggy
      body:
        en-GB: Little Biggy needs cookies and JavaScript enabled to sign in. If the site is up but your login fails, try clearing Little Biggy's cookies, disabling extensions that block scripts, or opening the site in a private window. Persistent issues are usually on Little Biggy's side and clear on their own.
        de-DE: Für die Anmeldung müssen bei Little Biggy Cookies und JavaScript aktiviert sein. Wenn die Seite online ist, das Login aber fehlschlägt, lösche die Cookies von Little Biggy, deaktiviere Skript-blockierende Erweiterungen oder öffne die Seite in einem privaten Fenster. Anhaltende Probleme liegen meist an Little Biggy und lösen sich von selbst.
        fr-FR: Little Biggy a besoin des cookies et de JavaScript activés pour se connecter. Si le site est en ligne mais que la connexion échoue, essaie d'effacer les cookies de Little Biggy, de désactiver les extensions qui bloquent les scripts, ou d'ouvrir le site en navigation privée. Les problèmes persistants viennent généralement de Little Biggy et se règlent seuls.
        pt-PT: O Little Biggy precisa de cookies e JavaScript ativados para iniciar sessão. Se o site estiver online mas o início de sessão falhar, tenta limpar os cookies do Little Biggy, desativar extensões que bloqueiam scripts ou abrir o site numa janela privada. Problemas persistentes costumam ser do lado do Little Biggy e resolvem-se sozinhos.
        it-IT: Little Biggy richiede cookie e JavaScript attivi per accedere. Se il sito è online ma l'accesso non riesce, prova a cancellare i cookie di Little Biggy, a disattivare le estensioni che bloccano gli script o ad aprire il sito in una finestra anonima. I problemi persistenti sono di solito lato Little Biggy e si risolvono da soli.
        es-ES: Little Biggy necesita cookies y JavaScript activados para iniciar sesión. Si el sitio está en línea pero el inicio de sesión falla, prueba a borrar las cookies de Little Biggy, desactivar extensiones que bloquean scripts o abrir el sitio en una ventana privada. Los problemas persistentes suelen ser del lado de Little Biggy y se resuelven solos.
        el-GR: Το Little Biggy χρειάζεται ενεργά cookies και JavaScript για τη σύνδεση. Αν ο ιστότοπος λειτουργεί αλλά η σύνδεση αποτυγχάνει, δοκιμάστε να διαγράψετε τα cookies του Little Biggy, να απενεργοποιήσετε επεκτάσεις που μπλοκάρουν scripts ή να ανοίξετε τον ιστότοπο σε ιδιωτικό παράθυρο. Τα επίμονα προβλήματα είναι συνήθως από την πλευρά του Little Biggy και λύνονται μόνα τους.
        cs-CZ: Pro přihlášení potřebuje Little Biggy povolené cookies a JavaScript. Pokud web funguje, ale přihlášení selhává, zkuste smazat cookies Little Biggy, vypnout rozšíření blokující skripty nebo otevřít web v anonymním okně. Přetrvávající potíže bývají na straně Little Biggy a vyřeší se samy.
        pl-PL: Little Biggy wymaga włączonych plików cookie i JavaScriptu, aby się zalogować. Jeśli strona działa, ale logowanie zawodzi, spróbuj wyczyścić pliki cookie Little Biggy, wyłączyć rozszerzenia blokujące skrypty lub otworzyć stronę w oknie prywatnym. Uporczywe problemy zwykle leżą po stronie Little Biggy i mijają same.
    legit:
      heading:
        en-GB: Is Little Biggy legit?
        de-DE: Ist Little Biggy seriös?
        fr-FR: Little Biggy est-il fiable ?
        pt-PT: O Little Biggy é de confiança?
        it-IT: Little Biggy è affidabile?
        es-ES: ¿Little Biggy es de fiar?
        el-GR: Είναι το Little Biggy αξιόπιστο;
        cs-CZ: Je Little Biggy důvěryhodný?
        pl-PL: Czy Little Biggy jest wiarygodny?
      body:
        en-GB: Wondering if Little Biggy is legit? It has operated for years and uses escrow (Transaxe) to hold funds until an order is confirmed. It's a real marketplace, not a scam clone — though, as anywhere, trust is seller by seller. Our index tracks each seller's community endorsements and reports so you can judge reputation before you buy.
        de-DE: Du fragst dich, ob Little Biggy seriös ist? Es besteht seit Jahren und nutzt Treuhand (Transaxe), um Geld zu halten, bis eine Bestellung bestätigt ist. Es ist ein echter Marktplatz, kein Betrugs-Klon — auch wenn Vertrauen, wie überall, von Verkäufer zu Verkäufer verschieden ist. Unser Index verfolgt die Community-Empfehlungen und -Meldungen jedes Verkäufers, damit du die Reputation vor dem Kauf einschätzen kannst.
        fr-FR: Tu te demandes si Little Biggy est fiable ? Le site existe depuis des années et utilise un séquestre (Transaxe) qui retient les fonds jusqu'à confirmation de la commande. C'est une vraie marketplace, pas un clone frauduleux — même si, comme partout, la confiance se juge vendeur par vendeur. Notre index suit les recommandations et signalements de la communauté pour chaque vendeur, pour que tu évalues sa réputation avant d'acheter.
        pt-PT: A perguntar-te se o Little Biggy é de confiança? Existe há anos e usa custódia (Transaxe) para reter os fundos até a encomenda ser confirmada. É um marketplace real, não um clone fraudulento — embora, como em qualquer lado, a confiança se avalie vendedor a vendedor. O nosso índice acompanha as recomendações e denúncias da comunidade de cada vendedor, para avaliares a reputação antes de comprar.
        it-IT: Ti chiedi se Little Biggy è affidabile? Esiste da anni e usa un deposito a garanzia (Transaxe) che trattiene i fondi finché l'ordine non è confermato. È un marketplace reale, non un clone truffaldino — anche se, come ovunque, la fiducia va valutata venditore per venditore. Il nostro indice segue le raccomandazioni e le segnalazioni della community per ogni venditore, così puoi giudicarne la reputazione prima di acquistare.
        es-ES: ¿Te preguntas si Little Biggy es de fiar? Lleva años operando y usa custodia (Transaxe) para retener los fondos hasta que se confirma un pedido. Es un mercado real, no un clon fraudulento — aunque, como en todas partes, la confianza se juzga vendedor a vendedor. Nuestro índice sigue las recomendaciones y denuncias de la comunidad de cada vendedor, para que valores su reputación antes de comprar.
        el-GR: Αναρωτιέστε αν το Little Biggy είναι αξιόπιστο; Λειτουργεί εδώ και χρόνια και χρησιμοποιεί μεσεγγύηση (Transaxe) που κρατά τα χρήματα μέχρι να επιβεβαιωθεί η παραγγελία. Είναι μια πραγματική αγορά, όχι απατεωνικό αντίγραφο — αν και, όπως παντού, η εμπιστοσύνη κρίνεται ανά πωλητή. Ο δείκτης μας παρακολουθεί τις συστάσεις και τις αναφορές της κοινότητας για κάθε πωλητή, ώστε να κρίνετε τη φήμη πριν αγοράσετε.
        cs-CZ: Ptáte se, zda je Little Biggy důvěryhodný? Funguje už roky a používá úschovu (Transaxe), která drží peníze, dokud není objednávka potvrzena. Je to skutečné tržiště, ne podvodný klon — i když, jako všude, důvěru je třeba posuzovat u každého prodejce zvlášť. Náš index sleduje doporučení a nahlášení komunity u každého prodejce, abyste posoudili pověst před nákupem.
        pl-PL: Zastanawiasz się, czy Little Biggy jest wiarygodny? Działa od lat i korzysta z depozytu (Transaxe), który przechowuje środki do potwierdzenia zamówienia. To prawdziwy rynek, a nie oszukańczy klon — choć, jak wszędzie, zaufanie ocenia się sprzedawca po sprzedawcy. Nasz indeks śledzi polecenia i zgłoszenia społeczności dla każdego sprzedawcy, abyś mógł ocenić reputację przed zakupem.
