      cs-CZ: Přeskočit nápovědu
      pl-PL: Pomiń poradniki pomocy
    skipGuidesDesc:
      en-GB: Hide the quick tips shown before opening Little Biggy. Switch off to see them again.
      de-DE: Tipps ausblenden, die vor dem Öffnen von Little Biggy angezeigt werden. Ausschalten, um sie wieder zu sehen.
      fr-FR: Masquer les conseils rapides affichés avant d'ouvrir Little Biggy. Désactiver pour les afficher à nouveau.
      pt-PT: Ocultar as dicas rápidas antes de abrir o Little Biggy. Desativa para vê-las novamente.
      it-IT: Nascondi i consigli rapidi mostrati prima di aprire Little Biggy. Disattiva per rivederli.
      es-ES: Oculta los consejos rápidos que se muestran antes de abrir Little Biggy. Desactívalo para volver a verlos.
      el-GR: Απόκρυψη των γρήγορων συμβουλών πριν ανοίξει το Little Biggy. Απενεργοποιήστε για να τις δείτε ξανά.
      cs-CZ: Skrýt rychlé tipy zobrazené před otevřením Little Biggy. Vypnutím je znovu zobrazíte.
      pl-PL: Ukryj szybkie wskazówki pokazywane przed otwarciem Little Biggy. Wyłącz, aby zobaczyć je ponownie.
