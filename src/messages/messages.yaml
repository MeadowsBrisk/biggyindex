      text:
        en-GB: Once your country is set, each product shows a buy button next to every variant. Tap one and it goes straight to your cart.
        en-IE: Once your country is set, each product shows a buy button next to every variant. Tap one and it goes straight to your cart.
        de-DE: Sobald dein Land eingestellt ist, zeigt jedes Produkt einen Kaufen-Button neben jeder Variante. Tippe darauf und es landet direkt im Warenkorb.
        fr-FR: Une fois ton pays défini, chaque produit affiche un bouton d'achat à côté de chaque variante. Appuie dessus et il va directement dans ton panier.
        pt-PT: Depois de definir o seu país, cada produto mostra um botão de compra junto a cada variante. Toque nele e vai diretamente para o seu carrinho.
        it-IT: Una volta impostato il tuo paese, ogni prodotto mostra un pulsante di acquisto accanto a ogni variante. Toccalo e va direttamente nel tuo carrello.
        es-ES: Una vez configurado tu país, cada producto muestra un botón de compra junto a cada variante. Tócalo y va directamente a tu carrito.
        el-GR: Μόλις οριστεί η χώρα σας, κάθε προϊόν εμφανίζει ένα κουμπί αγοράς δίπλα σε κάθε παραλλαγή. Πατήστε ένα και πηγαίνει κατευθείαν στο καλάθι σας.
        cs-CZ: Jakmile je vaše země nastavena, každý produkt zobrazí tlačítko nákupu vedle každé varianty. Klepněte na něj a položka jde přímo do košíku.
        pl-PL: Gdy Twój kraj jest ustawiony, każdy produkt wyświetla przycisk kup obok każdego wariantu. Stuknij jeden i trafia prosto do twojego koszyka.
    account:
      title:
        en-GB: 3. Create an account
        en-IE: 3. Create an account
        de-DE: 3. Konto erstellen
        fr-FR: 3. Créer un compte
        pt-PT: 3. Criar uma conta
        it-IT: 3. Crea un account
        es-ES: 3. Crear una cuenta
        el-GR: 3. Δημιουργήστε λογαριασμό
        cs-CZ: 3. Vytvořte si účet
        pl-PL: 3. Załóż konto
      text:
        en-GB: "You can check out without an account, but signing up is recommended. Just click \"Login\" then \"Register\" — no email needed, just a username and password."
        en-IE: "You can check out without an account, but signing up is recommended. Just click \"Login\" then \"Register\" — no email needed, just a username and password."
        de-DE: "Du kannst ohne Konto bezahlen, aber eine Registrierung wird empfohlen. Klicke einfach auf \"Login\" und dann \"Register\" — keine E-Mail nötig, nur Benutzername und Passwort."
        fr-FR: "Tu peux payer sans compte, mais l'inscription est recommandée. Clique sur \"Login\" puis \"Register\" — pas besoin d'e-mail, juste un nom d'utilisateur et un mot de passe."
        pt-PT: "Pode pagar sem conta, mas registar-se é recomendado. Clique em \"Login\" e depois \"Register\" — não precisa de e-mail, apenas nome de utilizador e palavra-passe."
        it-IT: "Puoi pagare senza account, ma registrarsi è consigliato. Clicca su \"Login\" poi \"Register\" — non serve un'e-mail, solo nome utente e password."
        es-ES: "Puedes pagar sin cuenta, pero registrarte es recomendable. Haz clic en \"Login\" y luego en \"Register\" — no necesitas e-mail, solo nombre de usuario y contraseña."
        el-GR: "Μπορείτε να κάνετε checkout χωρίς λογαριασμό, αλλά συνιστάται η εγγραφή. Απλώς κάντε κλικ στο \"Login\" και μετά στο \"Register\" — δεν χρειάζεται email, μόνο όνομα χρήστη και κωδικός."
        cs-CZ: "Můžete dokončit nákup bez účtu, ale registrace se doporučuje. Stačí kliknout na \"Login\" a potom \"Register\" — není potřeba e-mail, jen uživatelské jméno a heslo."
        pl-PL: Możesz wypłacić bez konta, ale zaleca się rejestrację. Wystarczy kliknąć "Zaloguj się", a potem "Zarejestruj się" — nie potrzeba e-maila, wystarczy nazwa użytkownika i hasło.
    checkout:
      title:
        en-GB: 4. Pay with Bitcoin
        en-IE: 4. Pay with Bitcoin
        de-DE: 4. Mit Bitcoin bezahlen
        fr-FR: 4. Payer en Bitcoin
        pt-PT: 4. Pagar com Bitcoin
        it-IT: 4. Paga con Bitcoin
        es-ES: 4. Pagar con Bitcoin
        el-GR: 4. Πληρώστε με Bitcoin
        cs-CZ: 4. Zaplaťte Bitcoinem
        pl-PL: 4. Płać Bitcoinem
      text:
        en-GB: Little Biggy accepts Bitcoin only. At checkout you'll see an amount and a wallet address to send payment to.
        en-IE: Little Biggy accepts Bitcoin only. At checkout you'll see an amount and a wallet address to send payment to.
        de-DE: Little Biggy akzeptiert nur Bitcoin. Beim Checkout siehst du einen Betrag und eine Wallet-Adresse für die Zahlung.
        fr-FR: Little Biggy n'accepte que le Bitcoin. Au moment du paiement, tu verras un montant et une adresse de portefeuille.
        pt-PT: O Little Biggy aceita apenas Bitcoin. No checkout verá um montante e um endereço de carteira para enviar o pagamento.
        it-IT: Little Biggy accetta solo Bitcoin. Al checkout vedrai un importo e un indirizzo wallet per inviare il pagamento.
        es-ES: Little Biggy solo acepta Bitcoin. En el checkout verás un monto y una dirección de billetera para enviar el pago.
        el-GR: Το Little Biggy δέχεται μόνο Bitcoin. Στο checkout θα δείτε ένα ποσό και μια διεύθυνση πορτοφολιού για να στείλετε την πληρωμή.
        cs-CZ: Little Biggy přijímá pouze Bitcoin. Při placení uvidíte částku a adresu peněženky, kam poslat platbu.
        pl-PL: Little Biggy akceptuje wyłącznie Bitcoina. Przy kacie zobaczysz kwotę i adres portfela, na który chcesz wysłać płatność.
