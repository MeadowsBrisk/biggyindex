    caption:
      en-GB: "Median asking price at each standard size, from the listings that offer that exact weight. A size is quoted only where at least three listings sell it."
      de-DE: "Median-Angebotspreis für jede Standardmenge, aus den Angeboten mit genau diesem Gewicht. Eine Menge wird nur angezeigt, wenn sie mindestens drei Angebote verkaufen."
      fr-FR: "Prix demandé médian pour chaque quantité standard, calculé sur les annonces proposant exactement ce poids. Une quantité n'est affichée que si au moins trois annonces la vendent."
      pt-PT: "Preço pedido mediano em cada tamanho padrão, a partir dos anúncios que oferecem exatamente esse peso. Um tamanho só é indicado quando pelo menos três anúncios o vendem."
      it-IT: "Prezzo richiesto mediano per ogni taglio standard, calcolato sugli annunci che offrono esattamente quel peso. Una quantità è indicata solo se almeno tre annunci la vendono."
      es-ES: "Precio pedido mediano en cada cantidad estándar, a partir de los anuncios que ofrecen exactamente ese peso. Una cantidad solo se muestra cuando al menos tres anuncios la venden."
      el-GR: "Διάμεση ζητούμενη τιμή για κάθε τυπική ποσότητα, από τις καταχωρίσεις που προσφέρουν ακριβώς αυτό το βάρος. Μια ποσότητα εμφανίζεται μόνο όταν την πωλούν τουλάχιστον τρεις καταχωρίσεις."
      cs-CZ: "Medián požadované ceny u každé standardní velikosti, spočítaný z nabídek, které přesně tuto váhu nabízejí. Velikost se uvádí jen tam, kde ji prodávají alespoň tři nabídky."
      pl-PL: "Mediana ceny ofertowej dla każdego standardowego rozmiaru, obliczona z ofert zawierających dokładnie tę wagę. Rozmiar pokazujemy tylko wtedy, gdy sprzedają go co najmniej trzy oferty."
