      en-GB: Use English UI copy and original product names/descriptions where available.
      de-DE: Englischen UI-Text und originale Produktnamen/-beschreibungen verwenden, wenn verfügbar.
      fr-FR: Utiliser le texte anglais et les noms/descriptions d’origine des produits lorsque disponibles.
      pt-PT: Utiliza o texto em inglês e os nomes/descrições originais dos produtos, quando disponíveis.
