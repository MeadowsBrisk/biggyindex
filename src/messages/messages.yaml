      de-DE: "Wie BiggyIndex mit Daten umgeht — keine Konten, keine Analytics, kein Tracking und nur funktionale Cookies."
      fr-FR: "Comment BiggyIndex traite les données — pas de comptes, pas d’analytics, pas de traçage, et uniquement des cookies fonctionnels."
      pt-PT: "Como o BiggyIndex trata os dados — sem contas, sem analytics, sem rastreamento e apenas cookies funcionais."
      it-IT: "Come BiggyIndex gestisce i dati — nessun account, nessuna analisi, nessun tracciamento e solo cookie funzionali."
      es-ES: "Cómo maneja los datos BiggyIndex: sin cuentas, sin analíticas, sin rastreo y solo cookies funcionales."
      el-GR: "Πώς διαχειρίζεται τα δεδομένα το BiggyIndex — χωρίς λογαριασμούς, χωρίς analytics, χωρίς παρακολούθηση και μόνο λειτουργικά cookies."
      cs-CZ: "Jak BiggyIndex nakládá s daty — žádné účty, žádná analytika, žádné sledování a pouze funkční cookies."
      pl-PL: "Jak BiggyIndex obchodzi się z danymi — bez kont, bez statystyk, bez śledzenia i tylko funkcjonalne pliki cookie."
