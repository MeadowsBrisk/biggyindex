  # Rendered when a market has no gram-priced listings yet.
  empty:
    en-GB: "No gram-priced listings are indexed for this market yet. Check back soon — figures appear as soon as the index picks them up."
    de-DE: "Für diesen Markt sind noch keine Angebote mit Grammpreis indexiert. Schauen Sie bald wieder vorbei — die Zahlen erscheinen, sobald der Index sie erfasst."
    fr-FR: "Aucune annonce vendue au gramme n'est encore indexée pour ce marché. Revenez bientôt — les chiffres apparaissent dès que l'index les détecte."
    pt-PT: "Ainda não há anúncios com preço por grama indexados para este mercado. Volte em breve — os valores aparecem assim que o índice os detetar."
    it-IT: "Per questo mercato non ci sono ancora annunci con prezzo al grammo indicizzati. Torna presto — le cifre compaiono appena l'indice le rileva."
    es-ES: "Todavía no hay anuncios con precio por gramo indexados para este mercado. Vuelve pronto — las cifras aparecen en cuanto el índice las detecta."
    el-GR: "Δεν έχουν ευρετηριαστεί ακόμη καταχωρίσεις με τιμή ανά γραμμάριο για αυτήν την αγορά. Επιστρέψτε σύντομα — τα στοιχεία εμφανίζονται μόλις τα εντοπίσει ο δείκτης."
    cs-CZ: "Pro tento trh zatím nejsou indexované žádné nabídky s cenou za gram. Vraťte se brzy — čísla se objeví, jakmile je index zachytí."
    pl-PL: "Dla tego rynku nie ma jeszcze zaindeksowanych ofert z ceną za gram. Zajrzyj wkrótce — dane pojawią się, gdy tylko indeks je wychwyci."
