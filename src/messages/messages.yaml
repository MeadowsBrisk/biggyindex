# Custom per-type 404 pages (app/[locale]/**/not-found.tsx). Distinct from the
# `errors.*` boundaries above: those recover from load FAILURES; these are the
# real "does not exist" pages for unknown item refs, seller ids and category
# slugs. Rendered by Server Components, so no client-namespace registration.
notFound:
  item:
    title:
      en-GB: This item isn't in the index
      de-DE: Dieser Artikel ist nicht im Index
      fr-FR: Cet article n'est pas dans l'index
      pt-PT: Este item não está no índice
      it-IT: Questo articolo non è nell'indice
      es-ES: Este artículo no está en el índice
      el-GR: Αυτό το προϊόν δεν βρίσκεται στο ευρετήριο
      cs-CZ: Tato položka není v indexu
      pl-PL: Tego przedmiotu nie ma w indeksie
    description:
      en-GB: It may never have been listed, or the listing has since been sold out, delisted, or removed. Try browsing the index instead.
      de-DE: Möglicherweise wurde er nie gelistet oder ist inzwischen ausverkauft, entfernt oder gelöscht worden. Durchstöbern Sie stattdessen den Index.
      fr-FR: Il n'a peut-être jamais été référencé, ou il a depuis été épuisé, retiré ou supprimé. Parcourez plutôt l'index.
      pt-PT: Pode nunca ter sido listado ou, entretanto, ter esgotado, sido retirado ou removido. Explore antes o índice.
      it-IT: Potrebbe non essere mai stato inserito oppure nel frattempo è esaurito, ritirato o rimosso. Prova invece a esplorare l'indice.
      es-ES: Puede que nunca se haya publicado o que se haya agotado, retirado o eliminado. Explora el índice en su lugar.
      el-GR: Ίσως να μην καταχωρήθηκε ποτέ, ή στο μεταξύ εξαντλήθηκε, αποσύρθηκε ή αφαιρέθηκε. Δοκιμάστε να περιηγηθείτε στο ευρετήριο.
      cs-CZ: Možná nikdy nebyla v nabídce, nebo byla mezitím vyprodána, stažena či odstraněna. Zkuste místo toho procházet index.
      pl-PL: Być może nigdy nie było wystawione albo zostało wyprzedane, wycofane lub usunięte. Zamiast tego przejrzyj indeks.
