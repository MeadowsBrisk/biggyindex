      escrow:
        title:
          en-GB: Your Funds Are Safe (Escrow)
          de-DE: Ihre Gelder sind sicher (Treuhand)
          fr-FR: Vos fonds sont en sécurité (séquestre)
          pt-PT: Os seus fundos estão seguros (escrow)
          it-IT: I tuoi fondi sono al sicuro (escrow)
          es-ES: Tus fondos están seguros (Depósito en garantía)
          el-GR: Τα χρήματά σας είναι ασφαλή (μεσεγγύηση)
          cs-CZ: Vaše prostředky jsou v bezpečí (escrow)
          pl-PL: Twoje środki są bezpieczne (escrow)
        summary:
          en-GB: Transaxe holds the money until your order arrives.
          de-DE: Transaxe hält das Geld, bis deine Bestellung eintrifft.
          fr-FR: Transaxe conserve l’argent jusqu’à l’arrivée de votre commande.
          pt-PT: A Transaxe mantém o dinheiro até a tua encomenda chegar.
          it-IT: Transaxe trattiene i soldi fino all'arrivo del tuo ordine.
          es-ES: Transaxe retiene el dinero hasta que llegue tu pedido.
          el-GR: Η Transaxe κρατά τα χρήματα μέχρι να φτάσει η παραγγελία σας.
          cs-CZ: Transaxe drží peníze, dokud vaše objednávka nedorazí.
          pl-PL: Transaxe przechowuje pieniądze do momentu przyjścia zamówienia.
        intro:
          en-GB: Your Bitcoin goes to Transaxe, Little Biggy's built-in escrow system. The seller can see the payment has arrived, but the funds are held securely.
          de-DE: Ihr Bitcoin geht an Transaxe, das integrierte Treuhandsystem Little Biggy. Der Verkäufer sieht, dass die Zahlung angekommen ist, aber die Gelder werden sicher aufbewahrt.
          fr-FR: Votre Bitcoin va à Transaxe, le système d’entiercement intégré de Little Biggy. Le vendeur peut voir que le paiement est arrivé, mais les fonds sont conservés en sécurité.
          pt-PT: O seu Bitcoin vai para a Transaxe, o sistema de custódia integrado da Little Biggy. O vendedor pode ver que o pagamento chegou, mas os fundos estão retidos de forma segura.
          it-IT: Il tuo Bitcoin va a Transaxe, il sistema di escrow integrato di Little Biggy. Il venditore può vedere che il pagamento è arrivato, ma i fondi sono trattenuti in sicurezza.
          es-ES: Tu Bitcoin va a Transaxe, el sistema de depósito en garantía integrado de Little Biggy. El vendedor puede ver que el pago ha llegado, pero los fondos están retenidos de forma segura.
          el-GR: Το Bitcoin σας πηγαίνει στο Transaxe, το ενσωματωμένο σύστημα μεσεγγύησης της Little Biggy. Ο πωλητής μπορεί να δει ότι η πληρωμή έχει φτάσει, αλλά τα χρήματα φυλάσσονται με ασφάλεια.
          cs-CZ: Váš Bitcoin jde do Transaxe, vestavěného systému úschovy Little Biggy. Prodávající vidí, že platba dorazila, ale prostředky jsou bezpečně uloženy.
          pl-PL: Twój Bitcoin trafia do Transaxe, wbudowanego systemu escrow Little Biggy. Sprzedawca widzi, że płatność dotarła, ale środki są bezpiecznie przechowywane.
        release:
          en-GB: The money is only released to the seller once the dispute window closes. This protects you as a buyer - if something goes wrong, you can open a dispute before the window ends.
          de-DE: Das Geld wird dem Verkäufer erst freigegeben, wenn das Streitfrist geschlossen ist. Das schützt Sie als Käufer – falls etwas schiefgeht, können Sie vor Ablauf des Zeitfensters einen Streitfall eröffnen.
          fr-FR: L’argent n’est libéré au vendeur qu’une fois la fenêtre de contestation terminée. Cela vous protège en tant qu’acheteur – si quelque chose tourne mal, vous pouvez ouvrir un litige avant la fin de la fenêtre.
          pt-PT: O dinheiro só é entregue ao vendedor quando a janela de disputa termina. Isto protege-o como comprador – se algo correr mal, pode abrir uma disputa antes do prazo terminar.
          it-IT: "Il denaro viene rilasciato al venditore solo quando la finestra di contestazione si chiude. Questo ti protegge come acquirente: se qualcosa va storto, puoi aprire una contestazione prima che la finestra finisca."
          es-ES: "El dinero solo se libera al vendedor una vez que se cierra la ventana de disputa. Esto te protege como comprador: si algo sale mal, puedes abrir una disputa antes de que termine la ventana."
          el-GR: Τα χρήματα αποδεσμεύονται στον πωλητή μόνο όταν κλείσει το παράθυρο διαφωνίας. Αυτό σας προστατεύει ως αγοραστή - εάν κάτι πάει στραβά, μπορείτε να ανοίξετε μια διαφωνία πριν λήξει το παράθυρο.
          cs-CZ: Peníze jsou prodávajícímu uvolněny až po uzavření okna pro spor. To vás chrání jako kupujícího – pokud se něco pokazí, můžete spor otevřít ještě před koncem tohoto období.
          pl-PL: Pieniądze trafiają do sprzedawcy dopiero po zamknięciu okna sporu. To chroni Cię jako kupującego – jeśli coś pójdzie nie tak, możesz otworzyć spór, zanim okno się zamknie.
        peaceHeading:
          en-GB: Peace of mind
          de-DE: Seelenfrieden
          fr-FR: Tranquillité d’esprit
          pt-PT: Tranquilidade
          it-IT: Tranquillità
          es-ES: Tranquilidad
          el-GR: Ξεγνοιασιά
          cs-CZ: Klid na duši
          pl-PL: Spokój ducha
        peaceText:
          en-GB: Escrow means the seller never touches your funds until the item is shipped and received. It is the safeguard that keeps Little Biggy honest.
          de-DE: Treuhandkonto bedeutet, dass der Verkäufer Ihre Gelder erst anrührt, wenn der Artikel verschickt und empfangen wurde. Es ist die Schutzmaßnahme, die Little Biggy ehrlich hält.
          fr-FR: L’entiercement signifie que le vendeur ne touche jamais à vos fonds tant que l’article n’est pas expédié et reçu. C’est la garantie qui maintient Little Biggy honnête.
          pt-PT: Escrow significa que o vendedor nunca toca nos seus fundos até que o artigo seja enviado e recebido. É a salvaguarda que mantém o Little Biggy honesto.
          it-IT: Il deposito a garanzia significa che il venditore non tocca mai i tuoi fondi finché l'articolo non viene spedito e ricevuto. È la garanzia che mantiene onesto Little Biggy.
          es-ES: El depósito en garantía significa que el vendedor nunca toca tus fondos hasta que el artículo sea enviado y recibido. Es la salvaguarda que mantiene honesto a Little Biggy.
          el-GR: Μεσεγγύηση σημαίνει ότι ο πωλητής δεν αγγίζει ποτέ τα χρήματά σας μέχρι να αποσταλεί και να παραληφθεί το αντικείμενο. Είναι η προστασία που κρατά το Little Biggy ειλικρινές.
          cs-CZ: Escrow znamená, že se prodejce nikdy nedotkne vašich prostředků, dokud není zboží odesláno a přijato. Je to pojistka, která udržuje Little Biggy poctivý.
          pl-PL: Escrow oznacza, że sprzedawca nie dotyka Twoich środków, dopóki przedmiot nie zostanie wysłany i odebrany. To zabezpieczenie, dzięki któremu Little Biggy pozostaje uczciwy.
      delivery:
        title:
          en-GB: Wait for the Postie
          de-DE: Warte auf den Postboten
          fr-FR: Attends le facteur
          pt-PT: Espera pelo Carteiro
          it-IT: Aspetta il postino
          es-ES: Espera al cartero
          el-GR: Περιμένετε τον ταχυδρόμο
          cs-CZ: Počkej na pošťáka
          pl-PL: Czekaj na listonosza
        summary:
          en-GB: Relax while it makes its way to you.
          de-DE: Entspann dich, während es zu dir kommt.
          fr-FR: Détendez-vous pendant qu’il vient vers vous.
          pt-PT: Relaxa enquanto ela chega até ti.
          it-IT: Rilassati mentre arriva verso di te.
          es-ES: Relájate mientras llega hasta ti.
          el-GR: Χαλαρώστε ενώ φτάνει προς εσάς.
          cs-CZ: Uvolněte se, zatímco se k vám dostane.
          pl-PL: Zrelaksuj się, gdy to do ciebie dotrze.
        intro:
          en-GB: Sellers typically mark your order as shipped within one business day. Delivery times depend on the seller and your location, but most UK orders arrive within a few days.
          en-IE: Sellers typically mark your order as shipped within one business day. Delivery times depend on the seller and your location, but most orders arrive within a few days.
          de-DE: Verkäufer markieren Ihre Bestellung in der Regel innerhalb eines Werktages als versandt. Die Lieferzeiten hängen vom Verkäufer und Ihrem Standort ab, aber die meisten Bestellungen kommen innerhalb weniger Tage an.
          fr-FR: Les vendeurs marquent généralement votre commande comme expédiée dans un jour ouvrable. Les délais de livraison dépendent du vendeur et de votre localisation, mais la plupart des commandes arrivent en quelques jours.
          pt-PT: Os vendedores normalmente marcam a sua encomenda como enviada dentro de um dia útil. Os prazos de entrega dependem do vendedor e da sua localização, mas a maioria das encomendas chega em poucos dias.
          it-IT: I venditori di solito segnano il tuo ordine come spedito entro un giorno lavorativo. I tempi di consegna dipendono dal venditore e dalla tua posizione, ma la maggior parte degli ordini arriva entro pochi giorni.
          es-ES: Los vendedores suelen marcar tu pedido como enviado en un día laborable. Los tiempos de entrega dependen del vendedor y de tu ubicación, pero la mayoría de los pedidos llegan en pocos días.
          el-GR: Οι πωλητές συνήθως επισημαίνουν την παραγγελία σας ως αποστολή εντός μίας εργάσιμης ημέρας. Οι χρόνοι παράδοσης εξαρτώνται από τον πωλητή και την τοποθεσία σας, αλλά οι περισσότερες παραγγελίες φτάνουν εντός λίγων ημερών.
          cs-CZ: Prodejci obvykle označí vaši objednávku jako odeslánou do jednoho pracovního dne. Doba doručení závisí na prodejci a vaší lokalitě, ale většina objednávek dorazí během několika dnů.
          en-NL: Sellers typically mark your order as shipped within one business day. Delivery times depend on the seller and your location, but most orders arrive within a few days.
          pl-PL: Sprzedawcy zazwyczaj oznaczają zamówienie jako wysłane w ciągu jednego dnia roboczego. Czas dostawy zależy od sprzedawcy i lokalizacji, ale większość zamówień dociera w ciągu kilku dni.
        late:
          en-GB: If your order is late, contact the seller through Little Biggy first - most issues get resolved quickly. Only open a dispute as a last resort.
          de-DE: Wenn deine Bestellung verspätet ist, kontaktiere zuerst den Verkäufer über Little Biggy – die meisten Probleme werden schnell gelöst. Eröffne einen Streitfall nur als letztes Mittel.
          fr-FR: Si votre commande est en retard, contactez d’abord le vendeur via Little Biggy - la plupart des problèmes se résolvent rapidement. Ouvrez un litige uniquement en dernier recours.
          pt-PT: Se a sua encomenda estiver atrasada, contacte primeiro o vendedor através Little Biggy – a maioria dos problemas resolve-se rapidamente. Só abra uma disputa como último recurso.
          it-IT: Se il tuo ordine è in ritardo, contatta prima il venditore tramite Little Biggy - la maggior parte dei problemi si risolve rapidamente. Apri una contestazione solo come ultima risorsa.
          es-ES: Si tu pedido llega tarde, contacta primero con el vendedor a través de Little Biggy; la mayoría de los problemas se resuelven rápido. Solo abre una disputa como último recurso.
          el-GR: Εάν η παραγγελία σας καθυστερήσει, επικοινωνήστε πρώτα με τον πωλητή μέσω Little Biggy - τα περισσότερα ζητήματα επιλύονται γρήγορα. Ανοίξτε μια διαφωνία μόνο ως έσχατη λύση.
          cs-CZ: Pokud je vaše objednávka opožděná, nejdříve kontaktujte prodejce přes Little Biggy – většina problémů se rychle vyřeší. Spor otevírejte jen jako poslední možnost.
          pl-PL: Jeśli zamówienie jest spóźnione, najpierw skontaktuj się ze sprzedawcą przez Little Biggy – większość problemów szybko się rozwiązuje. Spór otwieraj tylko jako ostateczność.
