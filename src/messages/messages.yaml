# "Ordering from Ireland" — the IE edition's market fact panel, rendered on
# the home page and on /about. It is gated on market === "IE", so no other
# locale ever reaches these keys and en-GB copy is the whole story. Every
# number is supplied by the page from the live Irish catalogue.
ireland:
  ordering:
    eyebrow: Shipping to Ireland
    heading: Ordering from Ireland
    intro: Every listing on this edition is one a seller will post to an Irish address. The figures below are read straight off that catalogue each time it refreshes.
    sellers:
      label: "{count, plural, one {seller ships to Ireland} other {sellers ship to Ireland}}"
      meta: "{listings, plural, one {# listing indexed for Ireland} other {# listings indexed for Ireland}}"
    shipping:
      label: typical postage to Ireland
      meta: "Median seller postage, across the {withShipping} of {listings} listings that publish a price."
    delivery:
      label: typical time to arrive
      value: "{days, plural, one {# day} other {# days}}"
      meta: "Median of the arrival times reported for {sellers, plural, one {# seller} other {# sellers}} shipping here."
    note: Postage is set per order by the seller and can change with what you buy, so the shipping options on the listing itself are the ones that apply at checkout.

about:
  metadataTitle:
    en-GB: "About BiggyIndex — How the Index Works | BiggyIndex"
    en-IE: "About BiggyIndex Ireland — How the Index Works | BiggyIndex"
    de-DE: "Über BiggyIndex — So funktioniert der Index | BiggyIndex"
    fr-FR: "À propos de BiggyIndex — comment fonctionne l'index | BiggyIndex"
    pt-PT: "Sobre o BiggyIndex — como funciona o índice | BiggyIndex"
    it-IT: "Informazioni su BiggyIndex — come funziona l'indice | BiggyIndex"
    es-ES: "Acerca de BiggyIndex — cómo funciona el índice | BiggyIndex"
    el-GR: "Σχετικά με το BiggyIndex — Πώς λειτουργεί το ευρετήριο | BiggyIndex"
    cs-CZ: "O BiggyIndexu — jak index funguje | BiggyIndex"
    pl-PL: "O BiggyIndex — jak działa indeks | BiggyIndex"
  metadataDescription:
    en-GB: "How BiggyIndex works: an independent, read-only index of public Little Biggy listings, refreshed roughly every 30 minutes, with price history, review stats and moderated seller feedback."
    en-IE: "How BiggyIndex Ireland works: an independent, read-only index of the public Little Biggy listings that ship to Ireland, refreshed roughly every 30 minutes, with price history, review stats and moderated seller feedback."
    de-DE: "Wie BiggyIndex funktioniert: ein unabhängiger, rein lesender Index öffentlicher Little Biggy Angebote, der etwa alle 30 Minuten aktualisiert wird – mit Preisverlauf, Bewertungsstatistiken und moderiertem Verkäufer-Feedback."
    fr-FR: "Comment fonctionne BiggyIndex : un index indépendant, en lecture seule, des annonces publiques Little Biggy, actualisé environ toutes les 30 minutes, avec historique des prix, statistiques d'avis et retours modérés sur les vendeurs."
    pt-PT: "Como funciona o BiggyIndex: um índice independente e só de leitura das listagens públicas do Little Biggy, atualizado cerca de cada 30 minutos, com histórico de preços, estatísticas de avaliações e feedback moderado sobre vendedores."
    it-IT: "Come funziona BiggyIndex: un indice indipendente e di sola lettura degli annunci pubblici di Little Biggy, aggiornato all'incirca ogni 30 minuti, con storico dei prezzi, statistiche delle recensioni e feedback moderato sui venditori."
    es-ES: "Cómo funciona BiggyIndex: un índice independiente y de solo lectura de los anuncios públicos de Little Biggy, actualizado aproximadamente cada 30 minutos, con historial de precios, estadísticas de reseñas y opiniones moderadas sobre vendedores."
    el-GR: "Πώς λειτουργεί το BiggyIndex: ένα ανεξάρτητο ευρετήριο μόνο για ανάγνωση των δημόσιων καταχωρίσεων του Little Biggy, που ανανεώνεται περίπου κάθε 30 λεπτά, με ιστορικό τιμών, στατιστικά κριτικών και ελεγμένα σχόλια για πωλητές."
    cs-CZ: "Jak BiggyIndex funguje: nezávislý index veřejných nabídek Little Biggy určený pouze ke čtení, aktualizovaný zhruba každých 30 minut, s historií cen, statistikami recenzí a moderovanou zpětnou vazbou k prodejcům."
    pl-PL: "Jak działa BiggyIndex: niezależny, tylko do odczytu indeks publicznych ofert Little Biggy, odświeżany mniej więcej co 30 minut, z historią cen, statystykami recenzji i moderowanymi opiniami o sprzedawcach."
  title:
    en-GB: "About BiggyIndex"
    en-IE: "About BiggyIndex Ireland"
    de-DE: "Über BiggyIndex"
    fr-FR: "À propos de BiggyIndex"
    pt-PT: "Sobre o BiggyIndex"
    it-IT: "Informazioni su BiggyIndex"
    es-ES: "Acerca de BiggyIndex"
    el-GR: "Σχετικά με το BiggyIndex"
    cs-CZ: "O BiggyIndexu"
    pl-PL: "O BiggyIndex"
  updated:
    en-GB: "Last updated July 2026"
    de-DE: "Zuletzt aktualisiert im Juli 2026"
    fr-FR: "Dernière mise à jour : juillet 2026"
    pt-PT: "Última atualização: julho de 2026"
    it-IT: "Ultimo aggiornamento: luglio 2026"
    es-ES: "Última actualización: julio de 2026"
    el-GR: "Τελευταία ενημέρωση: Ιούλιος 2026"
    cs-CZ: "Naposledy aktualizováno v červenci 2026"
    pl-PL: "Ostatnia aktualizacja: lipiec 2026"
  intro:
    en-GB: "BiggyIndex is an independent, read-only index of publicly listed Little Biggy offerings. This page explains what the site is, where its data comes from, and how the numbers you see are put together — so you can judge for yourself how far to trust them."
    de-DE: "BiggyIndex ist ein unabhängiger, rein lesender Index öffentlich gelisteter Little Biggy Angebote. Diese Seite erklärt, was die Seite ist, woher ihre Daten stammen und wie die angezeigten Zahlen zustande kommen – damit Sie selbst einschätzen können, wie sehr Sie ihnen vertrauen."
    fr-FR: "BiggyIndex est un index indépendant, en lecture seule, des offres publiquement répertoriées sur Little Biggy. Cette page explique ce qu'est le site, d'où proviennent ses données et comment les chiffres affichés sont établis — afin que vous puissiez juger par vous-même de la confiance à leur accorder."
    pt-PT: "O BiggyIndex é um índice independente e só de leitura das ofertas publicamente listadas no Little Biggy. Esta página explica o que é o site, de onde vêm os seus dados e como são construídos os números que vê — para que possa avaliar por si próprio até que ponto confiar neles."
    it-IT: "BiggyIndex è un indice indipendente e di sola lettura delle offerte pubblicamente elencate su Little Biggy. Questa pagina spiega cos'è il sito, da dove provengono i suoi dati e come sono costruiti i numeri che vedi — così puoi giudicare da solo quanto fidartene."
    es-ES: "BiggyIndex es un índice independiente y de solo lectura de las ofertas listadas públicamente en Little Biggy. Esta página explica qué es el sitio, de dónde proceden sus datos y cómo se elaboran las cifras que ves, para que puedas juzgar por ti mismo hasta qué punto fiarte de ellas."
    el-GR: "Το BiggyIndex είναι ένα ανεξάρτητο ευρετήριο μόνο για ανάγνωση των δημόσια καταχωρισμένων προσφορών του Little Biggy. Αυτή η σελίδα εξηγεί τι είναι ο ιστότοπος, από πού προέρχονται τα δεδομένα του και πώς προκύπτουν οι αριθμοί που βλέπετε — ώστε να κρίνετε μόνοι σας πόσο να τους εμπιστευτείτε."
    cs-CZ: "BiggyIndex je nezávislý index veřejně vypsaných nabídek Little Biggy, určený pouze ke čtení. Tato stránka vysvětluje, co web je, odkud pocházejí jeho data a jak vznikají čísla, která vidíte — abyste sami posoudili, nakolik jim věřit."
    pl-PL: "BiggyIndex to niezależny, tylko do odczytu indeks publicznie wystawionych ofert Little Biggy. Ta strona wyjaśnia, czym jest serwis, skąd pochodzą jego dane i jak powstają widoczne liczby — abyś mógł sam ocenić, na ile im ufać."
  sections:
    whatItIs:
      heading:
        en-GB: "What BiggyIndex is — and is not"
        de-DE: "Was BiggyIndex ist – und was nicht"
        fr-FR: "Ce qu'est BiggyIndex — et ce qu'il n'est pas"
        pt-PT: "O que o BiggyIndex é — e o que não é"
        it-IT: "Cos'è BiggyIndex — e cosa non è"
        es-ES: "Qué es BiggyIndex y qué no es"
        el-GR: "Τι είναι το BiggyIndex — και τι δεν είναι"
        cs-CZ: "Co BiggyIndex je — a co není"
        pl-PL: "Czym BiggyIndex jest — a czym nie"
      body:
        en-GB: "BiggyIndex is an independent catalogue that makes public Little Biggy listings easier to browse, filter and compare. It is not a marketplace: you cannot buy anything here, no order or payment ever passes through us, and we are not affiliated with, endorsed by, or operated by Little Biggy. Every purchase happens on Little Biggy itself, under Little Biggy's own terms."
        de-DE: "BiggyIndex ist ein unabhängiger Katalog, der öffentliche Little Biggy Angebote leichter durchsuchbar, filterbar und vergleichbar macht. Es ist kein Marktplatz: Man kann hier nichts kaufen, keine Bestellung und keine Zahlung läuft je über uns, und wir sind weder mit Little Biggy verbunden noch von Little Biggy unterstützt oder betrieben. Jeder Kauf findet auf Little Biggy selbst statt, zu dessen eigenen Bedingungen."
        fr-FR: "BiggyIndex est un catalogue indépendant qui facilite la navigation, le filtrage et la comparaison des annonces publiques de Little Biggy. Ce n'est pas une place de marché : vous ne pouvez rien acheter ici, aucune commande ni aucun paiement ne passe par nous, et nous ne sommes ni affiliés à Little Biggy, ni approuvés ou exploités par lui. Chaque achat se fait sur Little Biggy même, selon ses propres conditions."
        pt-PT: "O BiggyIndex é um catálogo independente que torna as listagens públicas do Little Biggy mais fáceis de navegar, filtrar e comparar. Não é um mercado: não pode comprar nada aqui, nenhuma encomenda ou pagamento passa por nós, e não somos afiliados, apoiados nem operados pelo Little Biggy. Cada compra acontece no próprio Little Biggy, sob os termos do próprio Little Biggy."
        it-IT: "BiggyIndex è un catalogo indipendente che rende più facile sfogliare, filtrare e confrontare gli annunci pubblici di Little Biggy. Non è un marketplace: qui non puoi acquistare nulla, nessun ordine o pagamento passa mai da noi, e non siamo affiliati, approvati o gestiti da Little Biggy. Ogni acquisto avviene su Little Biggy stesso, secondo i termini di Little Biggy."
        es-ES: "BiggyIndex es un catálogo independiente que facilita navegar, filtrar y comparar los anuncios públicos de Little Biggy. No es un mercado: aquí no puedes comprar nada, ningún pedido ni pago pasa por nosotros, y no estamos afiliados, respaldados ni gestionados por Little Biggy. Cada compra ocurre en el propio Little Biggy, bajo los términos del propio Little Biggy."
        el-GR: "Το BiggyIndex είναι ένας ανεξάρτητος κατάλογος που κάνει τις δημόσιες καταχωρίσεις του Little Biggy πιο εύκολο να τις περιηγηθείτε, να τις φιλτράρετε και να τις συγκρίνετε. Δεν είναι αγορά: εδώ δεν μπορείτε να αγοράσετε τίποτα, καμία παραγγελία ή πληρωμή δεν περνά ποτέ από εμάς, και δεν έχουμε σχέση, έγκριση ή διαχείριση από το Little Biggy. Κάθε αγορά γίνεται στο ίδιο το Little Biggy, με τους δικούς του όρους."
        cs-CZ: "BiggyIndex je nezávislý katalog, který usnadňuje procházení, filtrování a porovnávání veřejných nabídek Little Biggy. Není to tržiště: nic si tu nekoupíte, žádná objednávka ani platba přes nás nikdy neprojde a nejsme s Little Biggy nijak spojeni, jím schváleni ani provozováni. Každý nákup probíhá na samotném Little Biggy, podle jeho vlastních podmínek."
        pl-PL: "BiggyIndex to niezależny katalog, który ułatwia przeglądanie, filtrowanie i porównywanie publicznych ofert Little Biggy. Nie jest to rynek: niczego tu nie kupisz, żadne zamówienie ani płatność nigdy nie przechodzi przez nas, i nie jesteśmy powiązani z Little Biggy, wspierani przez niego ani przez niego prowadzeni. Każdy zakup odbywa się na samym Little Biggy, na jego własnych warunkach."
    dataSources:
      heading:
        en-GB: "Where the data comes from"
        de-DE: "Woher die Daten stammen"
        fr-FR: "D'où proviennent les données"
        pt-PT: "De onde vêm os dados"
        it-IT: "Da dove provengono i dati"
        es-ES: "De dónde provienen los datos"
        el-GR: "Από πού προέρχονται τα δεδομένα"
        cs-CZ: "Odkud data pocházejí"
        pl-PL: "Skąd pochodzą dane"
      body:
        en-GB: "Everything shown here is gathered from publicly available Little Biggy listings by an automated crawler that refreshes roughly every 30 minutes. Nothing is entered by hand and we add no private information. For our non-English editions, listing text is translated by machine, so occasional wording quirks are normal — the original is always a click away on Little Biggy."
        de-DE: "Alles, was hier zu sehen ist, wird von einem automatischen Crawler aus öffentlich verfügbaren Little Biggy Angeboten gesammelt und etwa alle 30 Minuten aktualisiert. Nichts wird von Hand eingegeben, und wir fügen keine privaten Informationen hinzu. In unseren nicht-englischen Ausgaben werden Angebotstexte maschinell übersetzt, gelegentliche sprachliche Ungereimtheiten sind daher normal – das Original ist auf Little Biggy stets nur einen Klick entfernt."
        fr-FR: "Tout ce qui est affiché ici est collecté à partir des annonces Little Biggy publiquement disponibles par un robot automatique qui s'actualise environ toutes les 30 minutes. Rien n'est saisi à la main et nous n'ajoutons aucune information privée. Dans nos éditions non anglophones, le texte des annonces est traduit par machine ; quelques tournures approximatives sont donc normales — l'original est toujours à un clic sur Little Biggy."
        pt-PT: "Tudo o que é mostrado aqui é recolhido de listagens públicas do Little Biggy por um rastreador automático que se atualiza cerca de cada 30 minutos. Nada é introduzido à mão e não acrescentamos qualquer informação privada. Nas nossas edições não inglesas, o texto das listagens é traduzido por máquina, pelo que algumas expressões estranhas são normais — o original está sempre a um clique no Little Biggy."
        it-IT: "Tutto ciò che vedi qui è raccolto dagli annunci pubblici di Little Biggy da un crawler automatico che si aggiorna all'incirca ogni 30 minuti. Nulla è inserito a mano e non aggiungiamo alcuna informazione privata. Nelle nostre edizioni non in inglese il testo degli annunci è tradotto automaticamente, quindi qualche formulazione imprecisa è normale — l'originale è sempre a un clic di distanza su Little Biggy."
        es-ES: "Todo lo que se muestra aquí lo recopila un rastreador automático a partir de los anuncios públicos de Little Biggy, y se actualiza aproximadamente cada 30 minutos. Nada se introduce a mano y no añadimos ninguna información privada. En nuestras ediciones que no son en inglés, el texto de los anuncios se traduce automáticamente, así que alguna expresión rara es normal: el original está siempre a un clic en Little Biggy."
        el-GR: "Ό,τι εμφανίζεται εδώ συλλέγεται από δημόσια διαθέσιμες καταχωρίσεις του Little Biggy από έναν αυτόματο crawler που ανανεώνεται περίπου κάθε 30 λεπτά. Τίποτα δεν καταχωρείται με το χέρι και δεν προσθέτουμε καμία ιδιωτική πληροφορία. Στις μη αγγλικές εκδόσεις μας, το κείμενο των καταχωρίσεων μεταφράζεται από μηχανή, οπότε κάποιες αδέξιες διατυπώσεις είναι φυσιολογικές — το πρωτότυπο είναι πάντα ένα κλικ μακριά στο Little Biggy."
        cs-CZ: "Vše, co se zde zobrazuje, sbírá z veřejně dostupných nabídek Little Biggy automatický crawler, který se obnovuje zhruba každých 30 minut. Nic se nezadává ručně a nepřidáváme žádné soukromé informace. V našich neanglických verzích je text nabídek překládán strojově, takže občasné jazykové neobratnosti jsou běžné — originál je na Little Biggy vždy na jedno kliknutí."
        pl-PL: "Wszystko, co tu widać, zbiera z publicznie dostępnych ofert Little Biggy automatyczny crawler, który odświeża dane mniej więcej co 30 minut. Nic nie jest wprowadzane ręcznie i nie dodajemy żadnych prywatnych informacji. W naszych edycjach innych niż angielska tekst ofert jest tłumaczony maszynowo, więc sporadyczne niezręczności językowe są normalne — oryginał jest zawsze o jedno kliknięcie na Little Biggy."
    whatWeCompute:
      heading:
        en-GB: "What we compute"
        de-DE: "Was wir berechnen"
        fr-FR: "Ce que nous calculons"
        pt-PT: "O que calculamos"
        it-IT: "Cosa calcoliamo"
        es-ES: "Qué calculamos"
        el-GR: "Τι υπολογίζουμε"
        cs-CZ: "Co počítáme"
        pl-PL: "Co obliczamy"
      body:
        en-GB: "Most of what you see is copied straight from the listings, but a few figures are worked out by us:\n\n• Price history — we record each listing's prices over time so you can see whether they have risen or fallen.\n• Review stats — ratings and delivery times aggregated from the public reviews on each listing.\n• Seller feedback — endorsements and reports submitted by BiggyIndex visitors; every one is checked by a human moderator before it appears.\n\nSome numbers we deliberately do not compute: the \"Hottest\" sort order comes from Little Biggy itself — we simply display it.\n\nNone of these are guarantees; they are summaries of public data meant to help you compare."
        de-DE: "Das meiste, was Sie sehen, ist direkt aus den Angeboten übernommen, doch einige Werte berechnen wir selbst:\n\n• Preisverlauf – wir erfassen die Preise jedes Angebots im Zeitverlauf, damit Sie sehen, ob sie gestiegen oder gefallen sind.\n• Bewertungsstatistik – Bewertungen und Lieferzeiten, aggregiert aus den öffentlichen Rezensionen jedes Angebots.\n• Verkäufer-Feedback – Empfehlungen und Meldungen, die von BiggyIndex-Besuchern eingereicht werden; jede einzelne wird vor der Veröffentlichung von einem menschlichen Moderator geprüft.\n\nManche Zahlen berechnen wir bewusst nicht: die \"Hottest\"-Sortierung stammt von Little Biggy selbst – wir zeigen sie lediglich an.\n\nNichts davon ist eine Garantie; es sind Zusammenfassungen öffentlicher Daten, die Ihnen den Vergleich erleichtern sollen."
        fr-FR: "La plupart de ce que vous voyez est repris directement des annonces, mais quelques chiffres sont calculés par nos soins :\n\n• Historique des prix — nous enregistrons les prix de chaque annonce au fil du temps pour que vous puissiez voir s'ils ont augmenté ou baissé.\n• Statistiques d'avis — notes et délais de livraison agrégés à partir des avis publics de chaque annonce.\n• Retours sur les vendeurs — recommandations et signalements soumis par les visiteurs de BiggyIndex ; chacun est vérifié par un modérateur humain avant d'apparaître.\n\nCertains chiffres ne sont volontairement pas calculés par nous : l'ordre de tri « Hottest » provient de Little Biggy lui-même — nous ne faisons que l'afficher.\n\nRien de tout cela n'est une garantie ; ce sont des résumés de données publiques destinés à vous aider à comparer."
        pt-PT: "A maior parte do que vê é copiada diretamente das listagens, mas alguns valores são calculados por nós:\n\n• Histórico de preços — registamos os preços de cada listagem ao longo do tempo para que possa ver se subiram ou desceram.\n• Estatísticas de avaliações — classificações e tempos de entrega agregados a partir das avaliações públicas de cada listagem.\n• Feedback sobre vendedores — recomendações e denúncias submetidas pelos visitantes do BiggyIndex; cada uma é verificada por um moderador humano antes de aparecer.\n\nAlguns números deliberadamente não calculamos: a ordenação \"Hottest\" vem do próprio Little Biggy — limitamo-nos a exibi-la.\n\nNada disto são garantias; são resumos de dados públicos destinados a ajudá-lo a comparar."
        it-IT: "La maggior parte di ciò che vedi è copiata direttamente dagli annunci, ma alcuni dati li calcoliamo noi:\n\n• Storico dei prezzi — registriamo i prezzi di ogni annuncio nel tempo così puoi vedere se sono saliti o scesi.\n• Statistiche delle recensioni — valutazioni e tempi di consegna aggregati dalle recensioni pubbliche di ogni annuncio.\n• Feedback sui venditori — raccomandazioni e segnalazioni inviate dai visitatori di BiggyIndex; ognuna viene controllata da un moderatore umano prima di apparire.\n\nAlcuni numeri deliberatamente non li calcoliamo: l'ordinamento \"Hottest\" proviene da Little Biggy stesso — noi ci limitiamo a mostrarlo.\n\nNessuno di questi è una garanzia; sono riepiloghi di dati pubblici pensati per aiutarti a confrontare."
        es-ES: "La mayor parte de lo que ves se copia directamente de los anuncios, pero algunas cifras las calculamos nosotros:\n\n• Historial de precios: registramos los precios de cada anuncio a lo largo del tiempo para que veas si han subido o bajado.\n• Estadísticas de reseñas: valoraciones y tiempos de entrega agregados a partir de las reseñas públicas de cada anuncio.\n• Opiniones sobre vendedores: recomendaciones y denuncias enviadas por los visitantes de BiggyIndex; cada una la revisa un moderador humano antes de publicarse.\n\nAlgunas cifras deliberadamente no las calculamos: el orden \"Hottest\" procede del propio Little Biggy; nosotros solo lo mostramos.\n\nNada de esto son garantías; son resúmenes de datos públicos pensados para ayudarte a comparar."
        el-GR: "Το μεγαλύτερο μέρος όσων βλέπετε αντιγράφεται απευθείας από τις καταχωρίσεις, αλλά ορισμένα στοιχεία τα υπολογίζουμε εμείς:\n\n• Ιστορικό τιμών — καταγράφουμε τις τιμές κάθε καταχώρισης στον χρόνο, ώστε να βλέπετε αν έχουν ανέβει ή πέσει.\n• Στατιστικά κριτικών — βαθμολογίες και χρόνοι παράδοσης συγκεντρωμένα από τις δημόσιες κριτικές κάθε καταχώρισης.\n• Σχόλια για πωλητές — συστάσεις και αναφορές που υποβάλλουν οι επισκέπτες του BiggyIndex· καθεμία ελέγχεται από άνθρωπο συντονιστή πριν εμφανιστεί.\n\nΟρισμένους αριθμούς σκόπιμα δεν τους υπολογίζουμε: η σειρά ταξινόμησης \"Hottest\" προέρχεται από το ίδιο το Little Biggy — εμείς απλώς την εμφανίζουμε.\n\nΤίποτα από αυτά δεν αποτελεί εγγύηση· είναι συνόψεις δημόσιων δεδομένων που σκοπό έχουν να σας βοηθήσουν να συγκρίνετε."
        cs-CZ: "Většina toho, co vidíte, je převzata přímo z nabídek, ale některé hodnoty počítáme my:\n\n• Historie cen — zaznamenáváme ceny každé nabídky v čase, abyste viděli, zda stouply nebo klesly.\n• Statistiky recenzí — hodnocení a doby doručení agregované z veřejných recenzí u každé nabídky.\n• Zpětná vazba k prodejcům — doporučení a nahlášení odeslaná návštěvníky BiggyIndexu; každé před zveřejněním zkontroluje lidský moderátor.\n\nNěkterá čísla záměrně nepočítáme: řazení \"Hottest\" pochází přímo z Little Biggy — my je pouze zobrazujeme.\n\nNic z toho není záruka; jsou to souhrny veřejných dat, které vám mají pomoci porovnávat."
        pl-PL: "Większość tego, co widzisz, jest kopiowana wprost z ofert, ale niektóre dane obliczamy sami:\n\n• Historia cen — zapisujemy ceny każdej oferty w czasie, abyś mógł zobaczyć, czy wzrosły, czy spadły.\n• Statystyki recenzji — oceny i czasy dostawy zagregowane z publicznych recenzji każdej oferty.\n• Opinie o sprzedawcach — polecenia i zgłoszenia przesyłane przez odwiedzających BiggyIndex; każde jest sprawdzane przez moderatora, zanim się pojawi.\n\nNiektórych liczb celowo nie obliczamy: kolejność sortowania \"Hottest\" pochodzi z samego Little Biggy — my ją tylko wyświetlamy.\n\nŻadna z tych rzeczy nie jest gwarancją; to podsumowania publicznych danych, które mają pomóc Ci w porównaniu."
    archive:
      heading:
        en-GB: "Archive policy"
        de-DE: "Archiv-Richtlinie"
        fr-FR: "Politique d'archivage"
        pt-PT: "Política de arquivo"
        it-IT: "Politica di archiviazione"
        es-ES: "Política de archivo"
        el-GR: "Πολιτική αρχειοθέτησης"
        cs-CZ: "Zásady archivace"
        pl-PL: "Zasady archiwizacji"
      body:
        en-GB: "When a listing is removed from Little Biggy we do not simply delete it. Instead we keep an archived page, clearly marked \"no longer listed\", so links, prices and history stay available for reference rather than turning into dead ends."
        de-DE: "Wenn ein Angebot von Little Biggy entfernt wird, löschen wir es nicht einfach. Stattdessen behalten wir eine archivierte Seite, deutlich als \"nicht mehr gelistet\" gekennzeichnet, damit Links, Preise und Verlauf als Referenz erhalten bleiben, statt zu toten Enden zu werden."
        fr-FR: "Lorsqu'une annonce est retirée de Little Biggy, nous ne la supprimons pas purement et simplement. Nous conservons plutôt une page archivée, clairement marquée « n'est plus répertoriée », afin que les liens, les prix et l'historique restent consultables au lieu de devenir des impasses."
        pt-PT: "Quando uma listagem é removida do Little Biggy, não a apagamos simplesmente. Em vez disso, mantemos uma página arquivada, claramente marcada como \"já não listada\", para que ligações, preços e histórico continuem disponíveis para consulta em vez de se tornarem becos sem saída."
        it-IT: "Quando un annuncio viene rimosso da Little Biggy non lo cancelliamo semplicemente. Manteniamo invece una pagina archiviata, chiaramente contrassegnata come \"non più in elenco\", così che link, prezzi e storico restino disponibili come riferimento invece di trasformarsi in vicoli ciechi."
        es-ES: "Cuando un anuncio se retira de Little Biggy no lo eliminamos sin más. En su lugar conservamos una página archivada, claramente marcada como \"ya no listado\", para que los enlaces, los precios y el historial sigan disponibles como referencia en vez de convertirse en callejones sin salida."
        el-GR: "Όταν μια καταχώριση αφαιρείται από το Little Biggy, δεν τη διαγράφουμε απλώς. Αντ' αυτού διατηρούμε μια αρχειοθετημένη σελίδα, με σαφή σήμανση \"δεν είναι πλέον καταχωρισμένη\", ώστε σύνδεσμοι, τιμές και ιστορικό να παραμένουν διαθέσιμα για αναφορά αντί να καταλήγουν σε αδιέξοδα."
        cs-CZ: "Když je nabídka odstraněna z Little Biggy, jednoduše ji nesmažeme. Místo toho ponecháme archivovanou stránku, zřetelně označenou jako \"již není v nabídce\", aby odkazy, ceny a historie zůstaly dostupné pro referenci, místo aby se z nich staly slepé uličky."
        pl-PL: "Gdy oferta zostaje usunięta z Little Biggy, nie kasujemy jej po prostu. Zamiast tego zachowujemy zarchiwizowaną stronę, wyraźnie oznaczoną jako \"już niedostępna\", aby linki, ceny i historia pozostały dostępne jako źródło informacji, zamiast stać się ślepymi zaułkami."
    freshness:
      heading:
        en-GB: "Freshness and accuracy"
        de-DE: "Aktualität und Genauigkeit"
        fr-FR: "Fraîcheur et exactitude"
        pt-PT: "Atualidade e exatidão"
        it-IT: "Aggiornamento e accuratezza"
        es-ES: "Actualidad y exactitud"
        el-GR: "Επικαιρότητα και ακρίβεια"
        cs-CZ: "Aktuálnost a přesnost"
        pl-PL: "Aktualność i dokładność"
      body:
        en-GB: "Because crawls run periodically, prices, stock and availability can change on Little Biggy between refreshes, and what you see here may briefly lag the live listing. Treat the figures as a helpful guide, not a live quote — always confirm the current price and availability on Little Biggy before acting."
        de-DE: "Da die Crawls in Abständen laufen, können sich Preise, Bestand und Verfügbarkeit auf Little Biggy zwischen den Aktualisierungen ändern, und was Sie hier sehen, kann dem Live-Angebot kurzzeitig hinterherhinken. Betrachten Sie die Angaben als hilfreiche Orientierung, nicht als Live-Preis – prüfen Sie den aktuellen Preis und die Verfügbarkeit immer auf Little Biggy, bevor Sie handeln."
        fr-FR: "Comme les collectes s'exécutent périodiquement, les prix, le stock et la disponibilité peuvent changer sur Little Biggy entre deux actualisations, et ce que vous voyez ici peut brièvement être en retard sur l'annonce en direct. Considérez les chiffres comme un repère utile, pas comme un tarif en temps réel — confirmez toujours le prix et la disponibilité actuels sur Little Biggy avant d'agir."
        pt-PT: "Como os rastreios são periódicos, os preços, o stock e a disponibilidade podem mudar no Little Biggy entre atualizações, e o que vê aqui pode ficar brevemente atrás da listagem em direto. Encare os valores como uma orientação útil, não como um preço em tempo real — confirme sempre o preço e a disponibilidade atuais no Little Biggy antes de agir."
        it-IT: "Poiché le scansioni vengono eseguite periodicamente, prezzi, disponibilità e giacenze possono cambiare su Little Biggy tra un aggiornamento e l'altro, e ciò che vedi qui potrebbe essere brevemente in ritardo rispetto all'annuncio dal vivo. Considera i dati come una guida utile, non come un prezzo in tempo reale — conferma sempre il prezzo e la disponibilità attuali su Little Biggy prima di agire."
        es-ES: "Como los rastreos se ejecutan de forma periódica, los precios, el stock y la disponibilidad pueden cambiar en Little Biggy entre actualizaciones, y lo que ves aquí puede ir brevemente por detrás del anuncio en vivo. Toma las cifras como una guía útil, no como un precio en tiempo real: confirma siempre el precio y la disponibilidad actuales en Little Biggy antes de actuar."
        el-GR: "Επειδή οι σαρώσεις εκτελούνται περιοδικά, οι τιμές, το απόθεμα και η διαθεσιμότητα μπορεί να αλλάξουν στο Little Biggy μεταξύ των ανανεώσεων, και ό,τι βλέπετε εδώ μπορεί να υστερεί για λίγο σε σχέση με τη ζωντανή καταχώριση. Θεωρήστε τα στοιχεία χρήσιμο οδηγό, όχι τιμή σε πραγματικό χρόνο — επιβεβαιώνετε πάντα την τρέχουσα τιμή και διαθεσιμότητα στο Little Biggy πριν ενεργήσετε."
        cs-CZ: "Protože procházení probíhá pravidelně, ceny, skladová dostupnost a nabídka se mohou na Little Biggy mezi aktualizacemi změnit a to, co zde vidíte, může krátce zaostávat za živou nabídkou. Berte údaje jako užitečné vodítko, ne jako živou cenu — před jednáním si vždy ověřte aktuální cenu a dostupnost na Little Biggy."
        pl-PL: "Ponieważ przeszukiwania odbywają się okresowo, ceny, stan magazynowy i dostępność mogą się na Little Biggy zmieniać między odświeżeniami, a to, co tu widzisz, może przez chwilę być opóźnione względem aktywnej oferty. Traktuj te dane jako pomocną wskazówkę, a nie cenę w czasie rzeczywistym — przed podjęciem działania zawsze potwierdź aktualną cenę i dostępność na Little Biggy."
    contact:
      heading:
        en-GB: "Contact and feedback"
        de-DE: "Kontakt und Feedback"
        fr-FR: "Contact et retours"
        pt-PT: "Contacto e sugestões"
        it-IT: "Contatti e feedback"
        es-ES: "Contacto y sugerencias"
        el-GR: "Επικοινωνία και σχόλια"
        cs-CZ: "Kontakt a zpětná vazba"
        pl-PL: "Kontakt i opinie"
      body:
        en-GB: "Spotted something wrong, or want a listing corrected or removed? Use the suggestion feature on any item page to get in touch — it is the quickest way to reach us."
        de-DE: "Ist Ihnen ein Fehler aufgefallen, oder soll ein Angebot korrigiert oder entfernt werden? Nutzen Sie die Korrekturvorschlag-Funktion auf jeder Artikelseite, um uns zu kontaktieren – das ist der schnellste Weg zu uns."
        fr-FR: "Vous avez repéré une erreur, ou souhaitez faire corriger ou retirer une annonce ? Utilisez la fonction de suggestion présente sur chaque page d'article pour nous contacter — c'est le moyen le plus rapide de nous joindre."
        pt-PT: "Detetou algo errado, ou quer que uma listagem seja corrigida ou removida? Use a funcionalidade de sugestões em qualquer página de item para nos contactar — é a forma mais rápida de chegar até nós."
        it-IT: "Hai notato qualcosa di sbagliato, o vuoi che un annuncio venga corretto o rimosso? Usa la funzione di suggerimento presente in ogni pagina di articolo per metterti in contatto — è il modo più rapido per raggiungerci."
        es-ES: "¿Has visto algo incorrecto, o quieres que se corrija o elimine un anuncio? Usa la función de sugerencias de cualquier página de artículo para ponerte en contacto: es la forma más rápida de llegar a nosotros."
        el-GR: "Εντοπίσατε κάτι λάθος ή θέλετε να διορθωθεί ή να αφαιρεθεί μια καταχώριση; Χρησιμοποιήστε τη λειτουργία προτάσεων σε οποιαδήποτε σελίδα προϊόντος για να επικοινωνήσετε — είναι ο ταχύτερος τρόπος να μας βρείτε."
        cs-CZ: "Všimli jste si chyby, nebo chcete nějakou nabídku opravit či odstranit? Napište nám přes funkci návrhů na kterékoli stránce položky — je to nejrychlejší způsob, jak nás zastihnout."
        pl-PL: "Zauważyłeś błąd albo chcesz, aby ofertę poprawiono lub usunięto? Skorzystaj z funkcji sugestii na dowolnej stronie przedmiotu, aby się z nami skontaktować — to najszybszy sposób, by do nas dotrzeć."
legal:
  privacy:
    metadataTitle:
      en-GB: "Privacy Policy | BiggyIndex"
      de-DE: "Datenschutzerklärung | BiggyIndex"
      fr-FR: "Politique de confidentialité | BiggyIndex"
      pt-PT: "Política de Privacidade | BiggyIndex"
      it-IT: "Informativa sulla privacy | BiggyIndex"
      es-ES: "Política de privacidad | BiggyIndex"
      el-GR: "Πολιτική Απορρήτου | BiggyIndex"
      cs-CZ: "Zásady ochrany soukromí | BiggyIndex"
      pl-PL: "Polityka prywatności | BiggyIndex"
    metadataDescription:
      en-GB: "How BiggyIndex handles data — no accounts, no analytics, no tracking, and only functional cookies."
      de-DE: "Wie BiggyIndex mit Daten umgeht — keine Konten, keine Analytics, kein Tracking und nur funktionale Cookies."
      fr-FR: "Comment BiggyIndex traite les données — pas de comptes, pas d’analytics, pas de traçage, et uniquement des cookies fonctionnels."
      pt-PT: "Como o BiggyIndex trata os dados — sem contas, sem analytics, sem rastreamento e apenas cookies funcionais."
      it-IT: "Come BiggyIndex gestisce i dati — nessun account, nessuna analisi, nessun tracciamento e solo cookie funzionali."
      es-ES: "Cómo maneja los datos BiggyIndex: sin cuentas, sin analíticas, sin rastreo y solo cookies funcionales."
      el-GR: "Πώς διαχειρίζεται τα δεδομένα το BiggyIndex — χωρίς λογαριασμούς, χωρίς analytics, χωρίς παρακολούθηση και μόνο λειτουργικά cookies."
      cs-CZ: "Jak BiggyIndex nakládá s daty — žádné účty, žádná analytika, žádné sledování a pouze funkční cookies."
      pl-PL: "Jak BiggyIndex obchodzi się z danymi — bez kont, bez statystyk, bez śledzenia i tylko funkcjonalne pliki cookie."
    title:
      en-GB: "Privacy Policy"
      de-DE: "Datenschutzerklärung"
      fr-FR: "Politique de confidentialité"
      pt-PT: "Política de Privacidade"
      it-IT: "Informativa sulla privacy"
      es-ES: "Política de privacidad"
      el-GR: "Πολιτική Απορρήτου"
      cs-CZ: "Zásady ochrany soukromí"
      pl-PL: "Polityka prywatności"
    updated:
      en-GB: "Last updated July 2026"
      de-DE: "Zuletzt aktualisiert im Juli 2026"
      fr-FR: "Dernière mise à jour : juillet 2026"
      pt-PT: "Última atualização: julho de 2026"
      it-IT: "Ultimo aggiornamento: luglio 2026"
      es-ES: "Última actualización: julio de 2026"
      el-GR: "Τελευταία ενημέρωση: Ιούλιος 2026"
      cs-CZ: "Naposledy aktualizováno v červenci 2026"
      pl-PL: "Ostatnia aktualizacja: lipiec 2026"
    intro:
      en-GB: "BiggyIndex is an independent, read-only index of publicly available Little Biggy listings. The site is deliberately simple, and that extends to privacy — there is very little data we could collect, and we choose not to collect more."
      de-DE: "BiggyIndex ist ein unabhängiger, rein lesender Index öffentlich verfügbarer Little Biggy Angebote. Die Seite ist bewusst einfach gehalten – das gilt auch für den Datenschutz: Es gibt nur sehr wenige Daten, die wir überhaupt erfassen könnten, und wir entscheiden uns, nicht mehr zu erfassen."
      fr-FR: "BiggyIndex est un index indépendant, en lecture seule, des annonces Little Biggy publiquement disponibles. Le site est volontairement simple, et cela vaut aussi pour la confidentialité — il y a très peu de données que nous pourrions collecter, et nous choisissons de ne pas en collecter davantage."
      pt-PT: "O BiggyIndex é um índice independente e só de leitura das listagens públicas do Little Biggy. O site é deliberadamente simples, e isso estende-se à privacidade — há muito poucos dados que poderíamos recolher, e escolhemos não recolher mais."
      it-IT: "BiggyIndex è un indice indipendente e di sola lettura degli annunci Little Biggy pubblicamente disponibili. Il sito è volutamente semplice, e questo vale anche per la privacy: ci sono pochissimi dati che potremmo raccogliere, e scegliamo di non raccoglierne di più."
      es-ES: "BiggyIndex es un índice independiente y de solo lectura de los anuncios públicos de Little Biggy. El sitio es deliberadamente sencillo, y eso se extiende a la privacidad: hay muy pocos datos que podríamos recopilar, y elegimos no recopilar más."
      el-GR: "Το BiggyIndex είναι ένα ανεξάρτητο ευρετήριο μόνο για ανάγνωση των δημόσια διαθέσιμων καταχωρίσεων του Little Biggy. Ο ιστότοπος είναι σκόπιμα απλός, και αυτό ισχύει και για το απόρρητο — υπάρχουν ελάχιστα δεδομένα που θα μπορούσαμε να συλλέξουμε, και επιλέγουμε να μη συλλέγουμε περισσότερα."
      cs-CZ: "BiggyIndex je nezávislý index veřejně dostupných nabídek Little Biggy, určený pouze ke čtení. Web je záměrně jednoduchý a to platí i pro soukromí — existuje jen velmi málo dat, která bychom mohli sbírat, a rozhodli jsme se nesbírat víc."
      pl-PL: "BiggyIndex to niezależny indeks publicznie dostępnych ofert Little Biggy, działający tylko do odczytu. Strona jest celowo prosta i dotyczy to również prywatności — jest bardzo niewiele danych, które moglibyśmy zbierać, i świadomie nie zbieramy więcej."
    sections:
      noAccounts:
        heading:
          en-GB: "No accounts, no purchases"
          de-DE: "Keine Konten, keine Käufe"
          fr-FR: "Pas de comptes, pas d’achats"
          pt-PT: "Sem contas, sem compras"
          it-IT: "Nessun account, nessun acquisto"
          es-ES: "Sin cuentas, sin compras"
          el-GR: "Χωρίς λογαριασμούς, χωρίς αγορές"
          cs-CZ: "Žádné účty, žádné nákupy"
          pl-PL: "Bez kont, bez zakupów"
        body:
          en-GB: "You cannot create an account, log in, or buy anything on BiggyIndex. We never ask for your name, email address, payment details, or delivery address. Any purchase happens on Little Biggy, under Little Biggy's own terms and privacy practices — nothing about it passes through us."
          de-DE: "Auf BiggyIndex kann man kein Konto erstellen, sich nicht anmelden und nichts kaufen. Wir fragen nie nach Namen, E-Mail-Adresse, Zahlungsdaten oder Lieferadresse. Jeder Kauf findet auf Little Biggy statt, unter dessen eigenen Bedingungen und Datenschutzpraktiken – nichts davon läuft über uns."
          fr-FR: "Vous ne pouvez pas créer de compte, vous connecter ou acheter quoi que ce soit sur BiggyIndex. Nous ne demandons jamais votre nom, votre adresse e-mail, vos coordonnées de paiement ou votre adresse de livraison. Tout achat se fait sur Little Biggy, selon ses propres conditions et pratiques de confidentialité — rien ne passe par nous."
          pt-PT: "Não é possível criar conta, iniciar sessão ou comprar nada no BiggyIndex. Nunca pedimos o seu nome, endereço de e-mail, dados de pagamento ou morada de entrega. Qualquer compra acontece no Little Biggy, sob os termos e práticas de privacidade do próprio Little Biggy — nada disso passa por nós."
          it-IT: "Su BiggyIndex non è possibile creare un account, accedere o acquistare nulla. Non chiediamo mai nome, indirizzo e-mail, dati di pagamento o indirizzo di consegna. Qualsiasi acquisto avviene su Little Biggy, secondo i termini e le pratiche di privacy di Little Biggy — nulla di tutto ciò passa da noi."
          es-ES: "No puedes crear una cuenta, iniciar sesión ni comprar nada en BiggyIndex. Nunca pedimos tu nombre, correo electrónico, datos de pago ni dirección de entrega. Cualquier compra ocurre en Little Biggy, bajo sus propios términos y prácticas de privacidad: nada de eso pasa por nosotros."
          el-GR: "Δεν μπορείτε να δημιουργήσετε λογαριασμό, να συνδεθείτε ή να αγοράσετε κάτι στο BiggyIndex. Δεν ζητάμε ποτέ το όνομά σας, το email σας, στοιχεία πληρωμής ή διεύθυνση παράδοσης. Κάθε αγορά γίνεται στο Little Biggy, με τους δικούς του όρους και πρακτικές απορρήτου — τίποτα από αυτά δεν περνά από εμάς."
          cs-CZ: "Na BiggyIndex si nemůžete vytvořit účet, přihlásit se ani nic koupit. Nikdy nechceme vaše jméno, e-mail, platební údaje ani doručovací adresu. Každý nákup probíhá na Little Biggy, podle jeho vlastních podmínek a zásad ochrany soukromí — nic z toho nejde přes nás."
          pl-PL: "Na BiggyIndex nie można założyć konta, zalogować się ani niczego kupić. Nigdy nie prosimy o imię i nazwisko, adres e-mail, dane płatnicze ani adres dostawy. Każdy zakup odbywa się na Little Biggy, na jego własnych warunkach i zasadach prywatności — nic z tego nie przechodzi przez nas."
      noTracking:
        heading:
          en-GB: "No analytics or tracking"
          de-DE: "Keine Analytics, kein Tracking"
          fr-FR: "Pas d’analytics ni de traçage"
          pt-PT: "Sem analytics nem rastreamento"
          it-IT: "Nessuna analisi né tracciamento"
          es-ES: "Sin analíticas ni rastreo"
          el-GR: "Χωρίς analytics ή παρακολούθηση"
          cs-CZ: "Žádná analytika ani sledování"
          pl-PL: "Bez statystyk i śledzenia"
        body:
          en-GB: "We do not run analytics or advertising scripts, and we do not use tracking pixels or fingerprinting. We do not build visitor profiles, and we have no personal data to sell or share with anyone."
          de-DE: "Wir setzen keine Analyse- oder Werbeskripte ein und verwenden weder Tracking-Pixel noch Fingerprinting. Wir erstellen keine Besucherprofile und haben keine personenbezogenen Daten, die wir verkaufen oder mit irgendjemandem teilen könnten."
          fr-FR: "Nous n’utilisons aucun script d’analyse ou de publicité, ni pixels de suivi ou empreinte numérique. Nous ne créons pas de profils de visiteurs et nous n’avons aucune donnée personnelle à vendre ou à partager avec qui que ce soit."
          pt-PT: "Não usamos scripts de analytics nem de publicidade, e não utilizamos pixels de rastreamento nem fingerprinting. Não criamos perfis de visitantes e não temos dados pessoais para vender ou partilhar com ninguém."
          it-IT: "Non utilizziamo script di analisi o pubblicitari, né pixel di tracciamento o fingerprinting. Non creiamo profili dei visitatori e non abbiamo dati personali da vendere o condividere con nessuno."
          es-ES: "No usamos scripts de analítica ni de publicidad, y no utilizamos píxeles de seguimiento ni fingerprinting. No creamos perfiles de visitantes y no tenemos datos personales que vender o compartir con nadie."
          el-GR: "Δεν χρησιμοποιούμε σενάρια analytics ή διαφημίσεων, ούτε pixels παρακολούθησης ή fingerprinting. Δεν δημιουργούμε προφίλ επισκεπτών και δεν έχουμε προσωπικά δεδομένα να πουλήσουμε ή να μοιραστούμε με κανέναν."
          cs-CZ: "Nepoužíváme analytické ani reklamní skripty, sledovací pixely ani fingerprinting. Nevytváříme profily návštěvníků a nemáme žádná osobní data, která bychom mohli prodat nebo s kýmkoli sdílet."
          pl-PL: "Nie używamy skryptów analitycznych ani reklamowych, pikseli śledzących ani fingerprintingu. Nie tworzymy profili odwiedzających i nie mamy żadnych danych osobowych do sprzedania czy udostępnienia komukolwiek."
      functionalStorage:
        heading:
          en-GB: "Functional cookies and local storage"
          de-DE: "Funktionale Cookies und lokaler Speicher"
          fr-FR: "Cookies fonctionnels et stockage local"
          pt-PT: "Cookies funcionais e armazenamento local"
          it-IT: "Cookie funzionali e archiviazione locale"
          es-ES: "Cookies funcionales y almacenamiento local"
          el-GR: "Λειτουργικά cookies και τοπική αποθήκευση"
          cs-CZ: "Funkční cookies a lokální úložiště"
          pl-PL: "Funkcjonalne pliki cookie i pamięć lokalna"
        body:
          en-GB: "The site uses a small amount of functional storage only — a locale cookie that remembers your language and market, and browser local storage for your preferences and activity: display settings such as dark mode, plus your saved items, basket and hidden sellers. All of it stays on your device, none of it identifies you, and none of it is sent to us. See the Cookie Policy for the full list."
          de-DE: "Die Seite nutzt nur wenig funktionalen Speicher – ein Locale-Cookie, das sich Sprache und Markt merkt, und den lokalen Browser-Speicher für Ihre Einstellungen und Aktivitäten: Anzeigeeinstellungen wie den Dunkelmodus sowie gespeicherte Artikel, Warenkorb und ausgeblendete Verkäufer. Alles bleibt auf Ihrem Gerät, nichts davon identifiziert Sie, und nichts wird an uns gesendet. Die vollständige Liste steht in der Cookie-Richtlinie."
          fr-FR: "Le site n’utilise qu’un minimum de stockage fonctionnel — un cookie qui mémorise votre langue et votre marché, et le stockage local du navigateur pour vos préférences et votre activité : réglages d’affichage comme le mode sombre, plus vos articles enregistrés, votre panier et les vendeurs masqués. Tout reste sur votre appareil, rien ne vous identifie et rien ne nous est envoyé. Consultez la politique de cookies pour la liste complète."
          pt-PT: "O site usa apenas uma pequena quantidade de armazenamento funcional — um cookie de idioma que memoriza a sua língua e o seu mercado, e o armazenamento local do navegador para as suas preferências e atividade: definições de exibição como o modo escuro, além dos seus itens guardados, cesto e vendedores ocultados. Tudo fica no seu dispositivo, nada o identifica e nada é enviado para nós. Consulte a Política de Cookies para a lista completa."
          it-IT: "Il sito utilizza solo una piccola quantità di archiviazione funzionale: un cookie che ricorda la tua lingua e il tuo mercato, e l'archiviazione locale del browser per le tue preferenze e la tua attività: impostazioni di visualizzazione come la modalità scura, più gli articoli salvati, il carrello e i venditori nascosti. Tutto resta sul tuo dispositivo, nulla ti identifica e nulla ci viene inviato. Consulta la Cookie Policy per l'elenco completo."
          es-ES: "El sitio solo usa una pequeña cantidad de almacenamiento funcional: una cookie de idioma que recuerda tu idioma y tu mercado, y el almacenamiento local del navegador para tus preferencias y actividad: ajustes de visualización como el modo oscuro, además de tus artículos guardados, la cesta y los vendedores ocultados. Todo permanece en tu dispositivo, nada te identifica y nada se nos envía. Consulta la Política de cookies para ver la lista completa."
          el-GR: "Ο ιστότοπος χρησιμοποιεί μόνο ελάχιστη λειτουργική αποθήκευση — ένα cookie που θυμάται τη γλώσσα και την αγορά σας, και την τοπική αποθήκευση του προγράμματος περιήγησης για τις προτιμήσεις και τη δραστηριότητά σας: ρυθμίσεις εμφάνισης όπως η σκοτεινή λειτουργία, καθώς και τα αποθηκευμένα προϊόντα, το καλάθι και τους κρυμμένους πωλητές. Όλα μένουν στη συσκευή σας, τίποτα δεν σας ταυτοποιεί και τίποτα δεν αποστέλλεται σε εμάς. Δείτε την Πολιτική Cookies για την πλήρη λίστα."
          cs-CZ: "Web používá jen malé množství funkčního úložiště — cookie, které si pamatuje váš jazyk a trh, a lokální úložiště prohlížeče pro vaše předvolby a aktivitu: nastavení zobrazení jako tmavý režim, plus uložené položky, košík a skryté prodejce. Vše zůstává ve vašem zařízení, nic vás neidentifikuje a nic se nám neodesílá. Úplný seznam najdete v Zásadách používání cookies."
          pl-PL: "Strona korzysta tylko z niewielkiej ilości pamięci funkcjonalnej — pliku cookie zapamiętującego język i rynek oraz pamięci lokalnej przeglądarki dla Twoich preferencji i aktywności: ustawień wyświetlania, takich jak tryb ciemny, a także zapisanych przedmiotów, koszyka i ukrytych sprzedawców. Wszystko pozostaje na Twoim urządzeniu, nic Cię nie identyfikuje i nic nie jest do nas wysyłane. Pełna lista znajduje się w Polityce plików cookie."
      listingData:
        heading:
          en-GB: "Where our data comes from"
          de-DE: "Woher unsere Daten stammen"
          fr-FR: "D’où viennent nos données"
          pt-PT: "De onde vêm os nossos dados"
          it-IT: "Da dove provengono i nostri dati"
          es-ES: "De dónde provienen nuestros datos"
          el-GR: "Από πού προέρχονται τα δεδομένα μας"
          cs-CZ: "Odkud pocházejí naše data"
          pl-PL: "Skąd pochodzą nasze dane"
        body:
          en-GB: "Everything shown on BiggyIndex — items, sellers, prices, reviews — is sourced from publicly available Little Biggy listings. We hold no data about Little Biggy buyers."
          de-DE: "Alles, was auf BiggyIndex angezeigt wird – Artikel, Verkäufer, Preise, Bewertungen – stammt aus öffentlich verfügbaren Little Biggy Angeboten. Wir besitzen keine Daten über Little Biggy Käufer."
          fr-FR: "Tout ce qui est affiché sur BiggyIndex — articles, vendeurs, prix, avis — provient d’annonces Little Biggy publiquement disponibles. Nous ne détenons aucune donnée sur les acheteurs de Little Biggy."
          pt-PT: "Tudo o que é mostrado no BiggyIndex — itens, vendedores, preços, avaliações — provém de listagens públicas do Little Biggy. Não guardamos quaisquer dados sobre compradores do Little Biggy."
          it-IT: "Tutto ciò che appare su BiggyIndex — articoli, venditori, prezzi, recensioni — proviene da annunci Little Biggy pubblicamente disponibili. Non deteniamo alcun dato sugli acquirenti di Little Biggy."
          es-ES: "Todo lo que se muestra en BiggyIndex (artículos, vendedores, precios, reseñas) procede de anuncios públicos de Little Biggy. No guardamos ningún dato sobre los compradores de Little Biggy."
          el-GR: "Ό,τι εμφανίζεται στο BiggyIndex — προϊόντα, πωλητές, τιμές, κριτικές — προέρχεται από δημόσια διαθέσιμες καταχωρίσεις του Little Biggy. Δεν διατηρούμε κανένα δεδομένο για τους αγοραστές του Little Biggy."
          cs-CZ: "Vše, co se na BiggyIndex zobrazuje — položky, prodejci, ceny, recenze — pochází z veřejně dostupných nabídek Little Biggy. O kupujících na Little Biggy nemáme žádná data."
          pl-PL: "Wszystko, co widać na BiggyIndex — przedmioty, sprzedawcy, ceny, recenzje — pochodzi z publicznie dostępnych ofert Little Biggy. Nie przechowujemy żadnych danych o kupujących na Little Biggy."
      contact:
        heading:
          en-GB: "Contact"
          de-DE: "Kontakt"
          fr-FR: "Contact"
          pt-PT: "Contacto"
          it-IT: "Contatti"
          es-ES: "Contacto"
          el-GR: "Επικοινωνία"
          cs-CZ: "Kontakt"
          pl-PL: "Kontakt"
        body:
          en-GB: "If you have a question, or want something corrected or removed, contact us via the suggestion feature on any item page."
          de-DE: "Bei Fragen oder wenn etwas korrigiert oder entfernt werden soll, erreichen Sie uns über die Korrekturvorschlag-Funktion auf jeder Artikelseite."
          fr-FR: "Pour toute question, ou si vous souhaitez faire corriger ou retirer quelque chose, contactez-nous via la fonction de suggestion présente sur chaque page d’article."
          pt-PT: "Se tiver uma dúvida, ou quiser que algo seja corrigido ou removido, contacte-nos através da funcionalidade de sugestões em qualquer página de item."
          it-IT: "Se hai una domanda, o vuoi che qualcosa venga corretto o rimosso, contattaci tramite la funzione di suggerimento presente in ogni pagina di articolo."
          es-ES: "Si tienes una pregunta, o quieres que algo se corrija o se elimine, contáctanos mediante la función de sugerencias de cualquier página de artículo."
          el-GR: "Αν έχετε απορία ή θέλετε να διορθωθεί ή να αφαιρεθεί κάτι, επικοινωνήστε μαζί μας μέσω της λειτουργίας προτάσεων σε οποιαδήποτε σελίδα προϊόντος."
          cs-CZ: "Máte-li dotaz, nebo chcete něco opravit či odstranit, kontaktujte nás přes funkci návrhů na kterékoli stránce položky."
          pl-PL: "Jeśli masz pytanie albo chcesz, aby coś zostało poprawione lub usunięte, skontaktuj się z nami przez funkcję sugestii na dowolnej stronie przedmiotu."
  terms:
