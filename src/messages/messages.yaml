        purpose:
          en-GB: "Keeps your preferences and activity in your browser: display settings (dark mode, accent colour, currency, layout, sorting), your saved items and basket, hidden sellers, and small flags that stop forms being submitted twice. All of it stays on your device — it is never sent to us."
          de-DE: "Speichert Ihre Einstellungen und Aktivitäten in Ihrem Browser: Anzeigeeinstellungen (Dunkelmodus, Akzentfarbe, Währung, Layout, Sortierung), gespeicherte Artikel und Warenkorb, ausgeblendete Verkäufer sowie kleine Markierungen, die doppelte Formular-Übermittlungen verhindern. Alles bleibt auf Ihrem Gerät – nichts davon wird an uns gesendet."
          fr-FR: "Conserve vos préférences et votre activité dans votre navigateur : réglages d’affichage (mode sombre, couleur d’accent, devise, mise en page, tri), vos articles enregistrés et votre panier, les vendeurs masqués, ainsi que de petits marqueurs qui évitent les envois de formulaire en double. Tout reste sur votre appareil — rien ne nous est envoyé."
          pt-PT: "Guarda as suas preferências e atividade no seu navegador: definições de exibição (modo escuro, cor de destaque, moeda, layout, ordenação), os seus itens guardados e o cesto, vendedores ocultados e pequenos marcadores que evitam envios duplicados de formulários. Tudo fica no seu dispositivo — nada é enviado para nós."
          it-IT: "Conserva le tue preferenze e la tua attività nel browser: impostazioni di visualizzazione (modalità scura, colore d’accento, valuta, layout, ordinamento), gli articoli salvati e il carrello, i venditori nascosti e piccoli indicatori che evitano invii doppi dei moduli. Tutto resta sul tuo dispositivo — nulla ci viene inviato."
          es-ES: "Guarda tus preferencias y actividad en tu navegador: ajustes de visualización (modo oscuro, color de acento, moneda, diseño, orden), tus artículos guardados y la cesta, los vendedores ocultados y pequeñas marcas que evitan envíos duplicados de formularios. Todo permanece en tu dispositivo: nada se nos envía."
          el-GR: "Διατηρεί τις προτιμήσεις και τη δραστηριότητά σας στο πρόγραμμα περιήγησης: ρυθμίσεις εμφάνισης (σκοτεινή λειτουργία, χρώμα έμφασης, νόμισμα, διάταξη, ταξινόμηση), τα αποθηκευμένα προϊόντα και το καλάθι σας, κρυμμένους πωλητές και μικρές ενδείξεις που αποτρέπουν τις διπλές υποβολές φορμών. Όλα μένουν στη συσκευή σας — τίποτα δεν αποστέλλεται σε εμάς."
          cs-CZ: "Uchovává vaše předvolby a aktivitu ve vašem prohlížeči: nastavení zobrazení (tmavý režim, barva akcentu, měna, rozložení, řazení), uložené položky a košík, skryté prodejce a malé značky, které brání dvojímu odeslání formulářů. Vše zůstává ve vašem zařízení — nic se nám neodesílá."
          pl-PL: "Przechowuje w przeglądarce Twoje preferencje i aktywność: ustawienia wyświetlania (tryb ciemny, kolor akcentu, waluta, układ, sortowanie), zapisane przedmioty i koszyk, ukrytych sprzedawców oraz małe znaczniki zapobiegające podwójnemu wysyłaniu formularzy. Wszystko pozostaje na Twoim urządzeniu — nic nie jest do nas wysyłane."
    outro:
      en-GB: "Because none of this storage tracks you, there is no consent banner to dismiss. If you clear your browser data, the site simply returns to its defaults."
      de-DE: "Da nichts von diesem Speicher Sie verfolgt, gibt es kein Zustimmungsbanner zum Wegklicken. Wenn Sie Ihre Browserdaten löschen, kehrt die Seite einfach zu den Standardeinstellungen zurück."
      fr-FR: "Comme aucun de ces stockages ne vous suit, il n’y a pas de bannière de consentement à fermer. Si vous effacez vos données de navigation, le site revient simplement à ses réglages par défaut."
      pt-PT: "Como nenhum deste armazenamento o rastreia, não há banner de consentimento para fechar. Se limpar os dados do navegador, o site volta simplesmente às predefinições."
      it-IT: "Poiché nessuna di queste archiviazioni ti traccia, non c’è alcun banner di consenso da chiudere. Se cancelli i dati del browser, il sito torna semplicemente alle impostazioni predefinite."
      es-ES: "Como ninguno de estos almacenamientos te rastrea, no hay banner de consentimiento que cerrar. Si borras los datos del navegador, el sitio simplemente vuelve a sus valores predeterminados."
      el-GR: "Επειδή τίποτα από αυτήν την αποθήκευση δεν σας παρακολουθεί, δεν υπάρχει banner συγκατάθεσης για να κλείσετε. Αν διαγράψετε τα δεδομένα του προγράμματος περιήγησης, ο ιστότοπος απλώς επιστρέφει στις προεπιλογές του."
      cs-CZ: "Protože vás nic z tohoto úložiště nesleduje, není tu žádný souhlasový banner k odklikání. Pokud smažete data prohlížeče, web se prostě vrátí k výchozímu nastavení."
      pl-PL: "Ponieważ żadna z tych pamięci Cię nie śledzi, nie ma banera zgody do zamykania. Jeśli wyczyścisz dane przeglądarki, strona po prostu wróci do ustawień domyślnych."

