submitSeller:
  metadataTitle:
    en-GB: "Submit a Little Biggy seller | BiggyIndex"
    de-DE: "Little-Biggy-Verkäufer einreichen | BiggyIndex"
    fr-FR: "Proposer un vendeur Little Biggy | BiggyIndex"
    pt-PT: "Sugerir um vendedor Little Biggy | BiggyIndex"
    it-IT: "Segnala un venditore Little Biggy | BiggyIndex"
    es-ES: "Enviar un vendedor de Little Biggy | BiggyIndex"
    el-GR: "Υποβολή πωλητή Little Biggy | BiggyIndex"
    cs-CZ: "Navrhnout prodejce Little Biggy | BiggyIndex"
    pl-PL: "Zgłoś sprzedawcę Little Biggy | BiggyIndex"
  metadataDescription:
    en-GB: "Know a Little Biggy seller that isn't on the items wall? Submit them so their listings can be indexed on BiggyIndex."
    de-DE: "Kennst du einen Little-Biggy-Verkäufer, der nicht auf der Artikelwand steht? Reiche ihn ein, damit seine Angebote auf BiggyIndex erfasst werden können."
    fr-FR: "Tu connais un vendeur Little Biggy absent du mur d’articles ? Propose-le pour que ses annonces puissent être indexées sur BiggyIndex."
    pt-PT: "Conhece um vendedor do Little Biggy que não está no mural de artigos? Sugira-o para que os seus anúncios possam ser indexados no BiggyIndex."
    it-IT: "Conosci un venditore Little Biggy che non è sulla bacheca degli articoli? Segnalalo perché i suoi annunci possano essere indicizzati su BiggyIndex."
    es-ES: "¿Conoces a un vendedor de Little Biggy que no está en el muro de artículos? Envíalo para que sus anuncios puedan indexarse en BiggyIndex."
    el-GR: "Γνωρίζετε πωλητή του Little Biggy που δεν εμφανίζεται στον τοίχο αγγελιών; Υποβάλετέ τον ώστε οι αγγελίες του να καταχωριστούν στο BiggyIndex."
    cs-CZ: "Znáte prodejce Little Biggy, který není na zdi položek? Navrhněte ho, aby jeho nabídky mohly být zařazeny do BiggyIndex."
    pl-PL: "Znasz sprzedawcę Little Biggy, którego nie ma na ścianie ofert? Zgłoś go, aby jego oferty mogły trafić do BiggyIndex."
  heading:
    en-GB: "Submit a seller"
    de-DE: "Verkäufer einreichen"
    fr-FR: "Proposer un vendeur"
    pt-PT: "Sugerir um vendedor"
    it-IT: "Segnala un venditore"
    es-ES: "Enviar un vendedor"
    el-GR: "Υποβολή πωλητή"
    cs-CZ: "Navrhnout prodejce"
    pl-PL: "Zgłoś sprzedawcę"
  intro:
    en-GB: "Little Biggy keeps some sellers off its items wall, usually new or small shops. Their listings never appear when you browse Little Biggy, so BiggyIndex can't find them on its own. If you know one, send it here. Once reviewed, their listings join the index marked “Off-wall” and stay hidden until you switch on “Unlisted sellers” in the filters."
    de-DE: "Little Biggy zeigt manche Verkäufer nicht auf seiner Artikelwand, meist neue oder kleine Shops. Ihre Angebote erscheinen beim Stöbern auf Little Biggy nie, deshalb findet BiggyIndex sie nicht von selbst. Wenn du einen kennst, reiche ihn hier ein. Nach der Prüfung kommen seine Angebote mit der Markierung „Nicht gelistet“ in den Index und bleiben verborgen, bis du in den Filtern „Nicht gelistete Verkäufer“ einschaltest."
    fr-FR: "Little Biggy garde certains vendeurs hors de son mur d’articles, généralement des boutiques nouvelles ou petites. Leurs annonces n’apparaissent jamais quand tu parcours Little Biggy, donc BiggyIndex ne peut pas les trouver seul. Si tu en connais un, propose-le ici. Après vérification, ses annonces rejoignent l’index avec la mention « Hors mur » et restent masquées tant que tu n’actives pas « Vendeurs non listés » dans les filtres."
    pt-PT: "O Little Biggy mantém alguns vendedores fora do seu mural de artigos, normalmente lojas novas ou pequenas. Os seus anúncios nunca aparecem quando navega no Little Biggy, por isso o BiggyIndex não os consegue encontrar sozinho. Se conhecer algum, envie-o aqui. Depois de revistos, os seus anúncios entram no índice marcados como “Fora do mural” e ficam ocultos até ativar “Vendedores não listados” nos filtros."
    it-IT: "Little Biggy tiene alcuni venditori fuori dalla sua bacheca degli articoli, di solito negozi nuovi o piccoli. I loro annunci non compaiono mai quando sfogli Little Biggy, quindi BiggyIndex non può trovarli da solo. Se ne conosci uno, segnalalo qui. Dopo la revisione, i suoi annunci entrano nell'indice con l'etichetta “Fuori bacheca” e restano nascosti finché non attivi “Venditori non elencati” nei filtri."
    es-ES: "Little Biggy mantiene a algunos vendedores fuera de su muro de artículos, normalmente tiendas nuevas o pequeñas. Sus anuncios nunca aparecen cuando navegas por Little Biggy, así que BiggyIndex no puede encontrarlos por sí solo. Si conoces alguno, envíalo aquí. Tras la revisión, sus anuncios se suman al índice marcados como «Fuera del muro» y permanecen ocultos hasta que actives «Vendedores no listados» en los filtros."
    el-GR: "Το Little Biggy κρατά ορισμένους πωλητές εκτός του τοίχου αγγελιών του, συνήθως νέα ή μικρά καταστήματα. Οι αγγελίες τους δεν εμφανίζονται ποτέ όταν περιηγείστε στο Little Biggy, οπότε το BiggyIndex δεν μπορεί να τους βρει μόνο του. Αν γνωρίζετε κάποιον, υποβάλετέ τον εδώ. Μετά τον έλεγχο, οι αγγελίες του μπαίνουν στο ευρετήριο με την ένδειξη «Εκτός τοίχου» και μένουν κρυφές μέχρι να ενεργοποιήσετε το «Μη καταχωρισμένοι πωλητές» στα φίλτρα."
    cs-CZ: "Little Biggy některé prodejce nezobrazuje na své zdi položek, obvykle nové nebo malé obchody. Jejich nabídky se při procházení Little Biggy nikdy neobjeví, takže je BiggyIndex sám nenajde. Pokud nějakého znáte, pošlete ho sem. Po kontrole se jeho nabídky přidají do indexu s označením „Mimo zeď“ a zůstanou skryté, dokud ve filtrech nezapnete „Neuvedení prodejci“."
    pl-PL: "Little Biggy nie pokazuje niektórych sprzedawców na swojej ścianie ofert, zwykle nowych lub małych sklepów. Ich oferty nigdy nie pojawiają się podczas przeglądania Little Biggy, więc BiggyIndex nie znajdzie ich sam. Jeśli znasz takiego sprzedawcę, zgłoś go tutaj. Po weryfikacji jego oferty trafią do indeksu z oznaczeniem „Poza ścianą” i pozostaną ukryte, dopóki nie włączysz w filtrach opcji „Sprzedawcy spoza listy”."
  flaggedIntro:
    en-GB: "Sellers that Little Biggy itself marks with a warning banner, such as “fraud suspected”, are kept separate: they are labelled “Flagged by LB”, carry Little Biggy's warning, and only show when you switch on “Flagged by Little Biggy”."
    de-DE: "Verkäufer, die Little Biggy selbst mit einem Warnhinweis versieht, etwa „Betrugsverdacht“, werden getrennt geführt: Sie tragen die Markierung „Von LB markiert“, zeigen die Warnung von Little Biggy und erscheinen nur, wenn du „Von Little Biggy markiert“ einschaltest."
    fr-FR: "Les vendeurs que Little Biggy signale lui-même par un bandeau d’avertissement, comme « suspicion de fraude », sont traités à part : ils portent la mention « Signalé par LB », affichent l’avertissement de Little Biggy et n’apparaissent que si tu actives « Signalés par Little Biggy »."
    pt-PT: "Os vendedores que o próprio Little Biggy assinala com um aviso, como “suspeita de fraude”, ficam à parte: têm a etiqueta “Assinalado pelo LB”, mostram o aviso do Little Biggy e só aparecem quando ativa “Assinalados pelo Little Biggy”."
    it-IT: "I venditori che Little Biggy stesso segnala con un avviso, come “sospetta frode”, sono tenuti separati: hanno l'etichetta “Segnalato da LB”, riportano l'avviso di Little Biggy e compaiono solo se attivi “Segnalati da Little Biggy”."
    es-ES: "Los vendedores que el propio Little Biggy marca con un aviso, como «sospecha de fraude», se muestran aparte: llevan la etiqueta «Marcado por LB», incluyen el aviso de Little Biggy y solo aparecen si activas «Marcados por Little Biggy»."
    el-GR: "Οι πωλητές που το ίδιο το Little Biggy επισημαίνει με προειδοποίηση, όπως «υποψία απάτης», εμφανίζονται χωριστά: φέρουν την ένδειξη «Επισήμανση LB», δείχνουν την προειδοποίηση του Little Biggy και εμφανίζονται μόνο αν ενεργοποιήσετε το «Επισημασμένοι από το Little Biggy»."
    cs-CZ: "Prodejci, u kterých sám Little Biggy zobrazuje varování, například „podezření z podvodu“, jsou vedeni zvlášť: nesou označení „Varování LB“, ukazují varování Little Biggy a zobrazí se jen tehdy, když zapnete „S varováním Little Biggy“."
    pl-PL: "Sprzedawcy, których sam Little Biggy oznacza ostrzeżeniem, np. „podejrzenie oszustwa”, są pokazywani osobno: mają etykietę „Oznaczony przez LB”, wyświetlają ostrzeżenie Little Biggy i pojawiają się tylko po włączeniu opcji „Oznaczeni przez Little Biggy”."

