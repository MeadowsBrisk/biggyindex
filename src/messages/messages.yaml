          text:
            en-GB: Buy a few pounds more than you need and round up. That extra buffer covers network fees or crypto volatility.
            en-IE: Buy a few euro more than you need and round up. That extra buffer covers network fees or crypto volatility.
            de-DE: Kaufe für ein paar Euro mehr, als du brauchst, und runde auf. Dieser zusätzliche Puffer deckt Netzwerkgebühren oder Krypto-Volatilität ab.
            fr-FR: Achetez pour quelques euros de plus que nécessaire et arrondissez au supérieur. Cette marge supplémentaire couvre les frais de réseau ou la volatilité des cryptomonnaies.
            pt-PT: Compra alguns euros a mais do que precisas e arredonda para cima. Esse buffer extra cobre as taxas de rede ou a volatilidade das criptomoedas.
            it-IT: Compra qualche euro in più di quanto ti serve e arrotonda per eccesso. Quel buffer extra copre le commissioni di rete o la volatilità delle criptovalute.
            es-ES: Compra unos pocos euros más de los que necesitas y redondea al alza. Ese colchón extra cubre las comisiones de la red o la volatilidad de las criptomonedas.
            el-GR: Αγοράστε μερικά ευρώ παραπάνω από όσα χρειάζεστε και στρογγυλοποιήστε προς τα πάνω. Αυτό το επιπλέον buffer καλύπτει τα τέλη δικτύου ή τη μεταβλητότητα των κρυπτονομισμάτων.
            cs-CZ: Kupte si o pár korun víc, než potřebujete, a zaokrouhlete nahoru. Tato dodatečná rezerva pokrývá síťové poplatky nebo volatilitu kryptoměn.
            pl-PL: Kup za kilka złotych więcej niż potrzebujesz i zaokrąglij w górę. Ten dodatkowy bufor pokrywa opłaty sieciowe lub zmienność kryptowalut.
