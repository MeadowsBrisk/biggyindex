  close:
    en-GB: Close
    en-IE: Close
    de-DE: Schließen
    fr-FR: Fermer
    pt-PT: Fechar
    it-IT: Chiudi
    es-ES: Cerrar
    el-GR: Κλείσιμο
    cs-CZ: Zavřít
    pl-PL: Zamknij
  steps:
    country:
      title:
        en-GB: 1. Choose your country
        en-IE: 1. Choose your country
        de-DE: 1. Wähle dein Land
        fr-FR: 1. Choisis ton pays
        pt-PT: 1. Escolha o seu país
        it-IT: 1. Scegli il tuo paese
        es-ES: 1. Elige tu país
        el-GR: 1. Επιλέξτε τη χώρα σας
        cs-CZ: 1. Vyberte svou zemi
        pl-PL: 1. Wybierz swój kraj
      text:
        en-GB: Little Biggy needs to know where you are before it can show product options. Select your country first — it saves a cookie so you only need to do this once.
        en-IE: Little Biggy needs to know where you are before it can show product options. Select your country first — it saves a cookie so you only need to do this once.
        de-DE: Little Biggy muss wissen, wo du bist, bevor es Produktoptionen anzeigen kann. Wähle zuerst dein Land — ein Cookie wird gesetzt, damit du das nur einmal machen musst.
        fr-FR: Little Biggy a besoin de savoir où tu es avant d'afficher les options de produits. Sélectionne d'abord ton pays — un cookie est enregistré pour ne le faire qu'une seule fois.
        pt-PT: O Little Biggy precisa de saber onde está antes de mostrar as opções de produto. Selecione primeiro o seu país — é guardado um cookie para que só precise de fazer isto uma vez.
        it-IT: Little Biggy ha bisogno di sapere dove ti trovi prima di mostrare le opzioni dei prodotti. Seleziona prima il tuo paese — viene salvato un cookie così devi farlo solo una volta.
        es-ES: Little Biggy necesita saber dónde estás antes de mostrar las opciones de producto. Selecciona primero tu país — se guarda una cookie para que solo tengas que hacerlo una vez.
        el-GR: Το Little Biggy πρέπει να γνωρίζει πού βρίσκεστε πριν εμφανίσει επιλογές προϊόντων. Επιλέξτε πρώτα τη χώρα σας — αποθηκεύει ένα cookie ώστε να χρειαστεί να το κάνετε μόνο μία φορά.
        cs-CZ: Little Biggy potřebuje vědět, kde jste, než zobrazí možnosti produktů. Nejprve vyberte svou zemi — uloží cookie, takže to stačí udělat jen jednou.
        pl-PL: Little Biggy musi wiedzieć, gdzie się znajdujesz, zanim pokaże opcje produktów. Wybierz najpierw swój kraj — zapisuje się ciasteczko, więc wystarczy zrobić to tylko raz.
    buy:
      title:
        en-GB: 2. Browse & buy
        en-IE: 2. Browse & buy
        de-DE: 2. Stöbern & kaufen
