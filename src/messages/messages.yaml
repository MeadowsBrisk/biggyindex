      es-ES: Usa el texto en inglés y los nombres/descripciones originales del producto cuando estén disponibles.
      el-GR: Χρήση κειμένου στα Αγγλικά και πρωτότυπων ονομάτων/περιγραφών προϊόντων όταν είναι διαθέσιμα.
      cs-CZ: Použít anglický text a původní názvy a popisy produktů, pokud jsou k dispozici.
      pl-PL: Używaj angielskiej kopii interfejsu oraz oryginalnych nazw/opisów produktów, jeśli są dostępne.
