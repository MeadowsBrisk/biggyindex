  scopeNote:
    en-GB: "Per-gram figures cover flower, shake, hash and concentrates — products genuinely sold by cannabis weight. Vapes and distillate have their own sections below in the units they actually sell in, and edibles are excluded because a listed weight there is the food's, not the cannabis content."
    de-DE: "Die Grammpreise umfassen Blüten, Shake, Hash und Konzentrate — Produkte, die tatsächlich nach Cannabis-Gewicht verkauft werden. Vapes und Destillat haben weiter unten eigene Abschnitte in den Einheiten, in denen sie wirklich verkauft werden; essbare Produkte bleiben außen vor, weil das angegebene Gewicht dort das des Lebensmittels ist und nicht der Cannabis-Anteil."
    fr-FR: "Les chiffres au gramme couvrent la fleur, le shake, le hash et les concentrés — des produits réellement vendus au poids de cannabis. Les vapes et le distillat ont leurs propres sections plus bas, dans les unités où ils se vendent vraiment, et les comestibles sont exclus car le poids indiqué y est celui de l'aliment, pas de la teneur en cannabis."
    pt-PT: "Os valores por grama cobrem flor, shake, haxixe e concentrados — produtos realmente vendidos ao peso de canábis. Os vapes e o destilado têm secções próprias mais abaixo, nas unidades em que são de facto vendidos, e os comestíveis ficam de fora porque o peso indicado é o do alimento e não o teor de canábis."
    it-IT: "Le cifre al grammo coprono fiori, shake, hash e concentrati — prodotti venduti davvero a peso di cannabis. Vape e distillato hanno sezioni dedicate più sotto, nelle unità in cui vengono effettivamente venduti, e gli edibili restano esclusi perché il peso indicato è quello dell'alimento e non del contenuto di cannabis."
    es-ES: "Las cifras por gramo cubren flor, shake, hachís y concentrados — productos que se venden realmente al peso de cannabis. Los vapeadores y el destilado tienen sus propias secciones más abajo, en las unidades en que se venden de verdad, y los comestibles quedan fuera porque el peso indicado es el del alimento y no el contenido de cannabis."
    el-GR: "Τα στοιχεία ανά γραμμάριο καλύπτουν άνθη, σέικ, χασίς και συμπυκνώματα — προϊόντα που πωλούνται πραγματικά με το βάρος της κάνναβης. Τα vapes και το απόσταγμα έχουν δικές τους ενότητες παρακάτω, στις μονάδες που όντως πωλούνται, ενώ τα βρώσιμα εξαιρούνται επειδή το αναγραφόμενο βάρος αφορά το τρόφιμο και όχι την περιεκτικότητα σε κάνναβη."
    cs-CZ: "Ceny za gram pokrývají květy, shake, hash a koncentráty — produkty, které se opravdu prodávají podle váhy konopí. Vape a destilát mají níže vlastní sekce v jednotkách, ve kterých se skutečně prodávají, a jedlé produkty jsou vyloučené, protože uvedená váha je váhou potraviny, ne obsahu konopí."
    pl-PL: "Ceny za gram obejmują susz, shake, hash i koncentraty — produkty faktycznie sprzedawane na wagę konopi. E-papierosy i destylat mają poniżej własne sekcje w jednostkach, w których naprawdę się je sprzedaje, a edibles są pominięte, bo podana waga dotyczy jedzenia, a nie zawartości konopi."
  bestValue:
    heading:
      en-GB: "Best value right now"
      de-DE: "Aktuell günstigste Angebote"
      fr-FR: "Les meilleures affaires du moment"
      pt-PT: "As melhores ofertas neste momento"
      it-IT: "Le migliori offerte in questo momento"
      es-ES: "Las mejores ofertas ahora mismo"
      el-GR: "Οι καλύτερες τιμές αυτή τη στιγμή"
      cs-CZ: "Nejvýhodnější nabídky právě teď"
      pl-PL: "Najlepsze okazje w tej chwili"
    intro:
      en-GB: "The cheapest live asking prices per gram, one listing per seller. Bulk shake and trim genuinely undercut everything else, so each category gets its own board rather than one shake-dominated list."
      de-DE: "Die günstigsten aktuellen Grammpreise, ein Angebot pro Verkäufer. Shake und Trim in großen Mengen unterbieten alles andere deutlich, deshalb bekommt jede Kategorie ihre eigene Tabelle statt einer von Shake dominierten Liste."
      fr-FR: "Les prix demandés au gramme les plus bas en direct, une annonce par vendeur. Le shake et le trim en gros cassent vraiment les prix, donc chaque catégorie a son propre tableau plutôt qu'une seule liste dominée par le shake."
      pt-PT: "Os preços pedidos por grama mais baixos em tempo real, um anúncio por vendedor. O shake e o trim a granel ficam mesmo abaixo de tudo o resto, por isso cada categoria tem o seu próprio quadro em vez de uma lista dominada pelo shake."
      it-IT: "I prezzi richiesti al grammo più bassi in tempo reale, un annuncio per venditore. Shake e trim all'ingrosso costano davvero meno di tutto il resto, quindi ogni categoria ha la sua classifica invece di un'unica lista dominata dallo shake."
      es-ES: "Los precios pedidos por gramo más bajos en directo, un anuncio por vendedor. El shake y el trim a granel están realmente por debajo de todo lo demás, así que cada categoría tiene su propia tabla en vez de una única lista dominada por el shake."
      el-GR: "Οι χαμηλότερες ζωντανές ζητούμενες τιμές ανά γραμμάριο, μία καταχώριση ανά πωλητή. Το σέικ και το trim σε μεγάλες ποσότητες είναι πράγματι φθηνότερα από όλα τα άλλα, γι' αυτό κάθε κατηγορία έχει τον δικό της πίνακα αντί για μία λίστα με κυρίαρχο το σέικ."
      cs-CZ: "Nejnižší aktuální požadované ceny za gram, jedna nabídka na prodejce. Shake a trim ve větších objemech skutečně podráží všechno ostatní, proto má každá kategorie vlastní tabulku místo jednoho seznamu ovládnutého shakem."
      pl-PL: "Najniższe aktualne ceny ofertowe za gram, jedna oferta na sprzedawcę. Shake i trim w większych ilościach naprawdę biją wszystko inne ceną, dlatego każda kategoria ma własne zestawienie zamiast jednej listy zdominowanej przez shake."
