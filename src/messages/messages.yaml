      cs-CZ: Používejte produkty v plném rozlišení. Spotřebovává více dat, ale vypadá ostřejší.
      pl-PL: Używaj obrazów produktów w pełnej rozdzielczości. Zużywa więcej danych, ale wygląda ostrzej.
