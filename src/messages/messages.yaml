    intro:
      en-GB: "By using BiggyIndex you agree to these terms. They are short because the site is simple — we index listings and display them, nothing more."
      de-DE: "Mit der Nutzung von BiggyIndex stimmen Sie diesen Bedingungen zu. Sie sind kurz, weil die Seite einfach ist – wir indexieren Angebote und zeigen sie an, mehr nicht."
      fr-FR: "En utilisant BiggyIndex, vous acceptez ces conditions. Elles sont courtes parce que le site est simple — nous indexons des annonces et les affichons, rien de plus."
      pt-PT: "Ao usar o BiggyIndex, aceita estes termos. São curtos porque o site é simples — indexamos listagens e mostramo-las, nada mais."
      it-IT: "Utilizzando BiggyIndex accetti questi termini. Sono brevi perché il sito è semplice: indicizziamo gli annunci e li mostriamo, niente di più."
      es-ES: "Al usar BiggyIndex aceptas estos términos. Son breves porque el sitio es sencillo: indexamos anuncios y los mostramos, nada más."
      el-GR: "Χρησιμοποιώντας το BiggyIndex αποδέχεστε αυτούς τους όρους. Είναι σύντομοι επειδή ο ιστότοπος είναι απλός — ευρετηριάζουμε καταχωρίσεις και τις εμφανίζουμε, τίποτα περισσότερο."
      cs-CZ: "Používáním BiggyIndex souhlasíte s těmito podmínkami. Jsou krátké, protože web je jednoduchý — indexujeme nabídky a zobrazujeme je, nic víc."
      pl-PL: "Korzystając z BiggyIndex, akceptujesz niniejszy regulamin. Jest krótki, bo strona jest prosta — indeksujemy oferty i je wyświetlamy, nic więcej."
    sections:
      whatWeAre:
        heading:
          en-GB: "What BiggyIndex is"
          de-DE: "Was BiggyIndex ist"
          fr-FR: "Ce qu’est BiggyIndex"
          pt-PT: "O que é o BiggyIndex"
          it-IT: "Che cos’è BiggyIndex"
          es-ES: "Qué es BiggyIndex"
          el-GR: "Τι είναι το BiggyIndex"
          cs-CZ: "Co je BiggyIndex"
          pl-PL: "Czym jest BiggyIndex"
        body:
          en-GB: "BiggyIndex is an informational index. We collect publicly available Little Biggy listings and present them with search, filtering, and sorting so they are easier to browse. Nothing is bought or sold on this site, and no age-restricted sales take place here — there is no checkout, no payment, and no fulfilment of any kind."
          de-DE: "BiggyIndex ist ein informativer Index. Wir sammeln öffentlich verfügbare Little Biggy Angebote und stellen sie mit Suche, Filtern und Sortierung übersichtlicher dar. Auf dieser Seite wird nichts gekauft oder verkauft, und es finden hier keine altersbeschränkten Verkäufe statt – es gibt keinen Checkout, keine Zahlung und keinerlei Abwicklung."
          fr-FR: "BiggyIndex est un index informatif. Nous collectons des annonces Little Biggy publiquement disponibles et les présentons avec recherche, filtres et tri pour faciliter la navigation. Rien n’est acheté ni vendu sur ce site, et aucune vente soumise à des restrictions d’âge n’y a lieu — il n’y a ni paiement, ni caisse, ni traitement de commande d’aucune sorte."
          pt-PT: "O BiggyIndex é um índice informativo. Recolhemos listagens públicas do Little Biggy e apresentamo-las com pesquisa, filtros e ordenação para facilitar a navegação. Nada é comprado ou vendido neste site, e aqui não ocorrem vendas com restrição de idade — não há checkout, pagamento nem qualquer tipo de processamento de encomendas."
          it-IT: "BiggyIndex è un indice informativo. Raccogliamo annunci Little Biggy pubblicamente disponibili e li presentiamo con ricerca, filtri e ordinamento per renderli più facili da consultare. Su questo sito non si compra né si vende nulla, e non vi avvengono vendite soggette a limiti di età: non c’è checkout, né pagamento, né alcun tipo di evasione degli ordini."
          es-ES: "BiggyIndex es un índice informativo. Recopilamos anuncios públicos de Little Biggy y los presentamos con búsqueda, filtros y ordenación para que sean más fáciles de explorar. En este sitio no se compra ni se vende nada, y aquí no se realizan ventas restringidas por edad: no hay pago, ni caja, ni gestión de pedidos de ningún tipo."
          el-GR: "Το BiggyIndex είναι ένα ενημερωτικό ευρετήριο. Συλλέγουμε δημόσια διαθέσιμες καταχωρίσεις του Little Biggy και τις παρουσιάζουμε με αναζήτηση, φίλτρα και ταξινόμηση για ευκολότερη περιήγηση. Τίποτα δεν αγοράζεται ή πωλείται σε αυτόν τον ιστότοπο, και δεν πραγματοποιούνται εδώ πωλήσεις με όριο ηλικίας — δεν υπάρχει ταμείο, πληρωμή ή οποιαδήποτε διεκπεραίωση παραγγελιών."
          cs-CZ: "BiggyIndex je informační index. Shromažďujeme veřejně dostupné nabídky Little Biggy a zobrazujeme je s vyhledáváním, filtry a řazením, aby se lépe procházely. Na tomto webu se nic nekupuje ani neprodává a neprobíhá zde žádný prodej s věkovým omezením — není tu žádná pokladna, platba ani vyřizování objednávek."
          pl-PL: "BiggyIndex to indeks informacyjny. Zbieramy publicznie dostępne oferty Little Biggy i prezentujemy je z wyszukiwaniem, filtrami i sortowaniem, aby łatwiej było je przeglądać. Na tej stronie nic nie jest kupowane ani sprzedawane i nie odbywa się tu sprzedaż z ograniczeniem wiekowym — nie ma kasy, płatności ani żadnej realizacji zamówień."
      independence:
        heading:
          en-GB: "Independence"
          de-DE: "Unabhängigkeit"
          fr-FR: "Indépendance"
          pt-PT: "Independência"
          it-IT: "Indipendenza"
          es-ES: "Independencia"
          el-GR: "Ανεξαρτησία"
          cs-CZ: "Nezávislost"
          pl-PL: "Niezależność"
        body:
          en-GB: "BiggyIndex is an independent project. We are not affiliated with, endorsed by, or operated by Little Biggy. Listings, seller names, images, and reviews belong to their respective owners and are shown here for reference."
          de-DE: "BiggyIndex ist ein unabhängiges Projekt. Wir sind weder mit Little Biggy verbunden noch von Little Biggy unterstützt oder betrieben. Angebote, Verkäufernamen, Bilder und Bewertungen gehören ihren jeweiligen Eigentümern und werden hier nur zur Information gezeigt."
          fr-FR: "BiggyIndex est un projet indépendant. Nous ne sommes ni affiliés à Little Biggy, ni approuvés ou exploités par Little Biggy. Les annonces, noms de vendeurs, images et avis appartiennent à leurs propriétaires respectifs et sont affichés ici à titre de référence."
          pt-PT: "O BiggyIndex é um projeto independente. Não somos afiliados, aprovados nem operados pelo Little Biggy. As listagens, nomes de vendedores, imagens e avaliações pertencem aos respetivos donos e são mostradas aqui apenas para referência."
          it-IT: "BiggyIndex è un progetto indipendente. Non siamo affiliati a Little Biggy, né approvati o gestiti da Little Biggy. Annunci, nomi dei venditori, immagini e recensioni appartengono ai rispettivi proprietari e sono mostrati qui a titolo di riferimento."
          es-ES: "BiggyIndex es un proyecto independiente. No estamos afiliados a Little Biggy, ni respaldados ni operados por Little Biggy. Los anuncios, nombres de vendedores, imágenes y reseñas pertenecen a sus respectivos dueños y se muestran aquí como referencia."
          el-GR: "Το BiggyIndex είναι ένα ανεξάρτητο έργο. Δεν συνδεόμαστε με το Little Biggy, ούτε έχουμε την έγκρισή του, ούτε λειτουργούμε από αυτό. Οι καταχωρίσεις, τα ονόματα πωλητών, οι εικόνες και οι κριτικές ανήκουν στους αντίστοιχους ιδιοκτήτες τους και εμφανίζονται εδώ για αναφορά."
          cs-CZ: "BiggyIndex je nezávislý projekt. Nejsme spojeni s Little Biggy, nejsme jím schváleni ani provozováni. Nabídky, jména prodejců, obrázky a recenze patří svým vlastníkům a jsou zde zobrazeny pro informaci."
          pl-PL: "BiggyIndex to niezależny projekt. Nie jesteśmy powiązani z Little Biggy, ani przez niego wspierani czy prowadzeni. Oferty, nazwy sprzedawców, zdjęcia i recenzje należą do ich właścicieli i są tu pokazywane wyłącznie informacyjnie."
      accuracy:
        heading:
          en-GB: "Accuracy is not guaranteed"
          de-DE: "Keine Garantie für Richtigkeit"
          fr-FR: "L’exactitude n’est pas garantie"
          pt-PT: "A exatidão não é garantida"
          it-IT: "L’accuratezza non è garantita"
          es-ES: "La exactitud no está garantizada"
          el-GR: "Η ακρίβεια δεν είναι εγγυημένη"
          cs-CZ: "Přesnost není zaručena"
          pl-PL: "Dokładność nie jest gwarantowana"
        body:
          en-GB: "Listings change frequently and our index refreshes on a schedule, so prices, availability, shipping options, and review counts may be out of date or incorrect. Always check the original listing before relying on anything shown here. The site is provided as-is, without warranties of any kind."
          de-DE: "Angebote ändern sich häufig und unser Index wird nach Zeitplan aktualisiert. Preise, Verfügbarkeit, Versandoptionen und Bewertungszahlen können daher veraltet oder falsch sein. Prüfen Sie immer das Original-Angebot, bevor Sie sich auf etwas verlassen, das hier angezeigt wird. Die Seite wird ohne Gewähr und ohne jegliche Garantien bereitgestellt."
          fr-FR: "Les annonces changent fréquemment et notre index se met à jour selon un calendrier. Les prix, la disponibilité, les options de livraison et le nombre d’avis peuvent donc être obsolètes ou incorrects. Vérifiez toujours l’annonce d’origine avant de vous fier à ce qui est affiché ici. Le site est fourni tel quel, sans aucune garantie."
          pt-PT: "As listagens mudam com frequência e o nosso índice atualiza-se segundo um calendário, pelo que preços, disponibilidade, opções de envio e número de avaliações podem estar desatualizados ou incorretos. Verifique sempre o anúncio original antes de confiar em algo mostrado aqui. O site é fornecido tal como está, sem garantias de qualquer tipo."
          it-IT: "Gli annunci cambiano spesso e il nostro indice si aggiorna secondo un calendario, quindi prezzi, disponibilità, opzioni di spedizione e numero di recensioni potrebbero essere obsoleti o errati. Controlla sempre l’annuncio originale prima di fare affidamento su ciò che è mostrato qui. Il sito è fornito così com’è, senza garanzie di alcun tipo."
          es-ES: "Los anuncios cambian con frecuencia y nuestro índice se actualiza según un calendario, así que los precios, la disponibilidad, las opciones de envío y el número de reseñas pueden estar desactualizados o ser incorrectos. Comprueba siempre el anuncio original antes de confiar en lo que se muestra aquí. El sitio se ofrece tal cual, sin garantías de ningún tipo."
          el-GR: "Οι καταχωρίσεις αλλάζουν συχνά και το ευρετήριό μας ανανεώνεται βάσει προγράμματος, οπότε οι τιμές, η διαθεσιμότητα, οι επιλογές αποστολής και ο αριθμός κριτικών μπορεί να είναι παρωχημένα ή λανθασμένα. Ελέγχετε πάντα την αρχική καταχώριση πριν βασιστείτε σε οτιδήποτε εμφανίζεται εδώ. Ο ιστότοπος παρέχεται ως έχει, χωρίς καμία εγγύηση."
          cs-CZ: "Nabídky se často mění a náš index se obnovuje podle plánu, takže ceny, dostupnost, možnosti dopravy a počty recenzí mohou být zastaralé nebo nesprávné. Před tím, než se na cokoli zde zobrazené spolehnete, vždy zkontrolujte původní nabídku. Web je poskytován tak, jak je, bez jakýchkoli záruk."
          pl-PL: "Oferty często się zmieniają, a nasz indeks odświeża się według harmonogramu, więc ceny, dostępność, opcje wysyłki i liczba recenzji mogą być nieaktualne lub błędne. Zawsze sprawdzaj oryginalną ofertę, zanim się na czymś stąd oprzesz. Strona jest udostępniana taka, jaka jest, bez żadnych gwarancji."
      outboundLinks:
        heading:
          en-GB: "Outbound links"
          de-DE: "Ausgehende Links"
          fr-FR: "Liens sortants"
          pt-PT: "Ligações externas"
          it-IT: "Link in uscita"
          es-ES: "Enlaces salientes"
          el-GR: "Εξωτερικοί σύνδεσμοι"
          cs-CZ: "Odchozí odkazy"
          pl-PL: "Linki zewnętrzne"
        body:
          en-GB: "Links from items and sellers lead to Little Biggy. Once you leave BiggyIndex you are subject to that site's own terms, and we are not responsible for anything that happens there, including any transaction."
          de-DE: "Links von Artikeln und Verkäufern führen zu Little Biggy. Sobald Sie BiggyIndex verlassen, gelten die Bedingungen dieser Seite, und wir sind für nichts verantwortlich, was dort passiert – einschließlich jeglicher Transaktionen."
          fr-FR: "Les liens des articles et des vendeurs mènent vers Little Biggy. Une fois que vous quittez BiggyIndex, vous êtes soumis aux conditions de ce site, et nous ne sommes pas responsables de ce qui s’y passe, y compris toute transaction."
          pt-PT: "As ligações dos itens e vendedores levam ao Little Biggy. Assim que sai do BiggyIndex, fica sujeito aos termos desse site, e não somos responsáveis por nada do que lá acontece, incluindo qualquer transação."
          it-IT: "I link degli articoli e dei venditori portano a Little Biggy. Una volta lasciato BiggyIndex sei soggetto ai termini di quel sito, e non siamo responsabili di nulla di ciò che vi accade, comprese eventuali transazioni."
          es-ES: "Los enlaces de artículos y vendedores llevan a Little Biggy. En cuanto sales de BiggyIndex quedas sujeto a los términos de ese sitio, y no somos responsables de nada de lo que ocurra allí, incluida cualquier transacción."
          el-GR: "Οι σύνδεσμοι από προϊόντα και πωλητές οδηγούν στο Little Biggy. Μόλις φύγετε από το BiggyIndex, υπόκεισθε στους όρους εκείνου του ιστότοπου, και δεν φέρουμε ευθύνη για οτιδήποτε συμβεί εκεί, συμπεριλαμβανομένης οποιασδήποτε συναλλαγής."
          cs-CZ: "Odkazy z položek a prodejců vedou na Little Biggy. Jakmile opustíte BiggyIndex, platí podmínky daného webu a my neneseme odpovědnost za nic, co se tam stane, včetně jakékoli transakce."
          pl-PL: "Linki z przedmiotów i sprzedawców prowadzą do Little Biggy. Gdy opuścisz BiggyIndex, obowiązują Cię warunki tamtej strony, a my nie odpowiadamy za nic, co się tam dzieje, w tym za żadną transakcję."
      yourResponsibility:
        heading:
          en-GB: "Your responsibility"
          de-DE: "Ihre Verantwortung"
          fr-FR: "Votre responsabilité"
          pt-PT: "A sua responsabilidade"
          it-IT: "La tua responsabilità"
          es-ES: "Tu responsabilidad"
          el-GR: "Η δική σας ευθύνη"
          cs-CZ: "Vaše odpovědnost"
          pl-PL: "Twoja odpowiedzialność"
        body:
          en-GB: "You are responsible for ensuring that anything you do after leaving this site complies with the laws that apply where you live."
          de-DE: "Sie sind dafür verantwortlich, dass alles, was Sie nach dem Verlassen dieser Seite tun, den an Ihrem Wohnort geltenden Gesetzen entspricht."
          fr-FR: "Il vous appartient de vous assurer que tout ce que vous faites après avoir quitté ce site est conforme aux lois en vigueur là où vous vivez."
          pt-PT: "É responsável por garantir que tudo o que fizer depois de sair deste site cumpre as leis aplicáveis onde vive."
          it-IT: "Sei responsabile di assicurarti che tutto ciò che fai dopo aver lasciato questo sito rispetti le leggi in vigore dove vivi."
          es-ES: "Eres responsable de asegurarte de que todo lo que hagas tras salir de este sitio cumpla con las leyes que se aplican donde vives."
          el-GR: "Είστε υπεύθυνοι να διασφαλίσετε ότι οτιδήποτε κάνετε αφού φύγετε από αυτόν τον ιστότοπο συμμορφώνεται με τους νόμους που ισχύουν εκεί όπου ζείτε."
          cs-CZ: "Jste odpovědní za to, že vše, co po opuštění tohoto webu uděláte, bude v souladu se zákony platnými v místě, kde žijete."
          pl-PL: "Odpowiadasz za to, aby wszystko, co zrobisz po opuszczeniu tej strony, było zgodne z prawem obowiązującym tam, gdzie mieszkasz."
      changes:
        heading:
          en-GB: "Changes to these terms"
          de-DE: "Änderungen dieser Bedingungen"
          fr-FR: "Modifications de ces conditions"
          pt-PT: "Alterações a estes termos"
          it-IT: "Modifiche a questi termini"
          es-ES: "Cambios en estos términos"
          el-GR: "Αλλαγές στους όρους"
          cs-CZ: "Změny těchto podmínek"
          pl-PL: "Zmiany regulaminu"
        body:
          en-GB: "We may update these terms from time to time, and the latest version always lives on this page. If something looks wrong, contact us via the suggestion feature."
          de-DE: "Wir können diese Bedingungen von Zeit zu Zeit aktualisieren; die neueste Version steht immer auf dieser Seite. Wenn etwas falsch aussieht, kontaktieren Sie uns über die Korrekturvorschlag-Funktion."
          fr-FR: "Nous pouvons mettre à jour ces conditions de temps à autre, et la dernière version se trouve toujours sur cette page. Si quelque chose vous semble incorrect, contactez-nous via la fonction de suggestion."
