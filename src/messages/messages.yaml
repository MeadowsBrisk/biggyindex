    about:
      items:
        whatIs:
          q:
            en-GB: What is the Biggy Index?
            de-DE: Was ist der Biggy Index?
            fr-FR: Qu’est-ce que le Biggy Index ?
            pt-PT: O que é o Biggy Index?
            it-IT: Che cos'è il Biggy Index?
            es-ES: ¿Qué es el Biggy Index?
            el-GR: Τι είναι το Biggy Index;
            cs-CZ: Co je Biggy Index?
            pl-PL: Czym jest Biggy Index?
          a:
            en-GB: The Biggy Index provides an easier way to browse the Little Biggy marketplace, with item categorisation, additional sorting options, and other handy tools tailored for UK shoppers.
            en-IE: The Biggy Index provides an easier way to browse the Little Biggy marketplace, with item categorisation, additional sorting options, and other handy tools tailored for shoppers in Ireland.
            de-DE: Der Biggy Index bietet eine einfachere Möglichkeit, den Little Biggy Marktplatz zu durchsuchen, mit Artikelkategorisierung, zusätzlichen Sortieroptionen und anderen praktischen Werkzeugen, die auf Käufer in Deutschland zugeschnitten sind.
            fr-FR: Le Biggy Index offre un moyen plus simple de naviguer sur le marché Little Biggy, avec la catégorisation des articles, des options de tri supplémentaires et d’autres outils pratiques adaptés aux acheteurs en France.
            pt-PT: O Biggy Index oferece uma forma mais fácil de navegar pelo mercado Little Biggy, com categorização de artigos, opções adicionais de triagem e outras ferramentas úteis adaptadas aos compradores em Portugal.
            it-IT: Il Biggy Index offre un modo più semplice per navigare nel mercato Little Biggy, con categorizzazione degli articoli, opzioni aggiuntive di ordinamento e altri strumenti utili pensati per gli acquirenti in Italia.
            es-ES: El Biggy Index ofrece una forma más sencilla de navegar por el mercado Little Biggy, con categorización de artículos, opciones adicionales de clasificación y otras herramientas útiles adaptadas a los compradores en España.
            el-GR: Το Biggy Index παρέχει έναν ευκολότερο τρόπο περιήγησης στην αγορά Little Biggy, με κατηγοριοποίηση αντικειμένων, πρόσθετες επιλογές ταξινόμησης και άλλα εύχρηστα εργαλεία προσαρμοσμένα για αγοραστές στην Ελλάδα.
            cs-CZ: Biggy Index poskytuje jednodušší způsob procházení Little Biggy tržiště, s kategorizací položek, dalšími možnostmi třídění a dalšími užitečnými nástroji přizpůsobenými zákazníkům v Česku.
            pl-PL: Biggy Index ułatwia przeglądanie rynku Little Biggy, oferując kategoryzację produktów, dodatkowe opcje sortowania oraz inne przydatne narzędzia dostosowane do klientów w Polsce.
            en-NL: The Biggy Index provides an easier way to browse the Little Biggy marketplace, with item categorisation, additional sorting options, and other handy tools tailored for shoppers in the Netherlands.
        sellOrShip:
          q:
            en-GB: Do you sell or ship items?
            de-DE: Verkaufst oder verschickst du Gegenstände?
            fr-FR: Vendez-vous ou expédiez-vous des articles ?
            pt-PT: Vendes ou envias itens?
            it-IT: Vendi o spedisci oggetti?
            es-ES: ¿Vendes o envías objetos?
            el-GR: Πουλάτε ή αποστέλλετε αντικείμενα;
            cs-CZ: Prodáváte nebo posíláte předměty?
            pl-PL: Czy sprzedajecie czy wysyłacie przedmioty?
          a:
            en-GB: No. Biggy Index is read-only and sends you back to Little Biggy to complete your order.
            de-DE: Nein. Biggy Index ist schreibgeschützt und schickt dich zurück zu Little Biggy, um deine Bestellung abzuschließen.
            fr-FR: Non. Biggy Index est en lecture seule et vous renvoie vers Little Biggy pour finaliser votre commande.
            pt-PT: Não. Biggy Index é só leitura e envia-te de volta para Little Biggy para completar a tua encomenda.
            it-IT: No. Biggy Index è in sola lettura e ti rimanda indietro da Little Biggy per completare il tuo ordine.
            es-ES: No. Biggy Index es de solo lectura y te envía de vuelta a Little Biggy para completar tu pedido.
            el-GR: Όχι. Biggy Index είναι μόνο για ανάγνωση και σας στέλνει πίσω στο Little Biggy για να ολοκληρώσετε την παραγγελία σας.
            cs-CZ: Ne. Biggy Index je pouze pro čtení a posílá vás zpět do Little Biggy, abyste dokončili objednávku.
            pl-PL: Nie. Biggy Index jest tylko do odczytu i odsyła cię z powrotem do Little Biggy, aby dokończyć zamówienie.
        # The canonical-link list renders under this answer (FaqSection's
        # VERIFY_LINKS_FAQ_KEY). The homepage has no SiteHeader, so this is the
        # only above-the-footer route to those links there. Keep the answer
        # link-free prose — the links are rendered separately, not inlined.
        realSite:
          q:
            en-GB: How do I know I'm on the real Little Biggy?
            de-DE: Woher weiß ich, dass ich auf dem echten Little Biggy bin?
            fr-FR: Comment savoir si je suis sur le vrai Little Biggy ?
            pt-PT: Como sei que estou no Little Biggy verdadeiro?
            it-IT: Come faccio a sapere se sono sul vero Little Biggy?
            es-ES: ¿Cómo sé que estoy en el Little Biggy real?
            el-GR: Πώς ξέρω ότι βρίσκομαι στο πραγματικό Little Biggy;
            cs-CZ: Jak poznám, že jsem na skutečném Little Biggy?
            pl-PL: Skąd mam wiedzieć, że jestem na prawdziwym Little Biggy?
          a:
            en-GB: Phishing clones of Little Biggy exist, so it is worth checking. The pages below are Little Biggy's own canonical sources — canon borg posts announcements and PGP keys, and the federation page lists the verified mirror domains and onion address to use if the main site is unreachable. Bookmark littlebiggy.org rather than trusting search results on other extensions.
            de-DE: Es gibt Phishing-Klone von Little Biggy, deshalb lohnt sich eine Prüfung. Die folgenden Seiten sind Little Biggys eigene kanonische Quellen — canon borg veröffentlicht Ankündigungen und PGP-Schlüssel, und die Federation-Seite listet die geprüften Mirror-Domains und die Onion-Adresse für den Fall, dass die Hauptseite nicht erreichbar ist. Setze ein Lesezeichen auf littlebiggy.org, statt Suchergebnissen mit anderen Endungen zu vertrauen.
            fr-FR: Des clones de phishing de Little Biggy existent, il vaut donc la peine de vérifier. Les pages ci-dessous sont les sources canoniques de Little Biggy — canon borg publie les annonces et les clés PGP, et la page federation liste les domaines miroirs vérifiés ainsi que l'adresse onion à utiliser si le site principal est injoignable. Mettez littlebiggy.org en favori plutôt que de vous fier aux résultats de recherche sur d'autres extensions.
            pt-PT: Existem clones de phishing do Little Biggy, por isso vale a pena verificar. As páginas abaixo são as fontes canónicas do próprio Little Biggy — o canon borg publica anúncios e chaves PGP, e a página federation lista os domínios espelho verificados e o endereço onion a usar se o site principal estiver inacessível. Guarda littlebiggy.org nos favoritos em vez de confiares em resultados de pesquisa noutras extensões.
            it-IT: Esistono cloni di phishing di Little Biggy, quindi vale la pena verificare. Le pagine qui sotto sono le fonti canoniche di Little Biggy — canon borg pubblica annunci e chiavi PGP, e la pagina federation elenca i domini mirror verificati e l'indirizzo onion da usare se il sito principale è irraggiungibile. Aggiungi littlebiggy.org ai preferiti invece di fidarti dei risultati di ricerca su altre estensioni.
            es-ES: Existen clones de phishing de Little Biggy, así que conviene comprobarlo. Las páginas siguientes son las fuentes canónicas del propio Little Biggy — canon borg publica anuncios y claves PGP, y la página federation lista los dominios espejo verificados y la dirección onion que usar si el sitio principal no está accesible. Guarda littlebiggy.org en marcadores en lugar de fiarte de resultados de búsqueda con otras extensiones.
            el-GR: Υπάρχουν κλώνοι phishing του Little Biggy, οπότε αξίζει να ελέγξετε. Οι παρακάτω σελίδες είναι οι κανονικές πηγές του ίδιου του Little Biggy — ο canon borg δημοσιεύει ανακοινώσεις και κλειδιά PGP, και η σελίδα federation παραθέτει τους επαληθευμένους κατοπτρικούς τομείς και τη διεύθυνση onion για την περίπτωση που ο κύριος ιστότοπος δεν είναι προσβάσιμος. Αποθηκεύστε το littlebiggy.org στους σελιδοδείκτες αντί να εμπιστεύεστε αποτελέσματα αναζήτησης με άλλες καταλήξεις.
            cs-CZ: Existují phishingové klony Little Biggy, takže se vyplatí ověřit. Níže uvedené stránky jsou vlastní kanonické zdroje Little Biggy — canon borg zveřejňuje oznámení a PGP klíče a stránka federation uvádí ověřené zrcadlové domény a onion adresu pro případ, že hlavní web není dostupný. Přidejte si littlebiggy.org do záložek místo spoléhání na výsledky vyhledávání s jinými koncovkami.
            pl-PL: Istnieją phishingowe klony Little Biggy, więc warto sprawdzić. Poniższe strony to własne kanoniczne źródła Little Biggy — canon borg publikuje ogłoszenia i klucze PGP, a strona federation wymienia zweryfikowane domeny lustrzane oraz adres onion na wypadek, gdyby główna witryna była niedostępna. Dodaj littlebiggy.org do zakładek zamiast ufać wynikom wyszukiwania z innymi końcówkami.
        dataSource:
          q:
            en-GB: Where does the data come from?
            de-DE: Woher stammen die Daten?
            fr-FR: D’où viennent ces données ?
            pt-PT: De onde vêm os dados?
            it-IT: Da dove provengono i dati?
            es-ES: ¿De dónde provienen los datos?
            el-GR: Από πού προέρχονται τα δεδομένα;
            cs-CZ: Odkud data pocházejí?
            pl-PL: Skąd pochodzą te dane?
          a:
            en-GB: The index fetches public Little Biggy data, normalising categories, pricing summaries, shipping info, reviews and images.
            de-DE: Der Index enthält öffentliche Little Biggy Daten, normalisiert Kategorien, Preisübersichten, Versandinformationen, Bewertungen und Bilder.
            fr-FR: L’index collecte les données de Little Biggy publiques, normalise les catégories, les résumés des prix, les informations sur les livraisons, les avis et les images.
            pt-PT: O índice recolhe dados de Little Biggy públicas, normalizando categorias, resumos de preços, informações de envio, avaliações e imagens.
            it-IT: L'indice raccoglie dati di Little Biggy pubblici, normalizzando le categorie, riassunti dei prezzi, informazioni sulle spedizioni, recensioni e immagini.
            es-ES: El índice recopila datos de Little Biggy públicas, normalizando categorías, resúmenes de precios, información de envíos, opiniones e imágenes.
            el-GR: Το ευρετήριο ανακτά δεδομένα δημόσιας Little Biggy, κανονικοποίηση κατηγοριών, περιλήψεις τιμών, πληροφορίες αποστολής, κριτικές και εικόνες.
            cs-CZ: Index získává veřejná Little Biggy data, normalizuje kategorie, shrnutí cen, informace o dopravě, recenze a obrázky.
            pl-PL: Indeks pobiera dane Little Biggy publiczne, normalizując kategorie, podsumowania cen, informacje o przesyłce, recenzje i obrazy.
        refreshRate:
          q:
            en-GB: How often is it refreshed?
            de-DE: Wie oft wird es erneuert?
            fr-FR: À quelle fréquence est-elle rafraîchie ?
            pt-PT: Com que frequência é renovada?
            it-IT: Quanto spesso viene rinnovata?
            es-ES: ¿Con qué frecuencia se renueva la actualización?
            el-GR: Πόσο συχνά ανανεώνεται;
            cs-CZ: Jak často se obnovuje?
            pl-PL: Jak często jest odświeżany?
          a:
            en-GB: There are 3 components that refresh at different intervals. The main indexer runs every 30 minutes. The item and seller crawlers run every 4 hours, at separate times to be mindful of Little Biggy's server.
            de-DE: Es gibt 3 Komponenten, die in unterschiedlichen Abständen aktualisieren. Der Hauptindexer läuft alle 30 Minuten. Der Item- und Verkäufer-Crawler läuft alle 4 Stunden, zu unterschiedlichen Zeiten, um auf den Server von Little Biggy zu achten.
            fr-FR: Il y a 3 composants qui se rafraîchissent à des intervalles différents. L’indexeur principal s’exécute toutes les 30 minutes. Les robots d’identification d’objets et de vendeurs s’exécutent toutes les 4 heures, à des moments différents pour être attentif au serveur de Little Biggy.
            pt-PT: Existem 3 componentes que atualizam em intervalos diferentes. O indexador principal corre a cada 30 minutos. Os rastreadores de itens e vendedores executam-se a cada 4 horas, em momentos separados para estar atento ao servidor da Little Biggy.
            it-IT: Ci sono 3 componenti che si aggiornano a intervalli diversi. L'indicizzatore principale viene eseguito ogni 30 minuti. Il crawler di oggetti e venditori si attiva ogni 4 ore, in orari separati per tenere conto del server di Little Biggy.
            es-ES: Hay 3 componentes que se actualizan en diferentes intervalos. El indexador principal se ejecuta cada 30 minutos. El rastreador de objetos y vendedores se ejecuta cada 4 horas, en momentos distintos para tener en cuenta el servidor de Little Biggy.
            el-GR: Υπάρχουν 3 στοιχεία που ανανεώνονται σε διαφορετικά διαστήματα. Το κύριο ευρετήριο εκτελείται κάθε 30 λεπτά. Τα προγράμματα ανίχνευσης στοιχείων και πωλητών εκτελούνται κάθε 4 ώρες, σε ξεχωριστές ώρες για να έχουν υπόψη τους τον διακομιστή του Little Biggy.
            cs-CZ: Jsou zde 3 komponenty, které se obnovují v různých intervalech. Hlavní indexer běží každých 30 minut. Crawlery pro zboží a prodejce běží každé 4 hodiny, v oddělených časech, aby byly ohleduplné k serveru Little Biggy.
            pl-PL: Są 3 komponenty, które odświeżają się w różnych odstępach czasu. Główny indeksator uruchamiany jest co 30 minut. Crawlery do przedmiotów i sprzedawców uruchamiają się co 4 godziny, w różnych godzinach, aby mieć na uwadze serwer Little Biggy.
        timestamps:
          q:
            en-GB: What does First Seen or Updated on items mean?
            de-DE: Was bedeutet 'Zuerst gesehen' oder 'Aktualisiert' bei Gegenständen?
            fr-FR: Que signifie « Vu pour la première fois » ou mis à jour sur les objets ?
            pt-PT: O que significa Primeiro Visto ou Atualizado sobre os itens?
            it-IT: Cosa significa Prima Vista o Aggiornata sugli oggetti?
            es-ES: ¿Qué significa Primero Visto o Actualizado en los artículos?
            el-GR: Τι σημαίνει Πρώτη εμφάνιση ή ενημέρωση σε αντικείμενα;
            cs-CZ: Co znamená První viděno nebo Aktualizováno předmětů?
            pl-PL: Co oznacza Pierwszy raz zobaczony lub zaktualizowany o przedmiotach?
          a:
            en-GB: First seen/created means that it's the first time the item was indexed by the crawler. This can include items which were on LB before the indexer existed. Updated means that the item was edited by the seller, or that the crawler detected a change (e.g. price, variants, description).
            de-DE: Zuerst gesehen/erstellt bedeutet, dass der Artikel zum ersten Mal vom Crawler indexiert wurde. Dies kann auch Artikel umfassen, die bereits auf LB waren, bevor der Indexer existierte. Aktualisiert bedeutet, dass der Artikel vom Verkäufer bearbeitet wurde oder dass der Crawler eine Änderung erkannt hat (z. B. Preis, Varianten, Beschreibung).
            fr-FR: Vu ou créé en premier signifie que c’est la première fois que l’objet est indexé par le robot. Cela peut inclure les éléments qui étaient sur LB avant l’existence de l’indexeur. Mis à jour signifie que l’article a été modifié par le vendeur, ou que le crawler a détecté un changement (par exemple, prix, variantes, description).
            pt-PT: Primeiro visto/criado significa que é a primeira vez que o item foi indexado pelo crawler. Isto pode incluir itens que estavam no LB antes do indexador existir. Atualizado significa que o item foi editado pelo vendedor, ou que o crawler detetou uma alteração (por exemplo, preço, variantes, descrição).
            it-IT: Prima vista/creata significa che è la prima volta che l'oggetto è stato indicizzato dal crawler. Questo può includere elementi che erano su LB prima che l'indicizzatore esistesse. Aggiornato significa che l'articolo è stato modificato dal venditore, o che il crawler ha rilevato un cambiamento (ad esempio prezzo, varianti, descrizione).
            es-ES: Primero visto/creado significa que es la primera vez que el objeto fue indexado por el rastreador. Esto puede incluir elementos que estaban en LB antes de que existiera el indexador. Actualizado significa que el artículo fue editado por el vendedor, o que el rastreador detectó un cambio (por ejemplo, precio, variantes, descripción).
            el-GR: Πρώτη εμφάνιση/δημιουργία σημαίνει ότι είναι η πρώτη φορά που το στοιχείο ευρετηριάστηκε από τον ανιχνευτή. Αυτό μπορεί να περιλαμβάνει στοιχεία που βρίσκονταν στο LB πριν από την ύπαρξη του ευρετηρίου. Ενημερώθηκε σημαίνει ότι το στοιχείο υποβλήθηκε σε επεξεργασία από τον πωλητή ή ότι ο ανιχνευτής εντόπισε μια αλλαγή (π.χ. τιμή, παραλλαγές, περιγραφή).
            cs-CZ: První viděn/vytvořený znamená, že je to poprvé, co byla položka indexována crawlerem. To může zahrnovat položky, které byly na LB před vznikem indexeru. Aktualizováno znamená, že položku upravil prodejce, nebo že crawler zaznamenal změnu (např. cena, varianty, popis).
            pl-PL: Pierwszy raz zobaczony/utworzony oznacza, że crawler zaindeksował dany przedmiot po raz pierwszy. Może to obejmować pozycje, które były na LB przed pojawieniem się indeksera. Aktualizacja oznacza, że produkt został edytowany przez sprzedawcę lub że crawler wykrył zmianę (np. cenę, warianty, opis).
        endorsements:
          q:
            en-GB: What are seller endorsements and reports?
            de-DE: Was sind Verkäufer-Empfehlungen und -Meldungen?
            fr-FR: Que sont les recommandations et les signalements de vendeurs ?
            pt-PT: O que são recomendações e denúncias de vendedores?
            it-IT: Cosa sono le raccomandazioni e le segnalazioni sui venditori?
            es-ES: ¿Qué son las recomendaciones y las denuncias de vendedores?
            el-GR: Τι είναι οι συστάσεις και οι αναφορές για πωλητές;
            cs-CZ: Co jsou doporučení a nahlášení prodejců?
            pl-PL: Czym są polecenia i zgłoszenia sprzedawców?
          a:
            en-GB: "Feedback you can leave on a seller's profile: endorse one you had a good experience with, or report one you didn't. A human moderator checks every submission before it appears, and the totals sit on the seller's page beside their review stats."
            de-DE: "Feedback, das Sie im Profil eines Verkäufers hinterlassen können: empfehlen Sie einen Verkäufer mit guter Erfahrung oder melden Sie einen mit schlechter. Ein menschlicher Moderator prüft jede Einreichung, bevor sie erscheint, und die Summen stehen auf der Verkäuferseite neben den Bewertungsstatistiken."
            fr-FR: "Des retours que vous pouvez laisser sur la fiche d'un vendeur : recommandez celui avec qui l'expérience a été bonne, signalez celui avec qui elle ne l'a pas été. Un modérateur humain vérifie chaque envoi avant sa publication, et les totaux figurent sur la page du vendeur, à côté de ses statistiques d'avis."
            pt-PT: "Feedback que pode deixar no perfil de um vendedor: recomende aquele com quem teve uma boa experiência ou denuncie aquele com quem não teve. Um moderador humano verifica cada submissão antes de aparecer, e os totais ficam na página do vendedor, ao lado das estatísticas de avaliações."
            it-IT: "Feedback che puoi lasciare sul profilo di un venditore: raccomanda chi ti ha dato una buona esperienza o segnala chi no. Un moderatore umano controlla ogni invio prima che venga pubblicato, e i totali compaiono sulla pagina del venditore, accanto alle statistiche delle recensioni."
            es-ES: "Opiniones que puedes dejar en el perfil de un vendedor: recomienda a aquel con quien tuviste una buena experiencia o denuncia a aquel con quien no. Un moderador humano revisa cada envío antes de publicarse, y los totales aparecen en la página del vendedor, junto a sus estadísticas de reseñas."
            el-GR: "Σχόλια που μπορείτε να αφήσετε στο προφίλ ενός πωλητή: συστήστε όποιον σας εξυπηρέτησε καλά ή αναφέρετε όποιον όχι. Κάθε υποβολή ελέγχεται από άνθρωπο συντονιστή πριν εμφανιστεί, και τα σύνολα βρίσκονται στη σελίδα του πωλητή, δίπλα στα στατιστικά των κριτικών του."
            cs-CZ: "Zpětná vazba, kterou můžete zanechat na profilu prodejce: doporučte toho, s nímž jste měli dobrou zkušenost, nebo nahlaste toho, s nímž ne. Každé odeslání před zveřejněním zkontroluje lidský moderátor a součty najdete na stránce prodejce vedle statistik recenzí."
            pl-PL: "Opinie, które możesz zostawić w profilu sprzedawcy: poleć tego, z którym miałeś dobre doświadczenie, lub zgłoś tego, z którym nie. Każde zgłoszenie sprawdza moderator, zanim się pojawi, a sumy znajdują się na stronie sprzedawcy obok statystyk recenzji."
        # IE edition only. The answer must stay true without the computed
        # figures — the JSON-LD copy of it takes no ICU values.
        shipsToIreland:
          q:
            en-GB: Does Little Biggy ship to Ireland?
          a:
            en-GB: Yes. Sellers on Little Biggy post to Irish addresses, and this edition only indexes listings a seller will actually send here — the catalogue, the postage and the reported delivery times are all the Irish ones, not the UK ones. Postage is set per order by the seller, so the shipping options on the listing itself are what apply at checkout.
    bitcoin:
      items:
        payments:
          q:
            en-GB: What payments does Little Biggy accept?
            de-DE: Welche Zahlungen akzeptiert Little Biggy?
            fr-FR: Quels paiements Little Biggy accepte-t-il ?
            pt-PT: Que pagamentos Little Biggy aceita?
            it-IT: Quali pagamenti Little Biggy accetta?
            es-ES: ¿Qué pagos acepta Little Biggy?
            el-GR: Ποιες πληρωμές δέχεται Little Biggy;
            cs-CZ: Jaké platby Little Biggy přijímá?
            pl-PL: Jakie płatności Little Biggy akceptuje?
          a:
            en-GB: Only Bitcoin - no cards, bank transfers or other cryptocurrencies.
            de-DE: Nur Bitcoin – keine Karten, Banküberweisungen oder andere Kryptowährungen.
            fr-FR: Seulement du Bitcoin - pas de cartes, de virements bancaires ou d’autres cryptomonnaies.
            pt-PT: Apenas Bitcoin - sem cartões, transferências bancárias ou outras criptomoedas.
            it-IT: Solo Bitcoin - niente carte, bonifici bancari o altre criptovalute.
            es-ES: Solo Bitcoin, sin tarjetas, transferencias bancarias ni otras criptomonedas.
            el-GR: Μόνο Bitcoin - χωρίς κάρτες, τραπεζικά εμβάσματα ή άλλα κρυπτονομίσματα.
            cs-CZ: Pouze Bitcoin – žádné karty, bankovní převody ani jiné kryptoměny.
            pl-PL: Tylko Bitcoin – żadnych kart, przelewów bankowych ani innych kryptowalut.
        buying:
          q:
            en-GB: How do I buy Bitcoin in the UK?
            en-IE: How do I buy Bitcoin in Ireland?
            de-DE: Wie kaufe ich Bitcoin in Deutschland?
            fr-FR: Comment acheter du Bitcoin en France ?
            pt-PT: Como posso comprar Bitcoin em Portugal?
            it-IT: Come posso acquistare Bitcoin in Italia?
            es-ES: ¿Cómo compro Bitcoin en España?
            el-GR: Πώς μπορώ να αγοράσω Bitcoin στην Ελλάδα;
            cs-CZ: Jak si mohu koupit Bitcoin v Česku?
            pl-PL: Jak kupić Bitcoina w Polsce?
            en-NL: How do I buy Bitcoin in the Netherlands?
          a:
            en-GB: Most buyers use Revolut, Monzo, Kraken, or Coinbase. Top up in pounds, purchase the amount of BTC shown at checkout, and allow a few pounds for network or exchanging fees.
            en-IE: Most buyers use Revolut, Kraken, or Coinbase. Top up in euros, purchase the amount of BTC shown at checkout, and allow a few euro for network or exchanging fees.
            de-DE: Die meisten Käufer nutzen Revolut, Monzo, Kraken oder Coinbase. Laden Sie in Euro auf, kaufen Sie den beim Checkout angezeigten BTC-Betrag und planen Sie ein paar Euro für Netzwerk- oder Umtauschgebühren ein.
            fr-FR: La plupart des acheteurs utilisent Revolut, Monzo, Kraken ou Coinbase. Rechargez en euros, achetez le montant de BTC indiqué au moment du paiement, et prévoyez quelques euros pour les frais de réseau ou d’échange.
            pt-PT: A maioria dos compradores usa Revolut, Monzo, Kraken ou Coinbase. Recarrega em euros, compra o valor de BTC mostrado no checkout e deixa alguns euros para taxas de rede ou de câmbio.
            it-IT: La maggior parte degli acquirenti usa Revolut, Monzo, Kraken o Coinbase. Ricarica in euro, acquista la quantità di BTC mostrata al momento del pagamento e lascia qualche euro per le commissioni di rete o di cambio.
            es-ES: La mayoría de los compradores usan Revolut, Monzo, Kraken o Coinbase. Recarga en euros, compra la cantidad de BTC que aparece en el momento del pago y deja unos pocos euros para comisiones de red o de cambio.
            el-GR: Οι περισσότεροι αγοραστές χρησιμοποιούν Revolut, Monzo, Kraken ή Coinbase. Φορτώστε σε ευρώ, αγοράστε το ποσό BTC που εμφανίζεται στο ταμείο και αφήστε μερικά ευρώ για χρεώσεις δικτύου ή ανταλλαγής.
            cs-CZ: Většina kupujících používá Revolut, Monzo, Kraken nebo Coinbase. Dobijte si účet v korunách, kupte částku BTC zobrazenou při placení a nechte si pár set korun rezervu na síťové a směnné poplatky.
            pl-PL: Większość kupujących korzysta z Revolut, Monzo, Kraken lub Coinbase. Doładuj konto w złotówkach, kup ilość BTC pokazaną przy kasie i zostaw kilkadziesiąt złotych na opłaty sieciowe i wymiany.
            en-NL: Most buyers use Revolut, Kraken, or Coinbase. Top up in euros, purchase the amount of BTC shown at checkout, and allow a few euro for network or exchanging fees.
        wallet:
          q:
            en-GB: Do I need my own wallet first?
            de-DE: Brauche ich zuerst mein eigenes Portemonnaie?
            fr-FR: Ai-je besoin d’abord de mon propre portefeuille ?
            pt-PT: Preciso primeiro da minha própria carteira?
            it-IT: Devo prima avere un portafoglio tutto mio?
            es-ES: ¿Necesito primero mi propia cartera?
            el-GR: Χρειάζομαι πρώτα το δικό μου πορτοφόλι;
            cs-CZ: Potřebuji nejdřív vlastní peněženku?
            pl-PL: Czy najpierw potrzebuję własnego portfela?
          a:
            en-GB: You can pay straight from the exchange, but many people move BTC into a private wallet like Cake Wallet or Trust Wallet for extra privacy. UK exchanges are required to ask where you're sending coins - so some buyers prefer routing via a personal wallet.
            de-DE: Man kann direkt von der Börse bezahlen, aber viele Leute übertragen BTC in eine private Wallet wie Cake Wallet oder Trust Wallet für zusätzliche Privatsphäre. Börsen müssen fragen, wohin man Coins schickt – daher bevorzugen manche Käufer das Routing über eine persönliche Wallet.
            fr-FR: Vous pouvez payer directement depuis la plateforme d’échange, mais beaucoup de gens déplacent le BTC dans un portefeuille privé comme Cake Wallet ou Trust Wallet pour plus d’intimité. Les plateformes d’échange doivent demander où vous envoyez vos coins – donc certains acheteurs préfèrent le routage via un portefeuille personnel.
            pt-PT: Pode pagar diretamente na exchange, mas muitas pessoas transferem BTC para uma carteira privada como a Cake Wallet ou a Trust Wallet para maior privacidade. As exchanges são obrigadas a perguntar para onde está a enviar moedas – por isso alguns compradores preferem o encaminhamento através de uma carteira pessoal.
            it-IT: Puoi pagare direttamente dall'exchange, ma molte persone spostano BTC in un wallet privato come Cake Wallet o Trust Wallet per maggiore privacy. Gli exchange sono tenuti a chiedere dove stai inviando le monete - quindi alcuni acquirenti preferiscono instradare tramite un wallet personale.
            es-ES: Puedes pagar directamente desde el exchange, pero mucha gente mueve BTC a una cartera privada como Cake Wallet o Trust Wallet para mayor privacidad. Los exchanges están obligados a preguntar dónde envías monedas, por lo que algunos compradores prefieren enrutar a través de una cartera personal.
            el-GR: Μπορείτε να πληρώσετε απευθείας από το ανταλλακτήριο, αλλά πολλοί άνθρωποι μεταφέρουν BTC σε ένα ιδιωτικό πορτοφόλι όπως το Cake Wallet ή το Trust Wallet για επιπλέον προστασία της ιδιωτικής ζωής. Τα ανταλλακτήρια πρέπει να ρωτούν πού στέλνετε νομίσματα - έτσι ορισμένοι αγοραστές προτιμούν τη δρομολόγηση μέσω ενός προσωπικού πορτοφολιού.
            cs-CZ: Můžete platit přímo z burzy, ale mnoho lidí přesouvá BTC do soukromé peněženky jako Cake Wallet nebo Trust Wallet pro větší soukromí. Burzy se musí ptát, kam posíláte mince – proto někteří kupující preferují směrování přes osobní peněženku.
            pl-PL: Możesz płacić bezpośrednio na giełdzie, ale wiele osób przenosi BTC do prywatnego portfela, takiego jak Cake Wallet lub Trust Wallet, dla większej prywatności. Giełdy muszą pytać, gdzie wysyłasz monety – dlatego niektórzy kupujący wolą trasowanie przez prywatny portfel.
        escrow:
          q:
            en-GB: How does Transaxe escrow protect me?
            de-DE: Wie schützt Transaxe ein Treuhandkonto für mich?
            fr-FR: Comment Transaxe me protège-t-elle en séquestre ?
            pt-PT: Como é que a Transaxe Escrow me protege?
            it-IT: Come mi protegge Transaxe escrow?
            es-ES: ¿Cómo me protege Transaxe escrow?
            el-GR: Πώς με προστατεύει η μεσεγγύηση Transaxe;
            cs-CZ: Jak mě Transaxe chrání v úschově?
            pl-PL: Jak Transaxe ma możliwość pochowania mnie chronić?
          a:
            en-GB: Your payment goes to a Transaxe escrow address. Sellers have about 80 hours to mark orders as shipped or the funds auto-refund. Disputes open after nine days if needed.
            de-DE: Deine Zahlung geht an eine Transaxe-Treuhandadresse. Verkäufer haben etwa 80 Stunden Zeit, Bestellungen als versandt zu markieren, sonst werden die Gelder automatisch erstattet. Streitigkeiten werden nach neun Tagen eröffnet, falls nötig.
            fr-FR: Votre paiement est dirigé vers une adresse d’entiercement Transaxe. Les vendeurs disposent d’environ 80 heures pour indiquer les commandes comme expédiées ou pour que les fonds soient automatiquement remboursés. Les litiges s’ouvrent après neuf jours si besoin.
            pt-PT: O seu pagamento vai para um endereço de escrow Transaxe. Os vendedores têm cerca de 80 horas para marcar as encomendas como enviadas ou o reembolso automático dos fundos. Disputas abrem após nove dias, se necessário.
            it-IT: Il tuo pagamento va a un indirizzo escrow Transaxe. I venditori hanno circa 80 ore per segnare gli ordini come spediti o per rimborsare automaticamente i fondi. Le contestazioni si aprono dopo nove giorni se necessario.
            es-ES: Tu pago va a una dirección de depósito en garantía de Transaxe. Los vendedores tienen unas 80 horas para marcar los pedidos como enviados o para que los fondos se reembolsen automáticamente. Las disputas se abren después de nueve días si es necesario.
            el-GR: Η πληρωμή σας πηγαίνει σε μια διεύθυνση μεσεγγύησης Transaxe. Οι πωλητές έχουν περίπου 80 ώρες για να επισημάνουν τις παραγγελίες ως απεσταλμένες ή να επιστρέψουν αυτόματα τα χρήματα. Οι διαφωνίες ανοίγουν μετά από εννέα ημέρες, εάν χρειαστεί.
            cs-CZ: Vaše platba jde na Transaxe escrow adresu. Prodávající mají asi 80 hodin na označení objednávek jako odeslaných, jinak se peníze automaticky vrátí. Spory se otevírají po devíti dnech, pokud je to potřeba.
            pl-PL: Twoja płatność trafia na adres depozytu Transaxe. Sprzedawcy mają około 80 godzin na oznaczenie zamówień jako wysłanych lub automatyczne zwroty środków. Spory otwierają się po dziewięciu dniach, jeśli zajdzie taka potrzeba.
        mistakes:
          q:
            en-GB: Any tips to avoid mistakes?
            de-DE: Habt ihr Tipps, wie man Fehler vermeiden kann?
            fr-FR: Des conseils pour éviter les erreurs ?
            pt-PT: Alguma dica para evitar erros?
            it-IT: Qualche consiglio per evitare errori?
            es-ES: ¿Algún consejo para evitar errores?
            el-GR: Κάποιες συμβουλές για την αποφυγή λαθών;
            cs-CZ: Máte nějaké tipy, jak se vyhnout chybám?
            pl-PL: Macie jakieś wskazówki, jak uniknąć błędów?
          a:
            en-GB: Copy-paste the BTC amount and address, add a buffer for fees, and keep screenshots until your parcel arrives. The blockchain cannot undo typos.
            de-DE: Kopiere und füge den BTC-Betrag und die Adresse ein, füge einen Puffer für Gebühren hinzu und bewahre Screenshots auf, bis dein Paket ankommt. Die Blockchain kann Tippfehler nicht rückgängig machen.
            fr-FR: Copier-collez le montant et l’adresse en BTC, ajoutez un tampon pour les frais, et conservez les captures d’écran jusqu’à l’arrivée de votre colis. La blockchain ne peut pas réparer les fautes de frappe.
            pt-PT: Copie e cole o montante e endereço do BTC, adicione um buffer para as taxas e guarde capturas de ecrã até a sua encomenda chegar. A blockchain não pode desfazer erros tipográficos.
            it-IT: Copia e incolla l'importo e l'indirizzo del BTC, aggiungi un buffer per le commissioni e conserva gli screenshot fino all'arrivo del tuo pacco. La blockchain non può annullare gli errori di battitura.
            es-ES: Copia y pega la cantidad y dirección del BTC, añade un buffer para las comisiones y guarda capturas de pantalla hasta que llegue tu paquete. La blockchain no puede deshacer errores tipográficos.
            el-GR: Αντιγράψτε-επικολλήστε το ποσό και τη διεύθυνση BTC, προσθέστε ένα buffer για χρεώσεις και κρατήστε στιγμιότυπα οθόνης μέχρι να φτάσει το δέμα σας. Το blockchain δεν μπορεί να αναιρέσει τυπογραφικά λάθη.
            cs-CZ: Zkopírujte a vložte částku a adresu BTC, přidejte si rezervu pro poplatky a uchovejte si screenshoty, dokud vám balíček nedorazí. Blockchain nemůže napravit překlepy.
            pl-PL: Skopiuj i wklej kwotę BTC i adres, dodaj bufor na opłaty i przechowuj zrzuty ekranu do momentu przybycia przesyłki. Blockchain nie może cofnąć literówek.
        clearnet:
          q:
            en-GB: Why not just use clearnet shops?
            de-DE: Warum nutzt man nicht einfach Clearnet-Shops?
            fr-FR: Pourquoi ne pas simplement utiliser les boutiques clearnet ?
            pt-PT: Porque não usar simplesmente lojas da clearnet?
            it-IT: Perché non usare semplicemente i negozi del clearnet?
            es-ES: ¿Por qué no usar simplemente tiendas de la net?
            el-GR: Γιατί να μην χρησιμοποιήσετε απλώς τα καταστήματα clearnet;
            cs-CZ: Proč prostě nevyužít clearnet obchody?
            pl-PL: Dlaczego po prostu nie korzystać ze sklepów clearnet?
          a:
            en-GB: Competition on Little Biggy keeps quality high and prices fair. Clearnet resellers often charge heavy markups or ship questionable stock.
            de-DE: Der Wettbewerb auf Little Biggy hält die Qualität hoch und die Preise fair. Clearnet-Reseller verlangen oft hohe Aufschläge oder verschicken fragwürdige Bestände.
            fr-FR: La concurrence sur Little Biggy maintient une qualité élevée et des prix équitables. Les revendeurs Clearnet facturent souvent des majorations élevées ou expédient des stocks douteux.
            pt-PT: A concorrência na Little Biggy mantém a qualidade elevada e os preços justos. Os revendedores da Clearnet frequentemente cobram margens elevadas ou enviam stock duvidoso.
            it-IT: La concorrenza su Little Biggy mantiene alta la qualità e i prezzi equi. I rivenditori clearnet spesso applicano grandi ricavi o spedono stock discutibile.
            es-ES: La competencia en Little Biggy mantiene alta la calidad y los precios justos. Los distribuidores de clearnet suelen cobrar grandes sobrecargos o enviar stock cuestionable.
            el-GR: Ο ανταγωνισμός σε Little Biggy διατηρεί την ποιότητα υψηλή και τις τιμές δίκαιες. Οι μεταπωλητές Clearnet συχνά χρεώνουν μεγάλες προσαυξήσεις ή αποστέλλουν αμφισβητήσιμα αποθέματα.
            cs-CZ: Konkurence na Little Biggy udržuje vysokou kvalitu a ceny spravedlivé. Clearnet přeprodejci často účtují vysoké přirážky nebo posílají pochybný sortiment.
            pl-PL: Konkurencja na Little Biggy utrzymuje wysoką jakość i uczciwe ceny. Sprzedawcy Clearnet często pobierają wysokie marże lub wysyłają wątpliwy towar.
        legality:
          q:
            en-GB: What about UK legality?
            en-IE: What about Irish legality?
            de-DE: Wie sieht es mit der Rechtslage in Deutschland aus?
            fr-FR: Qu’en est-il de la légalité en France ?
            pt-PT: E quanto à legalidade em Portugal?
            it-IT: E la legalità in Italia?
            es-ES: ¿Y qué hay de la legalidad en España?
            el-GR: Τι ισχύει με τη νομιμότητα στην Ελλάδα;
            cs-CZ: A co legálnost v Česku?
            pl-PL: A co z legalnością w Polsce?
            en-NL: What about Dutch legality?
          a:
            en-GB: Cannabis laws still apply. You are responsible for staying within local regulations and verifying every detail on Little Biggy.
            de-DE: Die Cannabisgesetze gelten weiterhin. Sie sind dafür verantwortlich, sich an die lokalen Vorschriften zu halten und jedes Detail Little Biggy zu überprüfen.
            fr-FR: Les lois sur le cannabis s’appliquent toujours. Vous êtes responsable de respecter les réglementations locales et de vérifier chaque détail de Little Biggy.
            pt-PT: As leis da canábis continuam a aplicar-se. É responsável por cumprir as regulamentações locais e verificar todos os detalhes sobre Little Biggy.
            it-IT: Le leggi sulla cannabis sono ancora valide. Sei responsabile di rispettare le normative locali e di verificare ogni dettaglio Little Biggy.
            es-ES: Las leyes sobre cannabis siguen vigentes. Eres responsable de cumplir con la normativa local y verificar cada detalle de Little Biggy.
            el-GR: Οι νόμοι για την κάνναβη εξακολουθούν να ισχύουν. Είστε υπεύθυνοι για την τήρηση των τοπικών κανονισμών και την επαλήθευση κάθε λεπτομέρειας σχετικά με Little Biggy.
            cs-CZ: Zákony o konopí stále platí. Jste odpovědní za dodržování místních předpisů a ověřování každého detailu Little Biggy.
            pl-PL: Przepisy dotyczące konopi nadal obowiązują. Jesteś odpowiedzialny za przestrzeganie lokalnych przepisów i weryfikację każdego szczegółu Little Biggy.
        # IE edition only. Prices are converted for reading; the payment
        # itself is unaffected, which is the whole point of the answer.
        euroPrices:
          q:
            en-GB: Are prices in euros, and can I pay in euros?
          a:
            en-GB: Prices on this edition are shown in euros, converted from the seller's asking price at the current exchange rate so you can compare listings at a glance. Payment itself is still Bitcoin only — no card, bank transfer or euro balance — so the amount you send is the Bitcoin equivalent at the moment you pay.
