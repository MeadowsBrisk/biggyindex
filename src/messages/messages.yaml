      en-GB: "BiggyIndex uses no analytics, advertising, or tracking cookies. The only storage on this site is functional — it keeps the site working and remembers your preferences."
      de-DE: "BiggyIndex verwendet keine Analytics-, Werbe- oder Tracking-Cookies. Der einzige Speicher auf dieser Seite ist funktional – er hält die Seite am Laufen und merkt sich Ihre Einstellungen."
      fr-FR: "BiggyIndex n’utilise aucun cookie d’analyse, de publicité ou de traçage. Le seul stockage sur ce site est fonctionnel — il fait fonctionner le site et mémorise vos préférences."
      pt-PT: "O BiggyIndex não usa cookies de analytics, publicidade ou rastreamento. O único armazenamento neste site é funcional — mantém o site a funcionar e memoriza as suas preferências."
      it-IT: "BiggyIndex non utilizza cookie di analisi, pubblicità o tracciamento. L’unica archiviazione su questo sito è funzionale: fa funzionare il sito e ricorda le tue preferenze."
      es-ES: "BiggyIndex no usa cookies de analítica, publicidad ni rastreo. El único almacenamiento en este sitio es funcional: mantiene el sitio en marcha y recuerda tus preferencias."
      el-GR: "Το BiggyIndex δεν χρησιμοποιεί cookies για analytics, διαφημίσεις ή παρακολούθηση. Η μόνη αποθήκευση σε αυτόν τον ιστότοπο είναι λειτουργική — διατηρεί τη λειτουργία του ιστότοπου και θυμάται τις προτιμήσεις σας."
      cs-CZ: "BiggyIndex nepoužívá žádné analytické, reklamní ani sledovací cookies. Jediné úložiště na tomto webu je funkční — udržuje web v chodu a pamatuje si vaše předvolby."
      pl-PL: "BiggyIndex nie używa plików cookie do statystyk, reklam ani śledzenia. Jedyna pamięć na tej stronie jest funkcjonalna — utrzymuje działanie strony i zapamiętuje Twoje preferencje."
