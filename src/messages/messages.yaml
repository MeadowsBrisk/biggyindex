    intro:
      en-GB: "Vapes sell per device, not per gram — sellers list 1g and 1ml carts interchangeably, so a weight comparison against flower would mislead. Typical single-cart asking prices:"
      de-DE: "Vapes werden pro Gerät verkauft, nicht pro Gramm — Verkäufer führen 1-g- und 1-ml-Kartuschen austauschbar, deshalb wäre ein Gewichtsvergleich mit Blüten irreführend. Typische Angebotspreise für eine einzelne Kartusche:"
      fr-FR: "Les vapes se vendent à l'unité, pas au gramme — les vendeurs listent indifféremment des cartouches de 1 g et de 1 ml, donc une comparaison au poids avec la fleur serait trompeuse. Prix demandés typiques pour une cartouche :"
      pt-PT: "Os vapes vendem-se por dispositivo, não por grama — os vendedores listam cartuchos de 1 g e de 1 ml indiferentemente, por isso uma comparação a peso com a flor seria enganadora. Preços pedidos típicos para um cartucho:"
      it-IT: "Le vape si vendono a dispositivo, non al grammo — i venditori elencano cartucce da 1 g e da 1 ml in modo intercambiabile, quindi un confronto a peso con i fiori sarebbe fuorviante. Prezzi richiesti tipici per una singola cartuccia:"
      es-ES: "Los vapeadores se venden por dispositivo, no por gramo — los vendedores listan cartuchos de 1 g y de 1 ml indistintamente, así que compararlos por peso con la flor sería engañoso. Precios pedidos típicos de un solo cartucho:"
      el-GR: "Τα vapes πωλούνται ανά συσκευή, όχι ανά γραμμάριο — οι πωλητές καταχωρούν κασέτες 1 g και 1 ml εναλλακτικά, οπότε μια σύγκριση κατά βάρος με το άνθος θα ήταν παραπλανητική. Τυπικές ζητούμενες τιμές για μία κασέτα:"
      cs-CZ: "Vape se prodává po kusech, ne na gramy — prodejci uvádějí 1g a 1ml náplně zaměnitelně, takže srovnání podle váhy s květy by bylo zavádějící. Typické požadované ceny za jednu náplň:"
      pl-PL: "E-papierosy sprzedaje się na sztuki, nie na gramy — sprzedawcy podają wkłady 1 g i 1 ml zamiennie, więc porównanie wagowe z suszem wprowadzałoby w błąd. Typowe ceny ofertowe pojedynczego wkładu:"
