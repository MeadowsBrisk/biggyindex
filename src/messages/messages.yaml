        summary:
          en-GB: Grab some Bitcoin so you're ready to check out.
          de-DE: Schnapp dir etwas Bitcoin, damit du startklar für die Bestellung bist.
          fr-FR: Procurez-vous du Bitcoin pour être prêt à passer commande.
          pt-PT: Compra algum Bitcoin para estares pronto para finalizar a compra.
          it-IT: Prendi un po' di Bitcoin così sarai pronto per l'acquisto.
          es-ES: Consigue algo de Bitcoin para estar listo para pagar.
          el-GR: Πάρτε λίγο Bitcoin για να είστε έτοιμοι για την παραγγελία.
          cs-CZ: Pořiďte si Bitcoin, abyste byli připraveni na nákup.
          pl-PL: Złap trochę Bitcoina, żeby być gotowym do zakupu.
        intro:
          en-GB: Little Biggy only accepts Bitcoin. You'll need to set up a way to buy some if you haven't already, so that you're ready to start ordering items.
          de-DE: Little Biggy akzeptiert nur Bitcoin. Du musst eine Möglichkeit einrichten, welche zu kaufen, falls du das noch nicht getan hast, damit du bereit bist, mit der Bestellung von Artikeln zu beginnen.
          fr-FR: Little Biggy n’accepte que le Bitcoin. Vous devrez mettre en place un moyen d’en acheter si ce n’est pas déjà fait, afin d’être prêt à commencer à commander des articles.
          pt-PT: Little Biggy só aceita Bitcoin. Terás de configurar uma forma de comprar alguns se ainda não o fizeste, para estares pronto para começar a encomendar artigos.
          it-IT: Little Biggy accetta solo Bitcoin. Dovrai impostare un modo per acquistarne un po' se non l'hai già fatto, così da essere pronto a iniziare a ordinare gli articoli.
          es-ES: Little Biggy solo acepta Bitcoin. Tendrás que configurar una forma de comprar algunos si aún no lo has hecho, para estar listo para empezar a pedir artículos.
          el-GR: Little Biggy δέχεται μόνο Bitcoin. Θα χρειαστεί να δημιουργήσετε έναν τρόπο για να αγοράσετε μερικά, αν δεν το έχετε κάνει ήδη, ώστε να είστε έτοιμοι να αρχίσετε να παραγγέλνετε αντικείμενα.
          cs-CZ: Little Biggy přijímá pouze Bitcoin. Pokud jste to ještě neudělali, budete si muset nastavit způsob, jak si nějaké koupit, abyste byli připraveni začít objednávat zboží.
          pl-PL: Little Biggy akceptuje tylko Bitcoina. Będziesz musiał wymyślić sposób na zakup kilku produktów, jeśli jeszcze tego nie zrobiłeś, żeby być gotowym do zamawiania produktów.
        easiestWay:
          heading:
            en-GB: Easiest way
            de-DE: Der einfachste Weg
            fr-FR: La méthode la plus simple
            pt-PT: A forma mais fácil
            it-IT: Il modo più semplice
            es-ES: La forma más fácil
            el-GR: Ο ευκολότερος τρόπος
            cs-CZ: Nejjednodušší způsob
            pl-PL: Najprostszy sposób
          text:
            en-GB: Apps you may already use, such as Revolut or Monzo, let you purchase Bitcoin inside the banking app in a few taps.
            de-DE: Apps, die Sie bereits nutzen, wie Revolut oder Monzo, ermöglichen es Ihnen, Bitcoin innerhalb der Banking-App mit wenigen Klicks zu kaufen.
            fr-FR: Des applications que vous utilisez peut-être déjà, comme Revolut ou Monzo, vous permettent d’acheter du Bitcoin dans l’application bancaire en quelques clics.
            pt-PT: Aplicações que já pode usar, como a Revolut ou a Monzo, permitem-lhe comprar Bitcoin dentro da aplicação bancária com apenas alguns toques.
            it-IT: App che potresti già usare, come Revolut o Monzo, ti permettono di acquistare Bitcoin all'interno dell'app bancaria con pochi tocchi.
            es-ES: Las aplicaciones que quizá ya uses, como Revolut o Monzo, te permiten comprar Bitcoin dentro de la app bancaria con unos pocos toques.
            el-GR: Οι εφαρμογές που μπορεί να χρησιμοποιείτε ήδη, όπως η Revolut ή η Monzo, σας επιτρέπουν να αγοράσετε Bitcoin μέσα στην τραπεζική εφαρμογή με λίγα αγγίγματα.
            cs-CZ: Aplikace, které už možná používáte, jako Revolut nebo Monzo, vám umožní nakupovat Bitcoin přímo v bankovní aplikaci několika kliknutími.
            pl-PL: Aplikacje, których już używasz, takie jak Revolut czy Monzo, pozwalają kupić Bitcoina w aplikacji bankowej za pomocą kilku kliknięć.
        otherOptions:
          heading:
            en-GB: Other popular options
            de-DE: Weitere beliebte Optionen
            fr-FR: Autres options populaires
            pt-PT: Outras opções populares
            it-IT: Altre opzioni popolari
            es-ES: Otras opciones populares
            el-GR: Άλλες δημοφιλείς επιλογές
            cs-CZ: Další oblíbené možnosti
            pl-PL: Inne popularne opcje
          text:
            en-GB: A crypto exchange such as Coinbase or Kraken works just as well. They operate a bit like an online currency bureau.
            de-DE: Eine Krypto-Börse wie Coinbase oder Kraken funktioniert genauso gut. Sie funktionieren ein bisschen wie ein Online-Währungsbüro.
            fr-FR: Une plateforme d’échange crypto comme Coinbase ou Kraken fonctionne tout aussi bien. Ils fonctionnent un peu comme un bureau de devises en ligne.
            pt-PT: Uma exchange de criptomoedas como a Coinbase ou a Kraken funciona igualmente bem. Funcionam um pouco como uma agência de moedas online.
            it-IT: Un exchange di criptovalute come Coinbase o Kraken funziona altrettanto bene. Funzionano un po' come un ufficio valuta online.
            es-ES: Un exchange de criptomonedas como Coinbase o Kraken funciona igual de bien. Funcionan un poco como una agencia de divisas online.
            el-GR: Ένα ανταλλακτήριο κρυπτογράφησης όπως το Coinbase ή το Kraken λειτουργεί εξίσου καλά. Λειτουργούν λίγο σαν ένα διαδικτυακό γραφείο συναλλάγματος.
            cs-CZ: Kryptoměnová burza jako Coinbase nebo Kraken funguje stejně dobře. Fungují trochu jako online měnový úřad.
            pl-PL: Giełda kryptowalut taka jak Coinbase czy Kraken sprawdza się równie dobrze. Działają trochę jak internetowe biuro walutowe.
        proTip:
          label:
            en-GB: "Pro tip:"
            de-DE: "Profi-Tipp:"
            fr-FR: "Astuce d’expert :"
            pt-PT: "Dica profissional:"
            it-IT: "Consiglio da esperto:"
            es-ES: "Consejo profesional:"
            el-GR: "Επαγγελματική συμβουλή:"
            cs-CZ: "Tip:"
            pl-PL: "Porada profesjonalna:"
          text:
            en-GB: Buy a few pounds more than you need and round up. That extra buffer covers network fees or crypto volatility.
            en-IE: Buy a few euro more than you need and round up. That extra buffer covers network fees or crypto volatility.
            de-DE: Kaufe für ein paar Euro mehr, als du brauchst, und runde auf. Dieser zusätzliche Puffer deckt Netzwerkgebühren oder Krypto-Volatilität ab.
            fr-FR: Achetez pour quelques euros de plus que nécessaire et arrondissez au supérieur. Cette marge supplémentaire couvre les frais de réseau ou la volatilité des cryptomonnaies.
            pt-PT: Compra alguns euros a mais do que precisas e arredonda para cima. Esse buffer extra cobre as taxas de rede ou a volatilidade das criptomoedas.
            it-IT: Compra qualche euro in più di quanto ti serve e arrotonda per eccesso. Quel buffer extra copre le commissioni di rete o la volatilità delle criptovalute.
            es-ES: Compra unos pocos euros más de los que necesitas y redondea al alza. Ese colchón extra cubre las comisiones de la red o la volatilidad de las criptomonedas.
            el-GR: Αγοράστε μερικά ευρώ παραπάνω από όσα χρειάζεστε και στρογγυλοποιήστε προς τα πάνω. Αυτό το επιπλέον buffer καλύπτει τα τέλη δικτύου ή τη μεταβλητότητα των κρυπτονομισμάτων.
            cs-CZ: Kupte si o pár korun víc, než potřebujete, a zaokrouhlete nahoru. Tato dodatečná rezerva pokrývá síťové poplatky nebo volatilitu kryptoměn.
            pl-PL: Kup za kilka złotych więcej niż potrzebujesz i zaokrąglij w górę. Ten dodatkowy bufor pokrywa opłaty sieciowe lub zmienność kryptowalut.
