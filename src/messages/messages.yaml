          fr-FR: Au moment du paiement, Little Biggy affiche une page de commande privée avec tout ce dont vous avez besoin pour payer en toute sécurité, que vous soyez sur un seul appareil ou que vous passiez du téléphone au bureau.
          pt-PT: No checkout, Little Biggy mostra uma página de encomenda privada com tudo o que precisa para pagar em segurança, quer esteja num só dispositivo ou a alternar entre telemóvel e computador.
