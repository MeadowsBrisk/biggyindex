      es-ES: Pausar GIFs
      el-GR: Παύση GIF
      cs-CZ: Pozastavit GIFy
      pl-PL: Wstrzymaj GIF-y
    pauseGifsDescription:
      en-GB: Show static thumbnails for animated images. Reduces distraction and saves battery.
      de-DE: Zeigen Sie statische Vorschaubilder für animierte Bilder. Reduziert Ablenkung und spart Akku.
      fr-FR: Affichez des vignettes statiques pour les images animées. Réduit les distractions et économise de la batterie.
      pt-PT: Mostrar miniaturas estáticas para imagens animadas. Reduz distrações e poupa bateria.
      it-IT: Mostra miniature statiche per immagini animate. Riduce le distrazioni e risparmia batteria.
      es-ES: Muestra miniaturas estáticas para imágenes animadas. Reduce la distracción y ahorra batería.
      el-GR: Εμφάνιση στατικών μικρογραφιών για κινούμενες εικόνες. Μειώνει την απόσπαση της προσοχής και εξοικονομεί μπαταρία.
      cs-CZ: Zobrazit statické náhledy animovaných obrázků. Snižuje rušivé vlivy a šetří baterii.
      pl-PL: Pokazuj statyczne miniatury animowanych obrazów. Zmniejsza rozpraszanie i oszczędza baterię.
    showInEnglish:
      en-GB: Show in English
      de-DE: Auf Englisch anzeigen
      fr-FR: Afficher en anglais
      pt-PT: Mostrar em inglês
      it-IT: Mostra in inglese
      es-ES: Mostrar en inglés
      el-GR: Εμφάνιση στα Αγγλικά
      cs-CZ: Zobrazit v angličtině
      pl-PL: Pokaż po angielsku
    showInEnglishDescription:
      en-GB: Use English UI copy and original product names/descriptions where available.
      de-DE: Englischen UI-Text und originale Produktnamen/-beschreibungen verwenden, wenn verfügbar.
      fr-FR: Utiliser le texte anglais et les noms/descriptions d’origine des produits lorsque disponibles.
      pt-PT: Utiliza o texto em inglês e os nomes/descrições originais dos produtos, quando disponíveis.
      it-IT: Usa il testo in inglese e i nomi/le descrizioni originali dei prodotti, quando disponibili.
      es-ES: Usa el texto en inglés y los nombres/descripciones originales del producto cuando estén disponibles.
      el-GR: Χρήση κειμένου στα Αγγλικά και πρωτότυπων ονομάτων/περιγραφών προϊόντων όταν είναι διαθέσιμα.
      cs-CZ: Použít anglický text a původní názvy a popisy produktů, pokud jsou k dispozici.
      pl-PL: Używaj angielskiej kopii interfejsu oraz oryginalnych nazw/opisów produktów, jeśli są dostępne.
    skipGuides:
      en-GB: Skip help guides
      de-DE: Hilfe-Tipps überspringen
      fr-FR: Ignorer les guides d'aide
      pt-PT: Saltar guias de ajuda
