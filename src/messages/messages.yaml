      de-DE: Little Biggy offline oder langsam? Du kannst hier trotzdem jedes Angebot durchstöbern — Preise, Bewertungen und Verkäuferwertungen, ganz ohne Login.
      fr-FR: Little Biggy en panne ou lent ? Tu peux quand même parcourir toutes les annonces ici — prix, avis et notes des vendeurs, sans connexion.
      pt-PT: Little Biggy em baixo ou lento? Podes na mesma explorar todos os anúncios aqui — preços, avaliações e classificações de vendedores, sem início de sessão.
      it-IT: Little Biggy offline o lento? Puoi comunque esplorare tutti gli annunci qui — prezzi, recensioni e valutazioni dei venditori, senza accesso.
      es-ES: ¿Little Biggy caído o lento? Aun así puedes explorar todos los anuncios aquí — precios, reseñas y valoraciones de vendedores, sin iniciar sesión.
      el-GR: Το Little Biggy έπεσε ή είναι αργό; Μπορείτε ακόμα να δείτε όλες τις καταχωρίσεις εδώ — τιμές, κριτικές και βαθμολογίες πωλητών, χωρίς σύνδεση.
      cs-CZ: Little Biggy nefunguje nebo je pomalý? I tak si tu můžete projít všechny nabídky — ceny, recenze a hodnocení prodejců, bez přihlášení.
      pl-PL: Little Biggy nie działa lub jest wolny? Nadal możesz przeglądać tu wszystkie oferty — ceny, recenzje i oceny sprzedawców, bez logowania.
