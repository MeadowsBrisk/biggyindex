    pauseGifsDescription:
      en-GB: Show static thumbnails for animated images. Reduces distraction and saves battery.
      de-DE: Zeigen Sie statische Vorschaubilder für animierte Bilder. Reduziert Ablenkung und spart Akku.
      fr-FR: Affichez des vignettes statiques pour les images animées. Réduit les distractions et économise de la batterie.
      pt-PT: Mostrar miniaturas estáticas para imagens animadas. Reduz distrações e poupa bateria.
      it-IT: Mostra miniature statiche per immagini animate. Riduce le distrazioni e risparmia batteria.
      es-ES: Muestra miniaturas estáticas para imágenes animadas. Reduce la distracción y ahorra batería.
      el-GR: Εμφάνιση στατικών μικρογραφιών για κινούμενες εικόνες. Μειώνει την απόσπαση της προσοχής και εξοικονομεί μπαταρία.
      cs-CZ: Zobrazit statické náhledy animovaných obrázků. Snižuje rušivé vlivy a šetří baterii.
      pl-PL: Pokazuj statyczne miniatury animowanych obrazów. Zmniejsza rozpraszanie i oszczędza baterię.
