        en-GB: "The median asking price for a 28g ounce of flower is {price}. Ounces are priced well below the single-gram rate, so the figure is nothing like 28 times the 1g price — the weight table above shows every size side by side."
        de-DE: "Der Median-Angebotspreis für eine 28-g-Unze Blüten liegt bei {price}. Unzen werden deutlich unter dem Einzelgramm-Preis gehandelt, die Zahl ist also bei Weitem nicht das 28-Fache des 1-g-Preises — die Gewichtstabelle oben zeigt alle Mengen nebeneinander."
        fr-FR: "Le prix demandé médian pour une once de 28 g de fleur est de {price}. Les onces se vendent bien en dessous du tarif au gramme à l'unité : le chiffre n'a rien à voir avec 28 fois le prix du 1 g — le tableau des quantités ci-dessus les compare toutes."
        pt-PT: "O preço pedido mediano de uma onça de 28 g de flor é {price}. As onças ficam bem abaixo do preço de um único grama, por isso o valor não é nada parecido com 28 vezes o preço de 1 g — a tabela de pesos acima mostra todos os tamanhos lado a lado."
        it-IT: "Il prezzo richiesto mediano per un'oncia da 28 g di fiori è {price}. Le once costano ben meno della tariffa al singolo grammo, quindi la cifra non è affatto 28 volte il prezzo di 1 g — la tabella dei pesi qui sopra mette a confronto tutte le quantità."
        es-ES: "El precio pedido mediano de una onza de 28 g de flor es {price}. Las onzas se venden muy por debajo de la tarifa de un solo gramo, así que la cifra no se parece en nada a 28 veces el precio de 1 g — la tabla de pesos de arriba muestra todas las cantidades juntas."
        el-GR: "Η διάμεση ζητούμενη τιμή για μια ουγγιά 28 g άνθους είναι {price}. Οι ουγγιές τιμολογούνται πολύ χαμηλότερα από την τιμή του ενός γραμμαρίου, οπότε το ποσό δεν είναι καθόλου 28 φορές η τιμή του 1 g — ο πίνακας βαρών παραπάνω δείχνει όλες τις ποσότητες μαζί."
        cs-CZ: "Medián požadované ceny za 28g unci květů je {price}. Unce se prodávají výrazně pod cenou jednoho gramu, takže částka není zdaleka 28násobek ceny za 1 g — tabulka vah výše ukazuje všechny velikosti vedle sebe."
        pl-PL: "Mediana ceny ofertowej za uncję 28 g suszu wynosi {price}. Uncje kosztują znacznie mniej niż stawka za pojedynczy gram, więc kwota nijak nie odpowiada 28-krotności ceny za 1 g — tabela wag powyżej pokazuje wszystkie rozmiary obok siebie."
      # Used when too few listings quote a 28g flower option to be honest
      # about an ounce price; the figure passed in is the overall per-gram median.
      aPerGram:
        en-GB: "Not enough listings quote a 28g flower option to give an honest ounce price for this market right now. The median asking price across all weight-priced listings is {price} per gram."
        de-DE: "Zu wenige Angebote führen derzeit eine 28-g-Option für Blüten, um einen ehrlichen Unzenpreis für diesen Markt zu nennen. Der Median-Angebotspreis über alle nach Gewicht ausgezeichneten Angebote liegt bei {price} pro Gramm."
        fr-FR: "Trop peu d'annonces proposent une option 28 g de fleur pour donner un prix honnête à l'once sur ce marché en ce moment. Le prix demandé médian sur l'ensemble des annonces vendues au poids est de {price} par gramme."
        pt-PT: "Há poucos anúncios com opção de 28 g de flor para dar um preço honesto por onça neste mercado neste momento. O preço pedido mediano em todos os anúncios vendidos a peso é de {price} por grama."
        it-IT: "Al momento troppo pochi annunci offrono un'opzione da 28 g di fiori per dare un prezzo onesto all'oncia in questo mercato. Il prezzo richiesto mediano su tutti gli annunci venduti a peso è di {price} al grammo."
        es-ES: "Ahora mismo hay muy pocos anuncios con opción de 28 g de flor como para dar un precio honesto por onza en este mercado. El precio pedido mediano en todos los anuncios vendidos por peso es de {price} por gramo."
        el-GR: "Αυτή τη στιγμή δεν υπάρχουν αρκετές καταχωρίσεις με επιλογή 28 g άνθους ώστε να δοθεί μια ειλικρινής τιμή ουγγιάς για αυτήν την αγορά. Η διάμεση ζητούμενη τιμή σε όλες τις καταχωρίσεις με τιμή κατά βάρος είναι {price} ανά γραμμάριο."
        cs-CZ: "Momentálně nabízí variantu 28 g květů příliš málo nabídek, než aby šlo pro tento trh uvést poctivou cenu za unci. Medián požadované ceny napříč všemi nabídkami s cenou podle váhy je {price} za gram."
        pl-PL: "W tej chwili zbyt mało ofert zawiera wariant 28 g suszu, by podać uczciwą cenę uncji dla tego rynku. Mediana ceny ofertowej we wszystkich ofertach wycenianych wagowo wynosi {price} za gram."
    hashGram:
      q:
        en-GB: "How much is hash per gram?"
        de-DE: "Wie viel kostet Hash pro Gramm?"
        fr-FR: "Combien coûte le hash au gramme ?"
        pt-PT: "Quanto custa o haxixe por grama?"
        it-IT: "Quanto costa l'hash al grammo?"
        es-ES: "¿Cuánto cuesta el hachís por gramo?"
        el-GR: "Πόσο κοστίζει το χασίς ανά γραμμάριο;"
        cs-CZ: "Kolik stojí hash za gram?"
        pl-PL: "Ile kosztuje haszysz za gram?"
      a:
        en-GB: "The median hash asking price is {price} per gram, taken from every gram-denominated hash option indexed for this market. Single grams sit above that figure and bulk sizes below it."
        de-DE: "Der Median-Angebotspreis für Hash liegt bei {price} pro Gramm, ermittelt aus allen in Gramm ausgezeichneten Hash-Optionen, die für diesen Markt indexiert sind. Einzelne Gramm liegen darüber, größere Mengen darunter."
        fr-FR: "Le prix demandé médian du hash est de {price} par gramme, calculé sur toutes les options de hash libellées en grammes indexées pour ce marché. Les grammes à l'unité se situent au-dessus de ce chiffre et les gros formats en dessous."
        pt-PT: "O preço pedido mediano do haxixe é de {price} por grama, calculado a partir de todas as opções de haxixe expressas em gramas indexadas para este mercado. Os gramas avulso ficam acima desse valor e os formatos maiores abaixo."
        it-IT: "Il prezzo richiesto mediano dell'hash è di {price} al grammo, calcolato su tutte le opzioni di hash espresse in grammi indicizzate per questo mercato. I singoli grammi stanno sopra quella cifra e i formati grandi sotto."
        es-ES: "El precio pedido mediano del hachís es de {price} por gramo, calculado a partir de todas las opciones de hachís expresadas en gramos indexadas para este mercado. Los gramos sueltos quedan por encima de esa cifra y los formatos grandes por debajo."
        el-GR: "Η διάμεση ζητούμενη τιμή του χασίς είναι {price} ανά γραμμάριο, από όλες τις επιλογές χασίς σε γραμμάρια που είναι ευρετηριασμένες για αυτήν την αγορά. Τα μεμονωμένα γραμμάρια βρίσκονται πάνω από αυτό το ποσό και οι μεγάλες ποσότητες κάτω."
        cs-CZ: "Medián požadované ceny hašiše je {price} za gram, spočítaný ze všech gramových variant hašiše indexovaných pro tento trh. Jednotlivé gramy leží nad touto částkou, větší balení pod ní."
        pl-PL: "Mediana ceny ofertowej haszyszu to {price} za gram, obliczona ze wszystkich wariantów haszyszu wyrażonych w gramach zaindeksowanych dla tego rynku. Pojedyncze gramy są powyżej tej kwoty, a większe ilości poniżej."
    vapeCart:
      q:
        en-GB: "How much is a vape cart?"
        de-DE: "Wie viel kostet eine Vape-Kartusche?"
        fr-FR: "Combien coûte une cartouche de vape ?"
        pt-PT: "Quanto custa um cartucho de vape?"
        it-IT: "Quanto costa una cartuccia vape?"
        es-ES: "¿Cuánto cuesta un cartucho de vapeador?"
        el-GR: "Πόσο κοστίζει μια κασέτα vape;"
        cs-CZ: "Kolik stojí vape náplň?"
        pl-PL: "Ile kosztuje wkład do e-papierosa?"
      a:
        en-GB: "A single {size} cart has a median asking price of {price}. Carts are priced per device rather than by weight, so comparing one against a per-gram flower figure would mislead."
        de-DE: "Eine einzelne Kartusche mit {size} hat einen Median-Angebotspreis von {price}. Kartuschen werden pro Gerät und nicht nach Gewicht bepreist, ein Vergleich mit dem Grammpreis von Blüten wäre daher irreführend."
        fr-FR: "Une cartouche de {size} a un prix demandé médian de {price}. Les cartouches sont vendues à l'unité et non au poids, la comparer à un prix au gramme de fleur serait donc trompeur."
        pt-PT: "Um cartucho de {size} tem um preço pedido mediano de {price}. Os cartuchos são vendidos por dispositivo e não a peso, por isso compará-los com um valor por grama de flor seria enganador."
        it-IT: "Una singola cartuccia da {size} ha un prezzo richiesto mediano di {price}. Le cartucce si vendono a dispositivo e non a peso, quindi confrontarle con una cifra al grammo dei fiori sarebbe fuorviante."
        es-ES: "Un solo cartucho de {size} tiene un precio pedido mediano de {price}. Los cartuchos se venden por dispositivo y no por peso, así que compararlos con una cifra por gramo de flor sería engañoso."
        el-GR: "Μία κασέτα {size} έχει διάμεση ζητούμενη τιμή {price}. Οι κασέτες τιμολογούνται ανά συσκευή και όχι κατά βάρος, οπότε η σύγκριση με τιμή ανά γραμμάριο άνθους θα ήταν παραπλανητική."
        cs-CZ: "Jedna náplň {size} má medián požadované ceny {price}. Náplně se cení po kusech, ne podle váhy, takže srovnání s cenou květů za gram by bylo zavádějící."
        pl-PL: "Pojedynczy wkład {size} ma medianę ceny ofertowej {price}. Wkłady wycenia się na sztuki, a nie wagowo, więc porównywanie ich z ceną suszu za gram wprowadzałoby w błąd."
    real:
      q:
        en-GB: "Are these real sale prices?"
        de-DE: "Sind das echte Verkaufspreise?"
        fr-FR: "S'agit-il de vrais prix de vente ?"
        pt-PT: "Estes são preços de venda reais?"
        it-IT: "Sono prezzi di vendita reali?"
        es-ES: "¿Son precios de venta reales?"
        el-GR: "Είναι αυτές πραγματικές τιμές πώλησης;"
        cs-CZ: "Jsou to skutečné prodejní ceny?"
        pl-PL: "Czy to rzeczywiste ceny sprzedaży?"
      a:
        en-GB: "No — they are asking prices. Every figure is what a seller lists an option at, read from live Little Biggy listings, converted to the market currency and reduced to a median. Nothing here comes from completed sales, and it is not a street-price survey."
        de-DE: "Nein — es sind Angebotspreise. Jede Zahl ist der Preis, zu dem ein Verkäufer eine Option anbietet, ausgelesen aus aktuellen Little Biggy Angeboten, in die Marktwährung umgerechnet und zum Median zusammengefasst. Nichts davon stammt aus abgeschlossenen Verkäufen, und es ist keine Straßenpreis-Erhebung."
        fr-FR: "Non — ce sont des prix demandés. Chaque chiffre correspond au prix auquel un vendeur propose une option, relevé sur les annonces Little Biggy en direct, converti dans la devise du marché et ramené à une médiane. Rien ne provient de ventes conclues, et ce n'est pas une enquête sur les prix de rue."
        pt-PT: "Não — são preços pedidos. Cada valor é aquele a que um vendedor anuncia uma opção, lido dos anúncios Little Biggy em tempo real, convertido para a moeda do mercado e reduzido a uma mediana. Nada aqui vem de vendas concluídas e não é um inquérito a preços de rua."
        it-IT: "No — sono prezzi richiesti. Ogni cifra è il prezzo a cui un venditore propone un'opzione, letto dagli annunci Little Biggy in tempo reale, convertito nella valuta del mercato e ridotto a una mediana. Nulla proviene da vendite concluse e non è un'indagine sui prezzi di strada."
        es-ES: "No — son precios pedidos. Cada cifra es el precio al que un vendedor anuncia una opción, leído de los anuncios de Little Biggy en directo, convertido a la moneda del mercado y reducido a una mediana. Nada de esto procede de ventas cerradas ni es un estudio de precios de calle."
        el-GR: "Όχι — είναι ζητούμενες τιμές. Κάθε ποσό είναι η τιμή στην οποία ένας πωλητής προσφέρει μια επιλογή, από ζωντανές καταχωρίσεις του Little Biggy, μετατρεμμένη στο νόμισμα της αγοράς και συνοψισμένη σε διάμεσο. Τίποτα εδώ δεν προέρχεται από ολοκληρωμένες πωλήσεις και δεν πρόκειται για έρευνα τιμών του δρόμου."
        cs-CZ: "Ne — jsou to požadované ceny. Každé číslo je cena, za kterou prodejce variantu nabízí, načtená z aktuálních nabídek na Little Biggy, převedená na měnu trhu a shrnutá do mediánu. Nic zde nepochází z uskutečněných prodejů a nejde o průzkum pouličních cen."
        pl-PL: "Nie — to ceny ofertowe. Każda liczba to cena, za jaką sprzedawca wystawia dany wariant, odczytana z aktualnych ofert na Little Biggy, przeliczona na walutę rynku i sprowadzona do mediany. Nic tu nie pochodzi z zakończonych transakcji i nie jest to badanie cen ulicznych."
  methodology:
    heading:
      en-GB: Methodology
      de-DE: Methodik
      fr-FR: Méthodologie
      pt-PT: Metodologia
      it-IT: Metodologia
      es-ES: Metodología
      el-GR: Μεθοδολογία
      cs-CZ: Metodika
      pl-PL: Metodologia
    source:
      en-GB: "Prices are asking prices from live Little Biggy listings, indexed by BiggyIndex."
      de-DE: "Die Preise sind Angebotspreise aus aktuellen Little Biggy Angeboten, indexiert von BiggyIndex."
      fr-FR: "Les prix sont des prix demandés, relevés sur les annonces Little Biggy en direct et indexés par BiggyIndex."
      pt-PT: "Os preços são preços pedidos em anúncios Little Biggy em tempo real, indexados pelo BiggyIndex."
      it-IT: "I prezzi sono prezzi richiesti negli annunci Little Biggy in tempo reale, indicizzati da BiggyIndex."
      es-ES: "Los precios son precios pedidos en anuncios de Little Biggy en directo, indexados por BiggyIndex."
      el-GR: "Οι τιμές είναι ζητούμενες τιμές από ζωντανές καταχωρίσεις του Little Biggy, ευρετηριασμένες από το BiggyIndex."
      cs-CZ: "Ceny jsou požadované ceny z aktuálních nabídek na Little Biggy, indexované službou BiggyIndex."
      pl-PL: "Ceny to ceny ofertowe z aktualnych ofert na Little Biggy, indeksowane przez BiggyIndex."
    scope:
      en-GB: "Per-gram statistics include flower, shake, hash and concentrates only. Vapes are quoted per cart and distillate per ml; edibles and other products are excluded because their listed weight is not cannabis weight."
      de-DE: "Die Grammstatistiken umfassen nur Blüten, Shake, Hash und Konzentrate. Vapes werden pro Kartusche ausgewiesen, Destillat pro ml; essbare Produkte und andere Kategorien bleiben außen vor, weil ihr angegebenes Gewicht nicht das Cannabis-Gewicht ist."
      fr-FR: "Les statistiques au gramme ne couvrent que la fleur, le shake, le hash et les concentrés. Les vapes sont données à la cartouche et le distillat au ml ; les comestibles et les autres produits sont exclus car le poids indiqué n'est pas celui du cannabis."
      pt-PT: "As estatísticas por grama incluem apenas flor, shake, haxixe e concentrados. Os vapes são indicados por cartucho e o destilado por ml; os comestíveis e outros produtos ficam de fora porque o peso indicado não é o peso da canábis."
      it-IT: "Le statistiche al grammo comprendono solo fiori, shake, hash e concentrati. Le vape sono indicate a cartuccia e il distillato al ml; edibili e altri prodotti sono esclusi perché il peso indicato non è quello della cannabis."
      es-ES: "Las estadísticas por gramo incluyen solo flor, shake, hachís y concentrados. Los vapeadores se indican por cartucho y el destilado por ml; los comestibles y otros productos quedan fuera porque su peso indicado no es el peso del cannabis."
      el-GR: "Τα στατιστικά ανά γραμμάριο περιλαμβάνουν μόνο άνθη, σέικ, χασίς και συμπυκνώματα. Τα vapes δίνονται ανά κασέτα και το απόσταγμα ανά ml· τα βρώσιμα και τα υπόλοιπα προϊόντα εξαιρούνται, επειδή το αναγραφόμενο βάρος τους δεν είναι βάρος κάνναβης."
      cs-CZ: "Statistiky za gram zahrnují jen květy, shake, hash a koncentráty. Vape se uvádí za náplň a destilát za ml; jedlé produkty a ostatní kategorie jsou vyloučené, protože jejich uvedená váha není váhou konopí."
      pl-PL: "Statystyki za gram obejmują wyłącznie susz, shake, hash i koncentraty. E-papierosy podajemy za wkład, a destylat za ml; edibles i pozostałe produkty są wyłączone, bo ich podana waga nie jest wagą konopi."
    inclusion:
      en-GB: "Only listings with a weight-denominated option count; price per gram = listed price ÷ grams for each option. Placeholder prices and implausible per-gram figures are dropped."
      de-DE: "Es zählen nur Angebote mit einer nach Gewicht ausgezeichneten Option; Preis pro Gramm = angegebener Preis ÷ Gramm je Option. Platzhalterpreise und unplausible Grammpreise werden verworfen."
      fr-FR: "Seules les annonces comportant une option libellée au poids sont prises en compte ; prix au gramme = prix affiché ÷ grammes pour chaque option. Les prix fictifs et les valeurs au gramme invraisemblables sont écartés."
      pt-PT: "Só contam os anúncios com uma opção expressa em peso; preço por grama = preço indicado ÷ gramas em cada opção. Preços fictícios e valores por grama implausíveis são descartados."
      it-IT: "Contano solo gli annunci con un'opzione espressa a peso; prezzo al grammo = prezzo indicato ÷ grammi per ogni opzione. Prezzi fittizi e valori al grammo non plausibili vengono scartati."
      es-ES: "Solo cuentan los anuncios con una opción expresada por peso; precio por gramo = precio indicado ÷ gramos en cada opción. Los precios ficticios y las cifras por gramo poco creíbles se descartan."
      el-GR: "Μετρούν μόνο οι καταχωρίσεις με επιλογή εκφρασμένη σε βάρος· τιμή ανά γραμμάριο = αναγραφόμενη τιμή ÷ γραμμάρια για κάθε επιλογή. Εικονικές τιμές και μη ρεαλιστικά ποσά ανά γραμμάριο απορρίπτονται."
      cs-CZ: "Počítají se jen nabídky s variantou udanou podle váhy; cena za gram = uvedená cena ÷ gramy u každé varianty. Zástupné ceny a nepravděpodobné částky za gram se vyřazují."
      pl-PL: "Liczą się tylko oferty z wariantem podanym wagowo; cena za gram = podana cena ÷ gramy dla każdego wariantu. Ceny zastępcze i nieprawdopodobne kwoty za gram są odrzucane."
    refresh:
      en-GB: "Figures refresh with the index, roughly hourly, and follow listings as sellers reprice them."
      de-DE: "Die Zahlen aktualisieren sich mit dem Index, etwa stündlich, und folgen den Angeboten, wenn Verkäufer die Preise ändern."
      fr-FR: "Les chiffres se rafraîchissent avec l'index, environ toutes les heures, et suivent les annonces lorsque les vendeurs modifient leurs prix."
      pt-PT: "Os valores atualizam-se com o índice, cerca de uma vez por hora, e acompanham os anúncios sempre que os vendedores mudam os preços."
      it-IT: "Le cifre si aggiornano con l'indice, circa ogni ora, e seguono gli annunci quando i venditori cambiano i prezzi."
      es-ES: "Las cifras se actualizan con el índice, aproximadamente cada hora, y siguen a los anuncios cuando los vendedores cambian los precios."
      el-GR: "Τα στοιχεία ανανεώνονται μαζί με τον δείκτη, περίπου κάθε ώρα, και ακολουθούν τις καταχωρίσεις όταν οι πωλητές αλλάζουν τιμές."
      cs-CZ: "Čísla se obnovují spolu s indexem, zhruba každou hodinu, a sledují nabídky, když prodejci mění ceny."
      pl-PL: "Dane odświeżają się razem z indeksem, mniej więcej co godzinę, i śledzą oferty, gdy sprzedawcy zmieniają ceny."
    honesty:
      en-GB: "These are the prices sellers ask, not a street-price survey and not completed-sale data."
      de-DE: "Das sind die Preise, die Verkäufer verlangen — keine Straßenpreis-Erhebung und keine Daten aus abgeschlossenen Verkäufen."
      fr-FR: "Ce sont les prix demandés par les vendeurs, pas une enquête sur les prix de rue ni des données de ventes conclues."
      pt-PT: "Estes são os preços que os vendedores pedem, não um inquérito a preços de rua nem dados de vendas concluídas."
      it-IT: "Questi sono i prezzi che i venditori chiedono, non un'indagine sui prezzi di strada né dati di vendite concluse."
      es-ES: "Estos son los precios que piden los vendedores, no un estudio de precios de calle ni datos de ventas cerradas."
      el-GR: "Αυτές είναι οι τιμές που ζητούν οι πωλητές, όχι έρευνα τιμών του δρόμου ούτε δεδομένα ολοκληρωμένων πωλήσεων."
      cs-CZ: "Jsou to ceny, které prodejci požadují — ne průzkum pouličních cen ani data o uskutečněných prodejích."
      pl-PL: "To ceny, których żądają sprzedawcy — nie badanie cen ulicznych ani dane o zrealizowanych transakcjach."
