        intro:
          en-GB: Little Biggy only accepts Bitcoin. You'll need to set up a way to buy some if you haven't already, so that you're ready to start ordering items.
          de-DE: Little Biggy akzeptiert nur Bitcoin. Du musst eine Möglichkeit einrichten, welche zu kaufen, falls du das noch nicht getan hast, damit du bereit bist, mit der Bestellung von Artikeln zu beginnen.
          fr-FR: Little Biggy n’accepte que le Bitcoin. Vous devrez mettre en place un moyen d’en acheter si ce n’est pas déjà fait, afin d’être prêt à commencer à commander des articles.
          pt-PT: Little Biggy só aceita Bitcoin. Terás de configurar uma forma de comprar alguns se ainda não o fizeste, para estares pronto para começar a encomendar artigos.
          it-IT: Little Biggy accetta solo Bitcoin. Dovrai impostare un modo per acquistarne un po' se non l'hai già fatto, così da essere pronto a iniziare a ordinare gli articoli.
          es-ES: Little Biggy solo acepta Bitcoin. Tendrás que configurar una forma de comprar algunos si aún no lo has hecho, para estar listo para empezar a pedir artículos.
          el-GR: Little Biggy δέχεται μόνο Bitcoin. Θα χρειαστεί να δημιουργήσετε έναν τρόπο για να αγοράσετε μερικά, αν δεν το έχετε κάνει ήδη, ώστε να είστε έτοιμοι να αρχίσετε να παραγγέλνετε αντικείμενα.
          cs-CZ: Little Biggy přijímá pouze Bitcoin. Pokud jste to ještě neudělali, budete si muset nastavit způsob, jak si nějaké koupit, abyste byli připraveni začít objednávat zboží.
          pl-PL: Little Biggy akceptuje tylko Bitcoina. Będziesz musiał wymyślić sposób na zakup kilku produktów, jeśli jeszcze tego nie zrobiłeś, żeby być gotowym do zamawiania produktów.
