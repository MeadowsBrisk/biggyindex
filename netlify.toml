[build]
  command = "yarn run build"
  publish = ".next"

[build.environment]
  # Secrets scanner false positives. These are either NEXT_PUBLIC_* values
  # (intentionally shipped to the browser) or non-sensitive bucket names —
  # not credentials. The real secrets (R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY)
  # remain scanned.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_R2_DATA_URL,NEXT_PUBLIC_R2_IMAGES_URL,NEXT_PUBLIC_SUGGESTIONS_API,R2_DATA_V2_BUCKET,R2_IMAGES_BUCKET"

# ---------------------------------------------------------------------------
# v1 → v2 redirect map (SEO recovery).
#
# These MUST live here, not (only) in next.config.ts redirects(): on Netlify
# the next-intl proxy runs as an edge function BEFORE the origin, rewriting
# /home → /en-GB/home so the config redirect source never matches. CDN-level
# rules run before the edge function and win. (next.config.ts keeps a mirror
# of these rules for portability; only dot-containing paths like
# /sitemap-*.xml actually fire there because the proxy matcher skips them.)
#
# Rules are host-relative except the locale-prefix ones, so every market
# subdomain redirects its own legacy paths. First match wins.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/latest-reviews"
  to = "/reviews"
  status = 301
  force = true

# v1 localized item/seller paths
[[redirects]]
  from = "/produit/*"
  to = "/item/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/produkt/*"
  to = "/item/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/prodotto/*"
  to = "/item/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/produto/*"
  to = "/item/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/producto/*"
  to = "/item/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/vendeur/*"
  to = "/seller/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/verkaeufer/*"
  to = "/seller/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/venditore/*"
  to = "/seller/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/vendedor/*"
  to = "/seller/:splat"
  status = 301
  force = true

# v1 apex locale-prefix paths → market subdomains. /xx/home first (single
# hop for the commonest legacy URL), then the generic prefix rule; the bare
# prefix (/de) needs its own rule because the splat form only matches /de/….
[[redirects]]
  from = "/de"
  to = "https://de.biggyindex.com/"
  status = 301
  force = true

[[redirects]]
  from = "/de/home"
  to = "https://de.biggyindex.com/"
  status = 301
  force = true

[[redirects]]
  from = "/de/*"
  to = "https://de.biggyindex.com/:splat"
  status = 301
  force = true

